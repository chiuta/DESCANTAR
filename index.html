D('about_txt','Aplicație offline dintr-un singur fișier: fără cont, fără urmărire, fără reclame. Istoricul rămâne doar în browserul tău. Interpretările și descântecele sunt scrise în spiritul folclorului românesc, nu sunt copii ale unor culegeri.','Offline single-file app: no account, no tracking, no ads. Your history stays in your browser only. The readings and charms are written in the spirit of Romanian folklore, not copied from collections.','Application hors ligne en un seul fichier : sans compte, sans pistage, sans publicité. L\'historique reste dans votre navigateur. Les lectures et incantations sont écrites dans l\'esprit du folklore roumain, sans copier de recueils.','App offline in un solo file: senza account, senza tracciamento, senza pubblicità. La cronologia resta solo nel tuo browser. Letture e incantesimi sono scritti nello spirito del folclore romeno, non copiati da raccolte.','Aplicación sin conexión en un solo archivo: sin cuenta, sin rastreo, sin anuncios. El historial queda solo en tu navegador. Las lecturas y ensalmos están escritos en el espíritu del folclore rumano, no copiados de recopilaciones.','Aplicação offline num único ficheiro: sem conta, sem rastreio, sem anúncios. O histórico fica só no teu navegador. As leituras e benzeduras são escritas no espírito do folclore romeno, não copiadas de coletâneas.','Offline-App in einer einzigen Datei: ohne Konto, ohne Tracking, ohne Werbung. Der Verlauf bleibt nur in deinem Browser. Deutungen und Sprüche sind im Geist der rumänischen Folklore verfasst, nicht aus Sammlungen kopiert.','Offline, egyetlen fájlból álló alkalmazás: fiók, követés és reklám nélkül. Az előzmények csak a böngésződben maradnak. A jóslatok és ráolvasások a román folklór szellemében készültek, nem gyűjteményekből másolva.');
D('disc_long','Dat în bobi și descântecele sunt tradiții populare, oferite aici ca patrimoniu cultural și divertisment. Nu sunt sfat medical, juridic sau financiar și nu înlocuiesc medicul, avocatul ori consilierul. La orice durere sau boală, mergi la medic.','Bean divination and charms are folk traditions, offered here as cultural heritage and entertainment. They are not medical, legal or financial advice and do not replace a doctor, lawyer or adviser. For any pain or illness, see a doctor.','Les haricots et les incantations sont des traditions populaires, présentées ici comme patrimoine culturel et divertissement. Ils ne constituent pas un avis médical, juridique ou financier et ne remplacent ni médecin, ni avocat, ni conseiller. En cas de douleur ou de maladie, consultez un médecin.','La divinazione con i fagioli e gli incantesimi sono tradizioni popolari, qui offerte come patrimonio culturale e intrattenimento. Non sono consigli medici, legali o finanziari e non sostituiscono medico, avvocato o consulente. In caso di dolore o malattia, rivolgiti a un medico.','La adivinación con frijoles y los ensalmos son tradiciones populares, ofrecidas aquí como patrimonio cultural y entretenimiento. No son consejo médico, legal ni financiero y no sustituyen al médico, abogado o asesor. Ante cualquier dolor o enfermedad, acude al médico.','A adivinhação com feijões e as benzeduras são tradições populares, aqui oferecidas como património cultural e entretenimento. Não são aconselhamento médico, jurídico ou financeiro e não substituem médico, advogado ou consultor. Perante qualquer dor ou doença, consulta um médico.','Bohnenorakel und Sprüche sind Volkstraditionen, hier als Kulturerbe und zur Unterhaltung angeboten. Sie sind keine medizinische, rechtliche oder finanzielle Beratung und ersetzen weder Arzt noch Anwalt noch Berater. Bei Schmerzen oder Krankheit geh zum Arzt.','A babavetés és a ráolvasások népi hagyományok, itt kulturális örökségként és szórakozásként kínáljuk őket. Nem orvosi, jogi vagy pénzügyi tanácsok, és nem helyettesítik az orvost, ügyvédet vagy tanácsadót. Fájdalom vagy betegség esetén fordulj orvoshoz.');

function resultMatrix(e){const v=stOf(e);const M=[0,1,2].map(r=>v.slice(r*3,r*3+3));const R=[t('r_head'),t('r_heart'),t('r_feet')];const ol=e.mode==='oltenia';const parts=[];

function renderDescList(){const cs=['all',...CATS];$('#chips').innerHTML=cs.map(c=>`<button class="chip${S.fcat===c?' on':''}" data-c="${c}">${c==='all'?t('f_all'):catName(c)}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.onclick=()=>{S.fcat=b.dataset.c;renderDescList()});
  $('#dlist').innerHTML=DESC.filter(d=>S.fcat==='all'||d.cat===S.fcat).map(d=>`<details id="d-${d.id}"><summary><span>${d.t}</span><span class="tag">${catName(d.cat)}</span></summary><div class="dbody"><h3>${t('d_when')}</h3><div>${d.cand}</div><h3>${t('d_mat')}</h3><ul>${d.mat.map(x=>`<li>${x}</li>`).join('')}</ul><h3>${t('d_steps')}</h3><ol>${d.pas.map(x=>`<li>${x}</li>`).join('')}</ol><h3>${t('d_text')}</h3><div class="verse">${d.txt}</div>${d.nota?`<h3>${t('d_note')}</h3><div class="small">${d.nota}</div>`:''}<div class="btns"><button class="btn sec cpd" data-id="${d.id}">${t('b_copy')}</button></div></div></details>`).join('');
  $$('.cpd').forEach(b=>b.onclick=()=>{const d=DESC.find(x=>x.id===b.dataset.id);copyText(d.t+'\n\n'+d.txt,b)})}
function openDesc(id){switchTab('desc');S.fcat='all';renderDescList();const el=$('#d-'+id);if(el){el.open=true;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50)}}
function renderGen(){const gp=$('#gp'),ge=$('#ge');const pv=gp.value,ev=ge.value;gp.innerHTML=CATS.map(c=>`<option value="${c}">${catName(c)}</option>`).join('');ge.innerHTML=Object.keys(ELEM).map(k=>`<option value="${k}">${t('e_'+k)}</option>`).join('');if(pv)gp.value=pv;if(ev)ge.value=ev}
$('#gmake').onclick=()=>{const c=$('#gp').value,e=$('#ge').value,n=$('#gn').value.trim();const L=[];if(n)L.push('Pentru '+n+', cu bine.');L.push(pick(ELEM[e]));L.push(...sample(CORE[c],3));L.push(pick(IMG));L.push(SEAL);S.gtxt=L.join('\n');const o=$('#gout');o.textContent=S.gtxt;o.style.display='block'};
$('#gcopy').onclick=ev=>{if(S.gtxt)copyText(S.gtxt,ev.target)};

/* ====== istoric ====== */
function renderHist(){const h=store.get('hist',[]);const L=$('#hlist');
  if(!h.length){L.innerHTML=`<div class="card">${t('h_empty')}</div>`;$('#hclear').style.display='none';return}
  $('#hclear').style.display='';
  L.innerHTML=h.map((e,i)=>`<div class="hrow"><div><div class="ht">${new Date(e.ts).toLocaleString(LANGS[li][0])} · ${t('tp_'+e.topic)}</div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.q?esc(e.q):'—'} · ${stOf(e).join('-')}</div></div><button class="btn sec" data-h="${i}">${t('h_view')}</button></div>`).join('');
  $$('#hlist button').forEach(b=>b.onclick=()=>{S.cur=h[+b.dataset.h];S.topic=S.cur.topic;S.mode=S.cur.mode||'trei';S.stage=2;switchTab('bobi');renderTopics();renderModes();renderStage();renderResult()})}
$('#hclear').onclick=()=>{store.set('hist',[]);renderHist()};

/* ====== limbă ====== */
function applyI18n(){document.documentElement.lang=LANGS[li][0];$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  renderTopics();renderModes();renderMoon();renderCounter();renderDescList();renderGen();renderHist();
  renderStage();if(S.stage===2&&S.cur)renderResult()}
const ls=$('#lang');ls.innerHTML=LANGS.map((l,i)=>`<option value="${i}">${l[1]}</option>`).join('');
li=store.get('lang',0);if(!(li>=0&&li<LANGS.length))li=0;ls.value=li;
ls.onchange=()=>{li=+ls.value;store.set('lang',li);applyI18n()};

/* ====== pornire ====== */
applyI18n();
</script>
</body>
