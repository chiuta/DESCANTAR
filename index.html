      h('thead', null, h('tr', null, h('th', {scope: 'col', text: T('store_key')}), h('th', {scope: 'col', class: 'fff-num', text: T('store_size')}))), tb);
    st.appendChild(sum); st.appendChild(tbl);
    if ((I.permissions || []).indexOf('indexedDB') >= 0) st.appendChild(h('p', {class: 'fff-mut fff-sm', text: T('store_idb')}));
    st.appendChild(h('p', {class: 'fff-mut fff-sm', text: T('store_note')}));
    inner.appendChild(st);
    storageRows(tb, sum);

    if (!I._present) pm.appendChild(h('p', {class: 'fff-mut', text: T('net_unknown')}));

    }

    /* Fișier */

        h('p', {class: 'fff-sm', text: T('file_how')}), h('pre', {class: 'fff-pre fff-mono', tabindex: '0', 'aria-label': T('verify_cmd'), text: SHELL})));

    foot.appendChild(h('p', {class: 'fff-mut fff-sm', text: T('kit_line', {v: F.version, mods: mods.join(', ') || 'core'})}));

    d.addEventListener('keydown', function (e) { if (e.key !== 'Escape') e.stopPropagation(); });
    d.addEventListener('keyup', function (e) { e.stopPropagation(); });
    d.addEventListener('keypress', function (e) { e.stopPropagation(); });

  }

  /** Număr cu separator de mii după limbă (aceeași formă ca în textele traduse). */
  function fmtNum(n) {
    var sep = {en: ',', it: '.', de: '.'}[F.lang()] || ' ';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  }

  function backup() {

      F.pickFile('.json,application/json').then(function (f) {

    var wipeB = btn(T('bk_wipe'), 'fff-danger-o', function () {
      F.bundle.wipe({reload: true}).then(function (r) {
        if (r.cancelled) return say(T('cancelled'));

      }).catch(fail);
    });
    var syncB = null;
    if (F.sync && F.sync.supported()) {
      syncB = btn(T('bk_sync'), '', function () {
        F.sync.dialog({reload: true}).then(function (r) {
          say(F.t('sync', 'result', {adopted: r.adopted, same: r.same, conflicts: r.conflicts}), 'ok');
        }).catch(fail);
      });
    }
    bk.appendChild(h('div', {class: 'fff-row'}, expB, encBtn, impBtn, wipeB));
    var histB = null;
    if (F.history && F.history.supported()) {
      histB = btn(T('bk_history'), '', function () { F.history.dialog({reload: true}).catch(fail); });
    }
    if (syncB || histB) bk.appendChild(h('div', {class: 'fff-row'}, syncB, histB));
    bk.appendChild(encRow); bk.appendChild(impRow); bk.appendChild(status);
    return bk;
  }

  function cleanup() {
    clearInterval(timer); timer = 0;
    if (dlg) { dlg.remove(); dlg = null; }
    if (lastFocus && lastFocus.isConnected && lastFocus.focus) { try { lastFocus.focus(); } catch (e) { /* ignorat */ } }

  var api = F.label = {

      timer = setInterval(function () { if (dlg && dlg._tick) dlg._tick(); }, 1500);

    isOpen: function () { return !!dlg; },

  /* ---------- transformarea #app-version în buton ---------- */
  var fallback = null;

  /** Butonul de rezervă din footer moștenește culoarea gazdei; dacă nu atinge 4,5:1, alege negru/alb. */

      var fg = rgba(getComputedStyle(el).color), bg = effBg(el);

  function visibleFooter() {

      if (el.closest('a,button,[role="button"],[role="link"],summary,label,input,select,textarea')) { api.state = 'nested'; return; }

  function init() {

.bean::after{content:"";position:absolute;left:42%;top:38%;width:22%;height:18%;border-radius:50%;background:#6b5535;opacity:.75}
.pebble{width:8.6%;aspect-ratio:1.15;border-radius:45% 55% 50% 50%;background:radial-gradient(ellipse at 35% 30%,#b5b5b5,#5d5d5d)}
.pebble::after{display:none}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:8px 2px;margin:6px 0}
.rb{position:relative;height:28px;border:0;background:none;padding:0;cursor:pointer}
.rb i{display:block;width:26px;height:16px;margin:6px auto;border-radius:50%/55%;background:radial-gradient(ellipse at 35% 30%,#fff7e3,#eadcb5 55%,#c9b583);box-shadow:0 1px 2px #000a;outline:2px solid transparent}
.rb.g0 i{outline-color:var(--acc)}.rb.g1 i{outline-color:var(--ok)}.rb.g2 i{outline-color:var(--blue)}
.rb.cut::after{content:"";position:absolute;right:-2px;top:2px;bottom:2px;width:3px;background:var(--red);border-radius:2px}
.rb:disabled{opacity:.45}
.pile{background:var(--panel2);border-radius:12px;padding:10px;margin:0 0 8px;border-left:5px solid var(--acc)}
.pile.p1{border-color:var(--ok)}.pile.p2{border-color:var(--blue)}
.pile .ph{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.tri{display:inline-flex;gap:2px;margin:3px 6px 3px 0;padding:3px 5px;border-radius:8px;background:#0004}
.tri.left{background:#e0a93f33;outline:1px solid var(--acc)}
.mb{display:block;width:15px;height:9px;border-radius:50%/55%;background:radial-gradient(ellipse at 35% 30%,#fff7e3,#d9c898)}
.q{font-style:italic;color:var(--mut);margin:0 0 8px}
.rc{background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.rc .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--acc);font-size:.92rem}
.rc .rh span{color:var(--mut)}
.rc p{margin:6px 0}
.sg{color:#d8c7a2;font-size:.92rem}
.pb{color:#a9b6c4;font-size:.9rem}
.verd{border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin-top:6px}
.verd b{color:var(--acc)}
details{background:var(--panel);border:1px solid #3a2a1d;border-radius:12px;margin:0 0 8px}
summary{cursor:pointer;padding:12px;font-weight:bold;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
.tag{font-size:.72rem;font-weight:normal;color:#2a1a08;background:var(--acc);border-radius:20px;padding:2px 9px;white-space:nowrap}
.dbody{padding:0 12px 12px}
.dbody h3{margin:10px 0 3px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.dbody ul,.dbody ol{margin:0;padding-left:20px}
.verse{white-space:pre-line;font-style:italic;background:#00000033;border-left:3px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0;margin:4px 0}
.big{width:100%;font-size:1.2rem;padding:16px}
.cnt{font-size:2rem;text-align:center;color:var(--acc);margin:6px 0}
.moon{display:flex;align-items:center;gap:12px}
.moon .mi{font-size:2.6rem;line-height:1}
.small{font-size:.85rem;color:var(--mut)}
.hrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.hrow div{min-width:0}.hrow .ht{font-size:.8rem;color:var(--mut)}
.mx{display:grid;gap:6px}.mxr{display:grid;grid-template-columns:72px repeat(3,1fr);gap:6px;align-items:center}.mxr>b{font-size:.8rem;color:var(--mut)}.mc{background:var(--panel2);border-radius:10px;text-align:center;padding:6px 2px;border-bottom:3px solid}.mc.od{border-color:var(--ok)}.mc.ev{border-color:var(--red)}.mv{display:block;font-size:1.6rem;color:var(--acc);line-height:1.1}
footer{padding:14px;text-align:center;color:var(--mut);font-size:.8rem}
footer a{color:var(--acc)}
.note{font-size:.82rem;color:var(--mut);margin:8px 0 0}

D('mt_wax','Lună crescătoare: potrivită pentru început, spor, noroc, dragoste.','Growing moon: fitting for beginnings, abundance, luck and love.','Lune croissante : propice aux débuts, à l\'abondance, à la chance et à l\'amour.','Luna crescente: adatta a inizi, abbondanza, fortuna e amore.','Luna creciente: propicia para comienzos, abundancia, suerte y amor.','Lua crescente: propícia a começos, abundância, sorte e amor.','Zunehmender Mond: passend für Anfänge, Fülle, Glück und Liebe.','Növő hold: kezdetekhez, bőséghez, szerencséhez és szerelemhez illik.');
D('mt_full','Lună plină: potrivită pentru deplinătate, mulțumire, împăcare.','Full moon: fitting for wholeness, gratitude and reconciliation.','Pleine lune : propice à la plénitude, à la gratitude et à la réconciliation.','Luna piena: adatta a pienezza, gratitudine e riconciliazione.','Luna llena: propicia para plenitud, gratitud y reconciliación.','Lua cheia: propícia a plenitude, gratidão e reconciliação.','Vollmond: passend für Fülle, Dank und Versöhnung.','Telihold: teljességhez, hálához és megbékéléshez illik.');
D('mt_wane','Lună descrescătoare: potrivită pentru dezlegare, ușurare, a lăsa greul în urmă.','Waning moon: fitting for release, relief and letting go of burdens.','Lune décroissante : propice au lâcher-prise et à l\'allègement.','Luna calante: adatta a sciogliere, alleggerire, lasciare andare il peso.','Luna menguante: propicia para soltar, aliviar y dejar atrás la carga.','Lua minguante: propícia a soltar, aliviar e deixar o peso para trás.','Abnehmender Mond: passend zum Loslassen und Erleichtern.','Fogyó hold: az elengedéshez és a megkönnyebbüléshez illik.');

D('about_txt','Aplicație offline dintr-un singur fișier: fără cont, fără urmărire, fără reclame. Istoricul rămâne doar în browserul tău. Interpretările și descântecele sunt scrise în spiritul folclorului românesc, nu sunt copii ale unor culegeri.','Offline single-file app: no account, no tracking, no ads. Your history stays in your browser only. The readings and charms are written in the spirit of Romanian folklore, not copied from collections.','Application hors ligne en un seul fichier : sans compte, sans pistage, sans publicité. L\'historique reste dans votre navigateur. Les lectures et incantations sont écrites dans l\'esprit du folklore roumain, sans copier de recueils.','App offline in un solo file: senza account, senza tracciamento, senza pubblicità. La cronologia resta solo nel tuo browser. Letture e incantesimi sono scritti nello spirito del folclore romeno, non copiati da raccolte.','Aplicación sin conexión en un solo archivo: sin cuenta, sin rastreo, sin anuncios. El historial queda solo en tu navegador. Las lecturas y ensalmos están escritos en el espíritu del folclore rumano, no copiados de recopilaciones.','Aplicação offline num único ficheiro: sem conta, sem rastreio, sem anúncios. O histórico fica só no teu navegador. As leituras e benzeduras são escritas no espírito do folclore romeno, não copiadas de coletâneas.','Offline-App in einer einzigen Datei: ohne Konto, ohne Tracking, ohne Werbung. Der Verlauf bleibt nur in deinem Browser. Deutungen und Sprüche sind im Geist der rumänischen Folklore verfasst, nicht aus Sammlungen kopiert.','Offline, egyetlen fájlból álló alkalmazás: fiók, követés és reklám nélkül. Az előzmények csak a böngésződben maradnak. A jóslatok és ráolvasások a román folklór szellemében készültek, nem gyűjteményekből másolva.');
D('disc_long','Dat în bobi și descântecele sunt tradiții populare, oferite aici ca patrimoniu cultural și divertisment. Nu sunt sfat medical, juridic sau financiar și nu înlocuiesc medicul, avocatul ori consilierul. La orice durere sau boală, mergi la medic.','Bean divination and charms are folk traditions, offered here as cultural heritage and entertainment. They are not medical, legal or financial advice and do not replace a doctor, lawyer or adviser. For any pain or illness, see a doctor.','Les haricots et les incantations sont des traditions populaires, présentées ici comme patrimoine culturel et divertissement. Ils ne constituent pas un avis médical, juridique ou financier et ne remplacent ni médecin, ni avocat, ni conseiller. En cas de douleur ou de maladie, consultez un médecin.','La divinazione con i fagioli e gli incantesimi sono tradizioni popolari, qui offerte come patrimonio culturale e intrattenimento. Non sono consigli medici, legali o finanziari e non sostituiscono medico, avvocato o consulente. In caso di dolore o malattia, rivolgiti a un medico.','La adivinación con frijoles y los ensalmos son tradiciones populares, ofrecidas aquí como patrimonio cultural y entretenimiento. No son consejo médico, legal ni financiero y no sustituyen al médico, abogado o asesor. Ante cualquier dolor o enfermedad, acude al médico.','A adivinhação com feijões e as benzeduras são tradições populares, aqui oferecidas como património cultural e entretenimento. Não são aconselhamento médico, jurídico ou financeiro e não substituem médico, advogado ou consultor. Perante qualquer dor ou doença, consulta um médico.','Bohnenorakel und Sprüche sind Volkstraditionen, hier als Kulturerbe und zur Unterhaltung angeboten. Sie sind keine medizinische, rechtliche oder finanzielle Beratung und ersetzen weder Arzt noch Anwalt noch Berater. Bei Schmerzen oder Krankheit geh zum Arzt.','A babavetés és a ráolvasások népi hagyományok, itt kulturális örökségként és szórakozásként kínáljuk őket. Nem orvosi, jogi vagy pénzügyi tanácsok, és nem helyettesítik az orvost, ügyvédet vagy tanácsadót. Fájdalom vagy betegség esetén fordulj orvoshoz.');

const CONTENT={"ro":{"READ":{"g":[["Ai purtat mult singur/ă; o grijă veche încă ține loc în inimă.","Cineva ți-a stat alături și încă îi porți binele.","Un cerc s-a închis în urma ta; ce a fost de împlinit s-a împlinit."],["Ești la răscruce de gând; așteaptă un semn, nu grăbi pasul.","Două lucruri se cântăresc acum: ascultă și inima, și socoteala.","Stai la masa belșugului: ai mai mult decât crezi, numără cu recunoștință."],["Vine o veste mică, dar care schimbă direcția.","Se apropie o întâlnire sau o înțelegere bună.","Se coace o împlinire; răbdarea îți va fi răsplătită."]],"d":[["O iubire neterminată încă îți umblă prin amintiri.","A fost o legătură bună, cu rădăcini care încă se simt.","O poveste s-a încheiat frumos; lasă-o să-și facă rostul."],["Inima e singură, dar nu pustie; se pregătește de ceva.","Doi se apropie: fie tu și cineva, fie tu și tine însuți/însăți.","Inima e plină; ai grijă să nu ceri mai mult decât se poate da."],["Un sentiment nou se arată pe nesimțite.","O întâlnire de suflet sau o împăcare e aproape.","Se pregătește o legătură care prinde rădăcină, cu gând și cu faptă."]],"b":[["Un început șubred te-a învățat să fii econom.","Un câștig a venit cu sprijinul cuiva.","Un belșug de odinioară te-a învățat prețul lucrurilor."],["Punga e ușoară, dar cumpătul e greu; ține socoteala.","Intrările și ieșirile se echilibrează; ocolește împrumuturile.","Spor la casă; împarte-l cu măsură."],["Nu te grăbi la afaceri noi; deschide bine ochii.","Un câștig ajunge pe două căi; fii atent/ă la un parteneriat.","Rodul muncii se strânge; ce semeni acum dă recoltă."]],"c":[["O plecare făcută în grabă; mai ai ceva de lămurit în urmă.","Un drum făcut cu tovarăș bun a fost la rost.","Un drum lung s-a încheiat cu bine."],["Încă nu e ceasul plecării; pregătește bagajul.","Două căi se deschid; alege-o pe cea care-ți dă liniște.","Drumul e deschis; ia cu tine puțină sare și multă răbdare."],["O călătorie scurtă sau o veste adusă de departe.","Un drum cu însoțitor, care duce la o întâlnire importantă.","Un drum mare și binecuvântat, cu întoarcere cu sporuri."]],"a":[["O tăcere veche din casă încă nu s-a topit.","Cineva din neam te-a ocrotit; poartă-i amintirea cu cinste.","Masa mare a familiei a rămas în amintire; păstrează obiceiul."],["Grijile mici ale casei au nevoie de o vorbă bună.","Doi din casă trebuie să se înțeleagă; ascultă mai mult decât vorbești.","Casa e plină de rost; mulțumește pentru ce ai."],["O veste bate la poartă, de la rude sau de la prieteni.","O împăcare în familie sau un oaspete drag.","Sărbătoare sau bucurie la masă mare."]],"m":[["Ai muncit singur/ă și truda nu ți s-a văzut.","Un coleg sau un mentor ți-a fost reazem.","O lucrare dusă la capăt îți dă acum greutate."],["Încă un pas mic și rezultatul se arată; nu te opri.","Se cere colaborare; împarte sarcina.","Ești la rodul muncii; ai grijă să nu te risipești."],["O propunere neașteptată; cântărește-o cu răbdare.","Un parteneriat sau o schimbare de echipă te ajută.","Recunoaștere și stabilitate: ai muncit pe temei."]]},"SIGNS":[["🛤️","Drum","o mișcare, o plecare sau o schimbare de loc"],["✉️","Scrisoare","o veste, un mesaj, o hârtie de semnat"],["🚶","Om străin","un chip nou intră în povestea ta"],["🪙","Ban","un câștig sau o cheltuială cu rost"],["🏠","Casă","o hotărâre sau o schimbare legată de locuință"],["❤️","Inimă","un sentiment adevărat cere ascultare"],["👁️","Ochi","cineva te privește; fii atent/ă la ce spui și cui spui"],["💧","Lacrimă","o ușurare vine după o apăsare"],["🔒","Lacăt","o piedică sau un lucru care trebuie lăsat să aștepte"],["🗝️","Cheie","o soluție este mai aproape decât crezi"],["⭐","Stea","noroc și călăuzire"],["🕊️","Pasăre","veste bună și liniște"]],"PEB":["Piatră în trecut: o greutate veche care încă mai apasă; iartă și lasă-o să cadă.","Piatră în prezent: o piedică de moment; ocolește-o, nu o lovi cu piciorul.","Piatră în viitor: o încercare care te va întări, dacă o primești cu răbdare."],"VERD":{"1,1,3":"Cununa vine după două boabe singure: după răbdare și singurătate, o împlinire.","1,2,2":"Pereche peste pereche: sprijin și înțelegere; nu rămâne singur/ă în hotărâri.","2,3,3":"Belșug dublu: darurile sunt mari; poartă-le cu smerenie și împarte-le."},"ADV":["Ce-i scris, în bobi se arată, dar ce-i de făcut, tot tu faci.","Pașii mici, făcuți cu bună credință, ajung departe.","Vorba bună deschide mai multe uși decât cheia.","Nu căuta liniștea în afară; se așază întâi înlăuntru.","Fii recunoscător/oare pentru ce ai, și mai vine.","Măsoară de trei ori, hotărăște o dată.","Cine seamănă cu răbdare, culege cu bucurie.","Cu apă limpede se spală și gândul.","Ce nu poți schimba azi, lasă-l să se așeze până mâine.","Să nu faci altuia ce nu ți-ai dori ție.","Dimineața e mai înțeleaptă decât seara.","Sfatul bobilor e oglindă: uită-te și hotărăște tu."],"DESC":{"deochi":{"t":"De deochi","cand":"Dimineața, înainte de răsărit; tradițional marți sau joi.","mat":["apă neîncepută într-un pahar sau castron","trei boabe de sare","un fir roșu (opțional)"],"pas":["Stai cu fața spre răsărit și pune apa înaintea ta.","Ține palma deasupra apei și rostește descântecul de trei ori, suflând ușor peste apă la fiecare încheiere.","Atinge-ți fruntea cu un deget umed. Apa nu se bea.","Toarnă apa la rădăcina unui copac sau în pământ, fără să te uiți în urmă."],"txt":"Deochi, deochetură,\nieși din ochi, din gene, din sprâncene,\ndin frunte, din tâmple, din suflet.\nDe ești de la ochi negri, mergi în pământ negru;\nde ești de la ochi albaștri, mergi în apă albastră;\nde ești de la ochi verzi, mergi în iarbă verde;\nde ești de la ochi căprui, mergi în lemn bătrân.\nEu te las, tu mă lași,\neu cu bine, tu cu pace.\nCum se duce roua la soare,\nașa să te duci și tu din mine,\nși să rămână frunte curată,\nochi limpede, inimă ușoară.\nCuvântul meu — lacăt,\napa — cheie.\nAșa să fie!","nota":"Descântecul este un obicei popular de liniștire; dacă ai o suferință reală (durere de cap, febră), mergi la medic."},"frica":{"t":"De frică","cand":"Seara, când casa s-a liniștit.","mat":["o lumânare mică (supraveghează flacăra)","un pahar cu apă"],"pas":["Așază-te drept, cu picioarele pe podea.","Respiră adânc de trei ori.","Rostește descântecul încet, uitându-te la flacără.","Stinge lumânarea cu grijă și bea câteva înghițituri de apă."],"txt":"Frică, fricuță,\nde-ai ieșit din noapte, intră-n noapte;\nde-ai ieșit din umbră, intră-n umbră;\nde-ai ieșit din zgomot, intră-n tăcere.\nInima mea nu-i masă pentru tine,\nc-a ei casă-i de lumină.\nCum se duce ceața de pe deal\ncând răsare soarele,\nașa să se ducă frica din mine,\nși să rămână pace,\nrăsuflare lungă,\npicior sigur.\nCuvântul meu — lumină,\nrăsuflarea mea — lanț.\nAșa să fie!","nota":"Dacă frica sau neliniștea te însoțesc de multe zile, vorbește cu un om apropiat sau cu un specialist."},"somn":{"t":"De somn (cântec de leagăn)","cand":"Seara, la culcare.","mat":["o pernă moale","o lumină slabă"],"pas":["Așază copilul (sau pe tine) comod.","Rostește încet, în ritm de leagăn, de trei ori.","Încheie cu o mângâiere pe frunte."],"txt":"Vino, somn, de la pădure,\ncu pași moi de iarbă sură,\ncu tălpi de cețuri blânde.\nVino, somn, pe geană,\nca fluturele pe floare.\nTaie-i grija ca pe pâine,\ndă-i în dar un vis cu stele,\nun vis lung cât toată noaptea\nși un răsărit cu soare.\nEu stau lângă tine,\nluna stă la fereastră,\nîngerul stă la căpătâi.\nDormi, dormi, dormi,\nsomnul bun reface ziua.","nota":""},"dor":{"t":"De dor","cand":"La amurg, la fereastră.","mat":["o fereastră deschisă puțin","un pahar cu apă"],"pas":["Gândește-te cu blândețe la persoana de care îți e dor.","Rostește descântecul spre fereastră.","Bea apa și lasă dorul să se așeze."],"txt":"Dor, dorule,\nnu mai arde la fereastră,\nnu mai bate-n geam de seară.\nDu-te, dor, pe unde-i dorul,\ndu-i veste că-i gândesc,\nc-am pentru el bine-n suflet,\nc-i-l port cu drag și pace.\nȘi când ți-ai spus păsul,\nîntoarce-te ușor,\nca frunza pe apă,\nca fumul pe vânt,\nși lasă-mi inima\nlimpede ca lacul.\nAșa să fie!","nota":"Descântecul trimite bine, nu leagă și nu cheamă pe nimeni cu sila."},"spor":{"t":"De spor la casă și la masă","cand":"Pe lună crescătoare, dimineața.","mat":["o felie de pâine","un pumn de grâu","puțină sare","o monedă"],"pas":["Așază pe masă pâinea, grâul, sarea și moneda.","Rostește descântecul de trei ori peste ele.","Păstrează moneda în portofel, împarte pâinea cu cineva, iar grâul lasă-l păsărilor."],"txt":"Spor, sporule,\nbate la ușa mea:\nîn masă cu pâine,\nîn casă cu pace,\nîn pungă cu bănuț,\nîn mână cu sănătate.\nCe-i puțin să crească,\nce-i mult să se împartă,\nce-i gol să se umple,\nce-i plin să se păstreze.\nCum crește aluatul în covată,\ncum crește iarba după ploaie,\nașa să crească sporul în casa mea,\nnu din lacrimi de alții,\nci din muncă și din bine.\nAșa să fie!","nota":"Sporul vine din muncă; descântecul e o rugă de nădejde, nu o garanție financiară."},"drum":{"t":"De drum bun","cand":"Înainte de plecare.","mat":["puțină sare în buzunar","un pahar de apă"],"pas":["Stai în prag cu fața spre drum.","Rostește descântecul o dată, încet.","Bea o înghițitură de apă, pune sarea în buzunar și pleacă fără să te întorci din prag."],"txt":"Drum, drumule,\ncale deschisă\nmie și celor cu mine:\nfără piatră în picior,\nfără umbră în gând,\nfără întâlniri rele.\nSoarele în frunte,\nluna în spate,\nbun-venit la sosire,\nbun-venit la întoarcere.\nCum se duce apa la vale,\nașa să ne ducă drumul,\nușor și cu bine.\nAșa să fie!","nota":""},"impacare":{"t":"De împăcare","cand":"Seara, după ce vâlvătaia s-a mai potolit.","mat":["două pahare cu apă","o bucată de pâine"],"pas":["Pune cele două pahare unul lângă altul.","Rostește descântecul peste ele.","Dacă se poate, bea apă din pahar împreună cu cealaltă persoană; dacă nu, bea tu și lasă celălalt pahar pe masă până dimineața."],"txt":"Vorbă lină, vorbă aprinsă,\nia-ți focul și te stinge în apă.\nCuvânt aspru, cuvânt sec,\nmoaie-te în lapte cald.\nCe-am zis în grabă,\nsă se desfacă-n răbdare;\nce-am auzit în supărare,\nsă se așeze în iertare.\nNu ca să câștig eu,\nnu ca să câștigi tu,\nci ca să câștige casa.\nDoi stăm la masă\nși o pâine frângem.\nAșa să fie!","nota":"Descântecul nu înlocuiește conversația sincer-adevărată; deschide drumul spre ea."},"ursita":{"t":"De ursită (dragoste dreaptă)","cand":"Pe lună nouă, seara.","mat":["un fir roșu sau de lână","o lumânare mică"],"pas":["Leagă firul liber în jurul degetului mic de la mâna stângă, fără să-l strângi.","Rostește descântecul de trei ori.","Păstrează firul într-un loc ales, ca amintire a hotărârii de a rămâne deschis/ă."],"txt":"Ursită, ursitoare,\ncare mi-ai scris la naștere\ncu fir de aur, cu fir de lână,\nnu-ți cer să legi pe nimeni,\nnici să muți inimi din loc.\nÎți cer să mă pregătești:\ncu inimă deschisă,\ncu ochi limpezi,\ncu vorbă dreaptă.\nCine-mi este dat cu bine\nsă vină pe cale cu bine,\nși eu pe-a lui/ei să fiu bun/bună.\nȘi de nu-i acum,\nsă mă găsească răbdarea\nși să mă țină în lumină.\nAșa să fie!","nota":"Acest descântec nu urmărește să influențeze voința altei persoane."},"luna":{"t":"De noroc la lună nouă","cand":"Prima seară în care se vede luna nouă.","mat":["o monedă mică (opțională)"],"pas":["Privește luna dintr-un loc deschis.","Rostește descântecul o singură dată, cu mâna pe inimă.","Mulțumește în gând și intră în casă."],"txt":"Lună nouă, lună tânără,\neu te-am văzut întâi,\nnoroc să-mi aduci întâi.\nCum te face cerul din fir de argint,\nașa să-mi faci cărarea.\nCe-i bun să-mi crească cu tine,\nce-i greu să mi se micșoreze.\nSă-ți fie mulțumirea mea\npe cerul tău, cu pace,\npână te vei umple.\nAșa să fie!","nota":""},"cap":{"t":"De cap încărcat (gânduri grele)","cand":"Dimineața, la lumina zilei.","mat":["un pahar cu apă curată"],"pas":["Stai la fereastră sau afară.","Pune mâna pe frunte, rostește descântecul încet.","Bea apa în trei înghițituri."],"txt":"Gând greu, gând negru,\nnu-ți faci cuib în capul meu.\nEu te-am primit, te-am ascultat,\nacum te las.\nDu-te-n apă curgătoare,\ndu-te-n vânt de dimineață.\nCapul meu, vas curat,\nlimpede ca izvorul,\nușor ca pana.\nGânduri bune să încapă,\ngânduri rele să se strecoare.\nAșa să fie!","nota":"Este un obicei de liniștire, nu un tratament. Dacă durerea de cap persistă sau e însoțită de alte semne, mergi la medic."},"thx":{"t":"De mulțumire (la masă)","cand":"Înainte de masă sau seara.","mat":["pâine și apă"],"pas":["Așază-te la masă, ia pâinea în mână.","Rostește mulțumirea.","Frânge pâinea și împarte-o."],"txt":"Mulțumesc pâinii care-a încolțit,\nmâinilor care-au frământat,\npământului care a purtat,\nsoarelui care a copt,\napei care a dat.\nSă fie masa mea binecuvântată,\ncasa mea plină de pace.\nSă am ce da celui flămând,\nce lua dacă-mi lipsește\nși inimă să mulțumesc mereu.","nota":""},"casa":{"t":"De seară pentru casă","cand":"Seara, înainte de culcare.","mat":["puțină sare","un fir de busuioc (sau altă plantă aromată)"],"pas":["Presară un strop de sare în pragul ușii.","Pune busuiocul într-un colț al camerei.","Rostește descântecul în mijlocul casei."],"txt":"Pe prag cu sare,\npe fereastră cu lumină,\nîn colț cu busuioc,\nîn mijloc cu pace.\nCe intră cu bine\nsă se ospăteze;\nce intră cu rău\nsă se întoarcă din prag.\nCasa mea, casă de lumină.\nSomn bun celor dinăuntru,\ndrum bun celor din afară.","nota":""}},"ELEM":{"water":["Apă curgătoare, apă neîncepută,","Apă limpede, apă de izvor,"],"fire":["Foc de lumină, foc de nădejde,","Flacără mică, flacără blândă,"],"earth":["Pământ de sub picioare, pământ hrănitor,","Țărână caldă, țărână bună,"],"wind":["Vânt de dimineață, vânt ușor,","Suflare de aer, suflare curată,"],"salt":["Sare din sărat, sare din pământ,","Sare curată, sare de ocrotire,"],"thread":["Fir roșu, fir de viață,","Fir subțire, fir de legătură cu binele,"]},"CORE":{"prot":["Ferește casa, drumul și gândul de privire rea,","Ferește de vorbă rea și de pas greșit,","Lasă numai binele să treacă pragul,","Pune lumină în jur, ca un zid de lumină,"],"calm":["Alungă frica și grija din piept,","Fă răsuflarea lungă și inima ușoară,","Pune în gând limpezime ca în izvor,","Dă somn bun și zi liniștită,"],"fam":["Adună neamul la o masă de pace,","Dezleagă supărarea, adu vorba blândă,","Pune iertare între cei apropiați,","Ține casa caldă și ușa deschisă,"],"love":["Pregătește inima pentru o iubire dreaptă,","Fă ochii limpezi și vorba cinstită,","Dă răbdare până la ceasul cel bun,","Să nu lege pe nimeni cu sila, ci să lumineze calea,"],"spor":["Dă spor în casă și în masă,","Dă rod muncii și răsplată cinstită,","Ce-i puțin să crească, ce-i mult să se împartă,","Pune belșug în mâna care dăruiește,"],"road":["Deschide calea și ferește piciorul de piatră,","Pune soare în frunte și pace în urmă,","Du la țintă cu bine și înapoi cu spor,","Dă tovarăși buni pe drum,"],"thx":["Mulțumire pentru pâine și pentru apă,","Mulțumire pentru casă și pentru cei dragi,","Mulțumire pentru ziua de azi și pentru cea de mâine,","Mulțumire pentru lumina care ne ține,"]},"IMG":["Cum se duce roua la soare,\nașa să se ducă tot ce-i în plus.","Cum curge izvorul la vale,\nașa să curgă binele spre casă.","Cum se așază frunza pe apă,\nașa să se așeze pacea.","Cum răsare soarele după noapte,\nașa să răsară limpezimea.","Cum se coace grâul sub soare,\nașa să se coacă timpul bun.","Cum își găsește pasărea cuibul,\nașa să-și găsească omul liniștea."],"SEAL":"Cuvântul meu — lacăt,\nrăsuflarea mea — cheie.\nAșa să fie, de trei ori!","GEN_FOR":"Pentru {n}, cu bine.","ROWT":[["Cap încărcat: grijă mare, hotărâri amânate; așteaptă să se limpezească.","Gândurile se încurcă; nu hotărî în grabă.","Mintea e mai mult senină; o mică îndoială cere răbdare.","Gânduri limpezi și dorințe cu cale deschisă; ce ai în minte se poate împlini."],["Inimă grea: supărare sau lacrimi; ocrotește-ți liniștea și odihna.","Emoții încurcate; ai nevoie de o vorbă sinceră în casă.","Sentimentele sunt mai mult bune; o supărare mică se va potoli.","Inima e în pace: dragoste, casă și sănătate stau bine."],["Drum închis deocamdată: amână plecările și afacerile mari.","Drum cu piedici sau cheltuieli; pregătește-te cu socoteală.","Drumul merge, cu câte o zăbavă.","Drumuri deschise și bani cu noroc; oaspeți bineveniți."]],"CELLN":["curat","zăbavă","noroc deplin","greutate"],"SP":{"cump":"Cumpăna mare: prima grămadă de sus (stânga) și ultima de jos (dreapta) sunt pare — ai un obstacol de trecut; fă-o cu pași mici.","drum":"Drumul deschis: rândul de jos are doar numere impare — orice drum sau plan început acum are succes.","linie":"Linia norocoasă: o linie întreagă de câte 3 boabe — dorința se împlinește repede și fără obstacole."},"OLT":{"title":"Oltenia","casa4":"În casă (Căsuța 5): exact 4 boabe — casă plină, belșug și mulțumire; dorința se împlinește foarte repede.","casa_1":"În casă (Căsuța 5): {n} bob.","casa_n":"În casă (Căsuța 5): {n} boabe.","sum5":"Rândul de sus însumează 5: răspuns pozitiv, care se va întâmpla în grabă.","sum9":"Rândul de sus însumează 9: răspuns pozitiv, mai târziu, dar sigur.","sumN":"Rândul de sus însumează {n}: fără semn deosebit.","bob_sus":"Bob singur sus: veste în deșert, fără importanță.","colac_cap":"Colac în cap: bucurie mare.","sositor_strict":"Bob sositor (1 bob jos-dreapta): vin bani sau o veste mult așteptată, cineva drag de la drum lung.","sositor_wide":"Bob sositor, varianta largă (1 bob pe rândul de jos, nu în dreapta): cineva drag vine de la drum lung sau sosesc bani în casă.","prag_strict":"Colac în prag (3 boabe jos-mijloc): nuntă, petrecere, oaspeți dragi.","prag_wide":"Colac în prag, varianta largă (3 boabe pe rândul de jos, nu la mijloc): oaspeți sau o petrecere.","doua":"Două boabe: îndoială, cumpănă sau o veste care strânge inima.","linie":"Linie de câte 2 sau 3 boabe așezate consecutiv: drum lung, peste hotare sau în afara județului.","desc_lbl":"Descântec de menire (variantă locală; formulele diferă de la sat la sat):","short_lbl":"Variantă scurtă:","desc":"Voi, 41 de bobi,\nCum știți de încolțiți,\nToate luncile înverziți,\nToată lumea o hrăniți,\nAșa să știți de știrea lui [numele persoanei]...\nDacă e de bine, să dați pe șase (sau pe nouă),\nLa inimă două, să se vază bine!","desc2":"Cum hrăniți lumea,\nașa să-mi arătați adevărul\ndespre [numele persoanei / întrebarea]."},"YN":["Răspunsul bobilor: DA — bobii sunt de partea ta.","Mai degrabă da, cu puțină răbdare.","Mai degrabă nu acum; așteaptă un ceas mai bun.","NU deocamdată; lasă lucrurile să se așeze."],"GUIDE":"🫘 PREGĂTIREA\n1. Ia exact 41 de boabe de fasole albă (sau porumb) în pumn.\n2. Suflă peste ele de 3 ori și spune: „Cum hrăniți lumea, așa să-mi arătați adevărul despre [întrebarea ta]”.\n\n📐 ÎMPĂRȚIREA (din 4 în 4)\nBoabele se așază într-o matrice de 3 rânduri × 3 grămezi.\n• Rândul 1 (SUS — Gândul): din grămada mare se scot câte 4; restul (1, 2, 3 sau 4 boabe) e prima grămadă, în stânga. Repetă cu boabele numărate pentru grămada din mijloc, apoi pentru cea din dreapta.\n• Rândul 2 (MIJLOC — Inima): strânge boabele rămase și repetă pentru cele 3 grămezi de la mijloc.\n• Rândul 3 (JOS — Drumul): repetă pentru ultimele 3 grămezi.\nBoabele care mai rămân la final se pun deoparte.\nÎn aplicație: în locul acestui „trage din grămadă”, tai șirul de 41 de boabe în 9 grămezi (opt tăieturi) și din fiecare scoți câte 4; restul de 1–4 intră în matrice. Așa fiecare citire iese diferit.\n\n🔮 CITIREA RAPIDĂ\n• 1 sau 3 boabe (impar): semn bun, bucurie, reușită — DA.\n• 2 sau 4 boabe (par): cumpănă, întârziere, supărare — NU.\n\n🌟 SEMNELE MARI\n• 4 boabe în centru: „Casă plină” (noroc, bani, belșug).\n• 3 boabe jos-mijloc: „Colac în prag” (nuntă, petrecere, oaspeți dragi).\n• 1 bob jos-dreapta: „Bob sositor” (vin bani sau o veste mult așteptată).\n• Par în stânga-sus și în dreapta-jos: „Cumpăna mare”.\n• Rândul de jos doar impar: „Drumul deschis”.\n• O linie de câte 3 boabe: „Linia norocoasă”.\nÎn Oltenia, adaugă: 3 boabe pe rândul de sus = „colac în cap”; rândul de sus însumează 5 (în grabă) sau 9 (mai târziu, dar sigur); nu da în bobi de două ori în aceeași zi pentru aceeași întrebare."},"en":{"READ":{"g":[["You have carried a lot alone; an old tenderness still keeps its place in your heart.","Someone stood beside you, and you still carry their kindness.","A circle has closed behind you; what was meant to be fulfilled has been fulfilled."],["You stand at a crossroads of thought; wait for a sign and do not rush your step.","Two things are being weighed now: listen to the heart as well as to reckoning.","You sit at the table of plenty: you have more than you think, so count it with gratitude."],["A small piece of news is coming, yet it changes your direction.","A good meeting or agreement draws near.","A fulfilment is ripening; your patience will be rewarded."]],"d":[["An unfinished love still wanders through your memories.","It was a good bond, with roots you can still feel.","A story has ended beautifully; let it do its work."],["The heart is alone, but not empty; it is preparing for something.","Two are drawing near: either you and someone else, or you and yourself.","The heart is full; take care not to ask for more than can be given."],["A new feeling shows itself unnoticed.","A meeting of souls or a reconciliation is near.","A bond is being prepared that will take root, in thought and in deed."]],"b":[["A shaky beginning taught you to be thrifty.","A gain came with someone's support.","An abundance of old taught you the price of things."],["The purse is light, but your composure is heavy; keep your accounts.","Income and outgo balance; avoid loans.","Increase for the household; share it in measure."],["Do not rush into new business; keep your eyes wide open.","A gain arrives by two paths; be mindful of a partnership.","The fruit of labor is gathered; what you sow now yields a harvest."]],"c":[["A departure made in haste; something behind you is still unresolved.","A journey made with a good companion was well worth it.","A long road has ended well."],["It is not yet time to leave; prepare your bag.","Two paths open; choose the one that gives you peace.","The road is open; take a little salt with you and plenty of patience."],["A short trip or news brought from afar.","A journey with a companion, leading to an important meeting.","A great, blessed journey, with a return full of gains."]],"a":[["An old silence in the home has not yet melted.","Someone from your kin sheltered you; carry their memory with honor.","The great family table lingers in memory; keep the custom."],["The small worries of the household need a kind word.","Two in the household must come to terms; listen more than you speak.","The house is full of purpose; give thanks for what you have."],["News knocks at the gate, from relatives or from friends.","A reconciliation in the family or a dear guest.","A feast or joy at the great table."]],"m":[["You worked alone and your toil went unseen.","A colleague or mentor was your support.","A work carried to its end now gives you standing."],["One more small step and the result shows itself; do not stop.","Collaboration is called for; share the task.","You are at the fruit of your labor; take care not to scatter yourself."],["An unexpected proposal; weigh it with patience.","A partnership or a change of team helps you.","Recognition and stability: you have worked on solid ground."]]},"SIGNS":[["🛤️","Road","a movement, a departure or a change of place"],["✉️","Letter","news, a message, a paper to sign"],["🚶","Stranger","a new face enters your story"],["🪙","Coin","a gain or a worthwhile expense"],["🏠","House","a decision or change concerning your home"],["❤️","Heart","a true feeling asks to be heard"],["👁️","Eye","someone is watching you; mind what you say and to whom"],["💧","Tear","relief comes after a burden"],["🔒","Padlock","an obstacle, or something that must be left to wait"],["🗝️","Key","a solution is closer than you think"],["⭐","Star","luck and guidance"],["🕊️","Bird","good news and calm"]],"PEB":["Stone in the past: an old weight that still presses; forgive, and let it fall.","Stone in the present: an obstacle of the moment; go around it, do not kick it.","Stone in the future: a trial that will make you stronger, if you receive it with patience."],"VERD":{"1,1,3":"The wreath (cununa) comes after two lone beans: after patience and solitude, a fulfilment.","1,2,2":"Pair upon pair: support and understanding; do not remain alone in your decisions.","2,3,3":"Double plenty: the gifts are great; carry them with humility and share them."},"ADV":["What is written shows in the beans, but what is to be done, you still do yourself.","Small steps, taken in good faith, go far.","A kind word opens more doors than a key.","Do not look for peace outside; it settles within first.","Be grateful for what you have, and more will come.","Measure three times, decide once.","Whoever sows with patience reaps with joy.","With clear water even thought is washed.","What you cannot change today, let it settle until tomorrow.","Do not do to another what you would not wish for yourself.","Morning is wiser than evening.","The counsel of the beans is a mirror: look, and decide for yourself."],"DESC":{"deochi":{"t":"Charm against the evil eye (De deochi)","cand":"In the morning, before sunrise; traditionally on a Tuesday or Thursday.","mat":["unbroached water in a glass or bowl","three grains of salt","a red thread (optional)"],"pas":["Face the sunrise and set the water before you.","Hold your palm over the water and speak the charm three times, blowing lightly over the water at each ending.","Touch your forehead with a damp finger. The water is not to be drunk.","Pour the water at the root of a tree or onto the earth, without looking back."],"txt":"Evil eye, ill glance,\nleave the eyes, the lashes, the brows,\nthe forehead, the temples, the soul.\nIf you come from black eyes, go to the black earth;\nif you come from blue eyes, go to the blue water;\nif you come from green eyes, go to the green grass;\nif you come from brown eyes, go to the old wood.\nI let you go, you let me go,\nI in goodness, you in peace.\nAs the dew goes off to the sun,\nso may you go from me,\nand may there remain a clear brow,\na bright eye, a light heart.\nMy word, the padlock,\nthe water, the key.\nSo may it be!","nota":"The charm is a folk custom of calming; if you have a real ailment (headache, fever), see a doctor."},"frica":{"t":"Charm against fear (De frică)","cand":"In the evening, when the house has quieted.","mat":["a small candle (keep watch over the flame)","a glass of water"],"pas":["Sit upright, with your feet on the floor.","Breathe deeply three times.","Speak the charm softly, gazing at the flame.","Put out the candle with care and drink a few sips of water."],"txt":"Fear, little fear,\nif you came out of the night, go back into the night;\nif you came out of the shadow, go back into the shadow;\nif you came out of the noise, go back into the silence.\nMy heart is no table for you,\nfor its house is made of light.\nAs the mist leaves the hill\nwhen the sun rises,\nso may fear leave me,\nand may there remain peace,\na long breath,\na sure foot.\nMy word, the light,\nmy breath, the chain.\nSo may it be!","nota":"If fear or unease stays with you for many days, talk to someone close or to a specialist."},"somn":{"t":"Charm for sleep, a lullaby (De somn)","cand":"In the evening, at bedtime.","mat":["a soft pillow","a dim light"],"pas":["Settle the child (or yourself) comfortably.","Speak it softly, in a cradle rhythm, three times.","Finish with a caress on the forehead."],"txt":"Come, sleep, from the forest,\nwith soft steps of gray grass,\nwith soles of gentle mist.\nCome, sleep, to the eyelash,\nlike the butterfly to the flower.\nCut away worry as one cuts bread,\ngive a dream of stars as a gift,\na dream long as the whole night\nand a sunrise full of sun.\nI stay beside you,\nthe moon stays at the window,\nthe angel stays at the bedhead.\nSleep, sleep, sleep,\ngood sleep restores the day.","nota":""},"dor":{"t":"Charm for longing (De dor)","cand":"At dusk, by the window.","mat":["a window left slightly open","a glass of water"],"pas":["Think gently of the person you miss.","Speak the charm toward the window.","Drink the water and let the longing settle."],"txt":"Longing, oh longing,\ndo not burn at the window,\ndo not knock on the pane at dusk.\nGo, longing, wherever the beloved is,\nbring word that I think of them,\nthat I hold only good for them in my soul,\nthat I carry them with love and peace.\nAnd when you have told your woe,\nreturn lightly,\nlike a leaf on water,\nlike smoke on the wind,\nand leave my heart\nclear as a lake.\nSo may it be!","nota":"The charm sends goodwill; it does not bind or summon anyone by force."},"spor":{"t":"Charm for increase at home and table (De spor la casă și la masă)","cand":"On a waxing moon, in the morning.","mat":["a slice of bread","a handful of wheat","a little salt","a coin"],"pas":["Set the bread, wheat, salt and coin on the table.","Speak the charm three times over them.","Keep the coin in your wallet, share the bread with someone, and leave the wheat for the birds."],"txt":"Increase, oh increase,\nknock at my door:\ninto the table with bread,\ninto the house with peace,\ninto the purse with a coin,\ninto the hand with health.\nWhat is little, let it grow,\nwhat is much, let it be shared,\nwhat is empty, let it be filled,\nwhat is full, let it be kept.\nAs dough rises in the trough,\nas grass grows after rain,\nso may increase grow in my house,\nnot from the tears of others,\nbut from work and from good.\nSo may it be!","nota":"Increase comes from work; the charm is a prayer of hope, not a financial guarantee."},"drum":{"t":"Charm for a good journey (De drum bun)","cand":"Before departure.","mat":["a little salt in your pocket","a glass of water"],"pas":["Stand on the threshold facing the road.","Speak the charm once, softly.","Drink a sip of water, put the salt in your pocket and set out without turning back from the threshold."],"txt":"Road, oh road,\nopen way\nfor me and those with me:\nno stone in the foot,\nno shadow in the mind,\nno evil meetings.\nThe sun on the brow,\nthe moon at the back,\nwelcome on arrival,\nwelcome on return.\nAs the water goes down the valley,\nso may the road carry us,\neasy and well.\nSo may it be!","nota":""},"impacare":{"t":"Charm for reconciliation (De împăcare)","cand":"In the evening, after the flare of anger has subsided.","mat":["two glasses of water","a piece of bread"],"pas":["Set the two glasses side by side.","Speak the charm over them.","If possible, drink water from the glass together with the other person; if not, drink yours and leave the other glass on the table until morning."],"txt":"Gentle word, fiery word,\ntake your fire and quench yourself in water.\nHarsh word, dry word,\nsoften in warm milk.\nWhat I said in haste,\nlet it unravel in patience;\nwhat I heard in hurt,\nlet it settle in forgiveness.\nNot so that I may win,\nnot so that you may win,\nbut so that the home may win.\nTwo of us sit at the table\nand break one bread.\nSo may it be!","nota":"The charm does not replace an honest conversation; it opens the way toward one."},"ursita":{"t":"Charm for destiny, a true love (De ursită)","cand":"On a new moon, in the evening.","mat":["a red or woolen thread","a small candle"],"pas":["Tie the thread loosely around the little finger of your left hand, without tightening it.","Speak the charm three times.","Keep the thread in a chosen place, as a reminder of your decision to stay open."],"txt":"Fate, oh fate-giver,\nyou who wrote for me at birth\nwith a thread of gold, with a thread of wool,\nI do not ask you to bind anyone,\nnor to move hearts from their place.\nI ask you to ready me:\nwith an open heart,\nwith clear eyes,\nwith an honest word.\nWhoever is given to me in goodness,\nmay they come along a good road,\nand may I be good on theirs.\nAnd if it is not now,\nmay patience find me\nand keep me in the light.\nSo may it be!","nota":"This charm does not seek to influence another person's will."},"luna":{"t":"Charm for luck at the new moon (De noroc la lună nouă)","cand":"The first evening the new moon is seen.","mat":["a small coin (optional)"],"pas":["Look at the moon from an open place.","Speak the charm only once, with your hand on your heart.","Give thanks in your mind and go inside."],"txt":"New moon, young moon,\nI saw you first,\nbring me luck first.\nAs the sky makes you of silver thread,\nso make my path.\nWhat is good, let it grow with you,\nwhat is hard, let it shrink for me.\nLet my thanks be\nin your sky, in peace,\nuntil you are full.\nSo may it be!","nota":""},"cap":{"t":"Charm for a burdened head, heavy thoughts (De cap încărcat)","cand":"In the morning, in daylight.","mat":["a glass of clean water"],"pas":["Stand at a window or outside.","Put your hand on your forehead and speak the charm softly.","Drink the water in three sips."],"txt":"Heavy thought, black thought,\nyou make no nest in my head.\nI received you, I listened to you,\nnow I let you go.\nGo into running water,\ngo into the morning wind.\nMy head, a clean vessel,\nclear as the spring,\nlight as a feather.\nLet good thoughts find room,\nlet evil thoughts slip away.\nSo may it be!","nota":"This is a custom of calming, not a treatment. If the headache persists or comes with other signs, see a doctor."},"thx":{"t":"Charm of thanks at the table (De mulțumire)","cand":"Before a meal or in the evening.","mat":["bread and water"],"pas":["Sit at the table and take the bread in your hand.","Speak the thanks.","Break the bread and share it."],"txt":"I thank the bread that sprouted,\nthe hands that kneaded,\nthe earth that bore,\nthe sun that ripened,\nthe water that gave.\nMay my table be blessed,\nmy house full of peace.\nMay I have something to give the hungry,\nsomething to take if I lack,\nand a heart to give thanks always.","nota":""},"casa":{"t":"Evening charm for the house (De seară pentru casă)","cand":"In the evening, before bed.","mat":["a little salt","a sprig of basil (or another fragrant herb)"],"pas":["Sprinkle a pinch of salt on the doorstep.","Place the basil in a corner of the room.","Speak the charm in the middle of the house."],"txt":"On the threshold with salt,\nat the window with light,\nin the corner with basil,\nin the middle with peace.\nWhat enters in goodness,\nlet it feast;\nwhat enters in evil,\nlet it turn back from the threshold.\nMy house, a house of light.\nGood sleep to those within,\ngood road to those without.","nota":""}},"ELEM":{"water":["Running water, unbroached water,","Clear water, spring water,"],"fire":["Fire of light, fire of hope,","Small flame, gentle flame,"],"earth":["Earth beneath my feet, nourishing earth,","Warm soil, good soil,"],"wind":["Morning wind, light wind,","Breath of air, clean breath,"],"salt":["Salt of the salt-pan, salt of the earth,","Clean salt, salt of protection,"],"thread":["Red thread, thread of life,","Slender thread, thread binding me to the good,"]},"CORE":{"prot":["Shield the house, the road and the mind from the evil glance,","Shield from the evil word and the wrong step,","Let only goodness cross the threshold,","Set light all around, like a wall of light,"],"calm":["Drive fear and worry from the chest,","Make the breath long and the heart light,","Put clarity in the mind, as in a spring,","Give good sleep and a peaceful day,"],"fam":["Gather the kin at a table of peace,","Undo the quarrel, bring the gentle word,","Set forgiveness between those who are close,","Keep the house warm and the door open,"],"love":["Prepare the heart for a true love,","Make the eyes clear and the word honest,","Give patience until the right hour,","Let it bind no one by force, but light the way,"],"spor":["Give increase to the house and the table,","Give fruit to labor and an honest reward,","What is little, let it grow; what is much, let it be shared,","Put plenty in the hand that gives,"],"road":["Open the way and keep the foot from stones,","Set sun on the brow and peace behind,","Lead to the goal in goodness and back again with gain,","Give good companions on the road,"],"thx":["Thanks for the bread and for the water,","Thanks for the house and for those we love,","Thanks for today and for tomorrow,","Thanks for the light that holds us,"]},"IMG":["As the dew goes off to the sun,\nso may all that is excess depart.","As the spring flows down the valley,\nso may good flow toward the house.","As the leaf settles on the water,\nso may peace settle.","As the sun rises after the night,\nso may clarity rise.","As the wheat ripens under the sun,\nso may the good time ripen.","As the bird finds its nest,\nso may a person find their calm."],"SEAL":"My word, the padlock,\nmy breath, the key.\nSo may it be, three times!","GEN_FOR":"For {n}, in goodness.","ROWT":[["Burdened head: great worry, postponed decisions; wait for it to clear.","Thoughts tangle; do not decide in haste.","The mind is mostly serene; a small doubt asks for patience.","Clear thoughts and wishes with an open path; what you have in mind can come true."],["Heavy heart: hurt or tears; guard your calm and your rest.","Tangled feelings; you need an honest word at home.","Feelings are mostly good; a small hurt will subside.","The heart is at peace: love, home and health stand well."],["Road closed for the moment: postpone departures and large deals.","A road with obstacles or expenses; prepare with careful reckoning.","The road goes on, with an occasional delay.","Open roads and money with luck; welcome guests."]],"CELLN":["clear","delay","full luck","weight"],"SP":{"cump":"The great crossroads (cumpăna mare): the first pile at the top (left) and the last at the bottom (right) are both even: you have an obstacle to cross; do it in small steps.","drum":"The open road (drumul deschis): the bottom row has only odd numbers: any road or plan begun now succeeds.","linie":"The lucky line (linia norocoasă): a whole line of 3 beans each: the wish is fulfilled quickly and without obstacles."},"OLT":{"title":"Oltenia","casa4":"In the house (Cell 5): exactly 4 beans: a full house (casă plină), abundance and contentment; the wish comes true very quickly.","casa_1":"In the house (Cell 5): {n} bean.","casa_n":"In the house (Cell 5): {n} beans.","sum5":"The top row adds up to 5: a positive answer, which will happen in haste.","sum9":"The top row adds up to 9: a positive answer, later but sure.","sumN":"The top row adds up to {n}: no particular sign.","bob_sus":"A lone bean on top: news in vain, of no importance.","colac_cap":"Wreath on the head (colac în cap): great joy.","sositor_strict":"Arriving bean (bob sositor), 1 bean bottom-right: money comes, or long-awaited news, or a loved one from a long journey.","sositor_wide":"Arriving bean (bob sositor), wide variant (1 bean on the bottom row, not on the right): a loved one comes from a long journey or money arrives in the house.","prag_strict":"Doorstep wreath (colac în prag), 3 beans bottom-middle: a wedding, a celebration, dear guests.","prag_wide":"Doorstep wreath (colac în prag), wide variant (3 beans on the bottom row, not in the middle): guests or a celebration.","doua":"Two beans: doubt, a crossroads, or news that tightens the heart.","linie":"A line of 2 or 3 beans in succession: a long journey, abroad or beyond the county.","desc_lbl":"Charm of destining (a local variant; the formulas differ from village to village):","short_lbl":"Short variant:","desc":"You, forty-one beans,\nAs you know how to sprout,\nAs you turn all meadows green,\nAs you feed the whole world,\nSo know the tidings of [name of the person]...\nIf it is good, fall on six (or on nine),\nTwo at the heart, that it may be seen plainly!","desc2":"As you feed the world,\nso show me the truth\nabout [name of the person / the question]."},"YN":["The answer of the beans: YES, the beans are on your side.","More likely yes, with a little patience.","More likely not now; wait for a better hour.","NO for the moment; let things settle."],"GUIDE":"🫘 PREPARATION\n1. Take exactly 41 white beans (or corn kernels) in your fist.\n2. Blow over them 3 times and say: \"As you feed the world, so show me the truth about [your question]\".\n\n📐 THE DIVISION (by fours)\nThe beans are laid out in a matrix of 3 rows × 3 piles.\n• Row 1 (TOP, the Thought): from the large pile, remove them four at a time; what remains (1, 2, 3 or 4 beans) is the first pile, on the left. Repeat with the beans counted out for the middle pile, then for the right one.\n• Row 2 (MIDDLE, the Heart): gather the remaining beans and repeat for the 3 piles in the middle.\n• Row 3 (BOTTOM, the Road): repeat for the last 3 piles.\nAny beans left over at the end are set aside.\nIn the app: instead of this \"draw from the pile\", you cut the string of 41 beans into 9 piles (eight cuts) and remove four at a time from each; the remainder of 1–4 goes into the matrix. This way each reading comes out different.\n\n🔮 QUICK READING\n• 1 or 3 beans (odd): a good sign, joy, success: YES.\n• 2 or 4 beans (even): a crossroads, delay, hurt: NO.\n\n🌟 THE GREAT SIGNS\n• 4 beans in the center: \"Full house\" (casă plină: luck, money, plenty).\n• 3 beans bottom-middle: \"Doorstep wreath\" (colac în prag: a wedding, a celebration, dear guests).\n• 1 bean bottom-right: \"Arriving bean\" (bob sositor: money comes, or long-awaited news).\n• Even at top-left and bottom-right: \"The great crossroads\" (cumpăna mare).\n• Bottom row only odd: \"The open road\" (drumul deschis).\n• A line of 3 beans each: \"The lucky line\" (linia norocoasă).\nIn Oltenia, add: 3 beans on the top row = \"wreath on the head\" (colac în cap); the top row adds up to 5 (in haste) or 9 (later, but sure); do not read the beans twice on the same day for the same question."},"fr":{"READ":{"g":[["Tu as beaucoup porté seul·e ; un vieux souci tient encore une place dans ton cœur.","Quelqu'un s'est tenu à tes côtés et tu gardes encore sa bonté en toi.","Un cercle s'est refermé derrière toi ; ce qui devait s'accomplir est accompli."],["Tu es à la croisée de tes pensées ; attends un signe, ne presse pas le pas.","Deux choses se pèsent maintenant : écoute aussi bien le cœur que le calcul.","Tu es assis·e à la table de l'abondance : tu as plus que tu ne crois, compte avec gratitude."],["Une petite nouvelle arrive, mais elle change la direction.","Une rencontre ou un bon accord approche.","Un accomplissement mûrit ; ta patience sera récompensée."]],"d":[["Un amour inachevé erre encore dans tes souvenirs.","Ce fut un bon lien, aux racines que l'on sent encore.","Une histoire s'est achevée avec beauté ; laisse-la accomplir son œuvre."],["Le cœur est seul, mais non désert ; il se prépare à quelque chose.","Deux se rapprochent : toi et quelqu'un, ou toi et toi-même.","Le cœur est plein ; prends garde de ne pas demander plus qu'on ne peut donner."],["Un sentiment nouveau paraît sans bruit.","Une rencontre d'âmes ou une réconciliation est proche.","Un lien se prépare, qui prend racine, par la pensée et par les actes."]],"b":[["Un début fragile t'a appris à être économe.","Un gain est venu avec l'aide de quelqu'un.","Une abondance d'autrefois t'a appris le prix des choses."],["La bourse est légère, mais la sagesse est lourde ; tiens tes comptes.","Les entrées et les sorties s'équilibrent ; évite les emprunts.","La maison prospère ; partage cette richesse avec mesure."],["Ne te hâte pas vers de nouvelles affaires ; ouvre bien les yeux.","Un gain arrive par deux voies ; sois attentif·ve à une association.","Le fruit du travail se récolte ; ce que tu sèmes maintenant donnera moisson."]],"c":[["Un départ fait à la hâte ; il te reste quelque chose à éclaircir derrière toi.","Un chemin fait avec un bon compagnon était bien venu.","Un long voyage s'est achevé heureusement."],["L'heure du départ n'est pas encore venue ; prépare ton bagage.","Deux voies s'ouvrent ; choisis celle qui t'apporte la paix.","La route est ouverte ; emporte un peu de sel et beaucoup de patience."],["Un court voyage ou une nouvelle venue de loin.","Un chemin avec un compagnon, qui mène à une rencontre importante.","Un grand chemin béni, avec un retour chargé de profits."]],"a":[["Un vieux silence de la maison ne s'est pas encore dissous.","Quelqu'un de la famille t'a protégé·e ; porte son souvenir avec honneur.","La grande table de la famille est restée en mémoire ; garde la coutume."],["Les petits soucis de la maison ont besoin d'une bonne parole.","Deux personnes de la maison doivent s'accorder ; écoute plus que tu ne parles.","La maison est pleine de sens ; rends grâce pour ce que tu as."],["Une nouvelle frappe au portail, de la parenté ou des amis.","Une réconciliation en famille ou un hôte cher.","Fête ou joie à la grande table."]],"m":[["Tu as travaillé seul·e et ta peine n'a pas été vue.","Un collègue ou un mentor t'a servi d'appui.","Un ouvrage mené à terme te donne maintenant du poids."],["Encore un petit pas et le résultat apparaît ; ne t'arrête pas.","Une collaboration est requise ; partage la tâche.","Tu es au fruit du travail ; prends garde de ne pas te disperser."],["Une proposition inattendue ; pèse-la avec patience.","Un partenariat ou un changement d'équipe t'aide.","Reconnaissance et stabilité : tu as travaillé sur de bonnes bases."]]},"SIGNS":[["🛤️","Chemin","un mouvement, un départ ou un changement de lieu"],["✉️","Lettre","une nouvelle, un message, un papier à signer"],["🚶","Étranger","un visage nouveau entre dans ton histoire"],["🪙","Pièce d'argent","un gain ou une dépense sensée"],["🏠","Maison","une décision ou un changement lié au logis"],["❤️","Cœur","un sentiment vrai demande à être écouté"],["👁️","Œil","quelqu'un te regarde ; sois attentif·ve à ce que tu dis et à qui tu le dis"],["💧","Larme","un soulagement vient après un poids"],["🔒","Cadenas","un obstacle ou une chose qu'il faut laisser attendre"],["🗝️","Clé","une solution est plus proche que tu ne crois"],["⭐","Étoile","chance et guidance"],["🕊️","Oiseau","bonne nouvelle et paix"]],"PEB":["Pierre dans le passé : un vieux poids qui pèse encore ; pardonne et laisse-le tomber.","Pierre dans le présent : un obstacle du moment ; contourne-le, ne lui donne pas un coup de pied.","Pierre dans l'avenir : une épreuve qui te fortifiera, si tu l'accueilles avec patience."],"VERD":{"1,1,3":"La couronne (colac) vient après deux haricots solitaires : après la patience et la solitude, un accomplissement.","1,2,2":"Paire sur paire : soutien et entente ; ne reste pas seul·e dans tes décisions.","2,3,3":"Double abondance : les dons sont grands ; porte-les avec humilité et partage-les."},"ADV":["Ce qui est écrit, les haricots le montrent, mais ce qu'il y a à faire, c'est toi qui le fais.","Les petits pas, faits de bonne foi, mènent loin.","La bonne parole ouvre plus de portes que la clé.","Ne cherche pas la paix au dehors ; elle s'installe d'abord au-dedans.","Sois reconnaissant·e pour ce que tu as, et il en vient davantage.","Mesure trois fois, décide une fois.","Qui sème avec patience récolte avec joie.","Avec de l'eau claire on lave aussi la pensée.","Ce que tu ne peux changer aujourd'hui, laisse-le se déposer jusqu'à demain.","Ne fais pas à autrui ce que tu ne voudrais pas pour toi.","Le matin est plus sage que le soir.","Le conseil des haricots est un miroir : regarde et décide toi-même."],"DESC":{"deochi":{"t":"Incantation contre le mauvais œil (De deochi)","cand":"Au matin, avant le lever du soleil ; traditionnellement le mardi ou le jeudi.","mat":["de l'eau vierge (apă neîncepută) dans un verre ou un bol","trois grains de sel","un fil rouge (facultatif)"],"pas":["Tiens-toi face au levant et pose l'eau devant toi.","Tiens la paume au-dessus de l'eau et dis l'incantation trois fois, en soufflant doucement sur l'eau à chaque fin.","Touche ton front d'un doigt humide. L'eau ne se boit pas.","Verse l'eau au pied d'un arbre ou dans la terre, sans regarder en arrière."],"txt":"Mauvais œil, maléfice du regard,\nsors de l'œil, des cils, des sourcils,\ndu front, des tempes, de l'âme.\nSi tu viens des yeux noirs, va dans la terre noire ;\nsi tu viens des yeux bleus, va dans l'eau bleue ;\nsi tu viens des yeux verts, va dans l'herbe verte ;\nsi tu viens des yeux bruns, va dans le vieux bois.\nJe te laisse, tu me laisses,\nmoi en bien, toi en paix.\nComme la rosée s'en va au soleil,\nainsi tu t'en iras de moi,\net qu'il reste un front pur,\nun œil limpide, un cœur léger.\nMa parole — cadenas,\nl'eau — clé.\nAinsi soit-il !","nota":"L'incantation est une coutume populaire d'apaisement ; si tu souffres réellement (mal de tête, fièvre), va voir un médecin."},"frica":{"t":"Incantation contre la peur (De frică)","cand":"Le soir, quand la maison s'est apaisée.","mat":["une petite bougie (surveille la flamme)","un verre d'eau"],"pas":["Assieds-toi bien droit·e, les pieds sur le sol.","Respire profondément trois fois.","Dis l'incantation doucement, en regardant la flamme.","Éteins la bougie avec précaution et bois quelques gorgées d'eau."],"txt":"Peur, petite peur,\nsi tu es sortie de la nuit, rentre dans la nuit ;\nsi tu es sortie de l'ombre, rentre dans l'ombre ;\nsi tu es sortie du bruit, rentre dans le silence.\nMon cœur n'est pas ta table,\ncar sa maison est de lumière.\nComme la brume quitte la colline\nquand le soleil se lève,\nainsi la peur quittera mon corps,\net qu'il reste la paix,\nle souffle long,\nle pied sûr.\nMa parole — lumière,\nmon souffle — chaîne.\nAinsi soit-il !","nota":"Si la peur ou l'inquiétude t'accompagnent depuis de nombreux jours, parle à un proche ou à un spécialiste."},"somn":{"t":"Incantation pour le sommeil (De somn, chant de berceau)","cand":"Le soir, au coucher.","mat":["un oreiller moelleux","une lumière faible"],"pas":["Installe confortablement l'enfant (ou toi-même).","Dis-la doucement, au rythme d'un berceau, trois fois.","Termine par une caresse sur le front."],"txt":"Viens, sommeil, de la forêt,\nde pas doux sur l'herbe grise,\nde pieds de brumes tendres.\nViens, sommeil, sur le cil,\ncomme le papillon sur la fleur.\nCoupe-lui le souci comme on coupe le pain,\noffre-lui en don un rêve d'étoiles,\nun rêve long comme toute la nuit\net une aube de soleil.\nJe suis là près de toi,\nla lune est à la fenêtre,\nl'ange est au chevet.\nDors, dors, dors,\nle bon sommeil refait le jour.","nota":""},"dor":{"t":"Incantation pour le mal du pays ou du cœur (De dor)","cand":"Au crépuscule, à la fenêtre.","mat":["une fenêtre entrouverte","un verre d'eau"],"pas":["Pense avec douceur à la personne qui te manque.","Dis l'incantation vers la fenêtre.","Bois l'eau et laisse le manque se déposer."],"txt":"Nostalgie, ô nostalgie,\nne brûle plus à la fenêtre,\nne frappe plus à la vitre le soir.\nVa, nostalgie, là où est l'être aimé,\nporte-lui la nouvelle que je pense à lui,\nque j'ai pour lui du bien dans l'âme,\nque je le porte avec tendresse et paix.\nEt quand tu auras dit ta peine,\nreviens doucement,\ncomme la feuille sur l'eau,\ncomme la fumée dans le vent,\net laisse-moi le cœur\nlimpide comme un lac.\nAinsi soit-il !","nota":"L'incantation envoie du bien ; elle n'enchaîne ni n'appelle personne de force."},"spor":{"t":"Incantation pour la prospérité de la maison et de la table (De spor la casă și la masă)","cand":"Pendant la lune croissante, le matin.","mat":["une tranche de pain","une poignée de blé","un peu de sel","une pièce de monnaie"],"pas":["Pose sur la table le pain, le blé, le sel et la pièce.","Dis l'incantation trois fois par-dessus.","Garde la pièce dans ton portefeuille, partage le pain avec quelqu'un et laisse le blé aux oiseaux."],"txt":"Prospérité, ô prospérité,\nfrappe à ma porte :\nà la table avec du pain,\nà la maison avec la paix,\nà la bourse avec un petit sou,\nà la main avec la santé.\nQue le peu grandisse,\nque le beaucoup se partage,\nque le vide se remplisse,\nque le plein se garde.\nComme la pâte lève dans le pétrin,\ncomme l'herbe pousse après la pluie,\nainsi grandira l'abondance dans ma maison,\nnon des larmes d'autrui,\nmais du travail et du bien.\nAinsi soit-il !","nota":"La prospérité vient du travail ; l'incantation est une prière d'espérance, non une garantie financière."},"drum":{"t":"Incantation pour un bon voyage (De drum bun)","cand":"Avant le départ.","mat":["un peu de sel dans la poche","un verre d'eau"],"pas":["Tiens-toi sur le seuil, face à la route.","Dis l'incantation une fois, doucement.","Bois une gorgée d'eau, mets le sel dans ta poche et pars sans te retourner depuis le seuil."],"txt":"Chemin, ô chemin,\nvoie ouverte\npour moi et ceux qui sont avec moi :\nsans pierre sous le pied,\nsans ombre dans la pensée,\nsans mauvaises rencontres.\nLe soleil au front,\nla lune dans le dos,\nbienvenue à l'arrivée,\nbienvenue au retour.\nComme l'eau descend vers la vallée,\nainsi le chemin nous porte,\naisément et en bien.\nAinsi soit-il !","nota":""},"impacare":{"t":"Incantation de réconciliation (De împăcare)","cand":"Le soir, quand la flambée s'est un peu apaisée.","mat":["deux verres d'eau","un morceau de pain"],"pas":["Pose les deux verres l'un à côté de l'autre.","Dis l'incantation par-dessus.","Si possible, bois l'eau du verre avec l'autre personne ; sinon, bois toi-même et laisse l'autre verre sur la table jusqu'au matin."],"txt":"Parole douce, parole ardente,\nprends ton feu et éteins-toi dans l'eau.\nMot âpre, mot sec,\ntrempe-toi dans le lait chaud.\nCe que j'ai dit trop vite,\nque cela se dénoue en patience ;\nce que j'ai entendu dans la colère,\nque cela se pose dans le pardon.\nNon pour que je gagne,\nnon pour que tu gagnes,\nmais pour que la maison gagne.\nNous sommes deux à table\net nous rompons un pain.\nAinsi soit-il !","nota":"L'incantation ne remplace pas une conversation sincère et vraie ; elle en ouvre le chemin."},"ursita":{"t":"Incantation du destin (De ursită, amour droit)","cand":"À la nouvelle lune, le soir.","mat":["un fil rouge ou de laine","une petite bougie"],"pas":["Noue le fil lâchement autour de l'auriculaire de la main gauche, sans le serrer.","Dis l'incantation trois fois.","Garde le fil dans un endroit choisi, en souvenir de ta décision de rester ouvert·e."],"txt":"Destin, fée du destin,\ntoi qui as écrit pour moi à ma naissance\nd'un fil d'or, d'un fil de laine,\nje ne te demande de lier personne,\nni de déplacer les cœurs.\nJe te demande de me préparer :\nle cœur ouvert,\nles yeux limpides,\nla parole droite.\nCelui ou celle qui m'est donné·e en bien,\nqu'il ou elle vienne sur un chemin de bien,\net que je sois bon·ne pour lui ou elle.\nEt si ce n'est pas maintenant,\nque la patience me trouve\net me tienne dans la lumière.\nAinsi soit-il !","nota":"Cette incantation ne vise pas à influencer la volonté d'une autre personne."},"luna":{"t":"Incantation de chance à la nouvelle lune (De noroc la lună nouă)","cand":"Le premier soir où l'on voit la nouvelle lune.","mat":["une petite pièce de monnaie (facultatif)"],"pas":["Regarde la lune depuis un endroit dégagé.","Dis l'incantation une seule fois, la main sur le cœur.","Remercie en pensée et rentre à la maison."],"txt":"Lune nouvelle, lune jeune,\nje t'ai vue la première,\napporte-moi d'abord la chance.\nComme le ciel te fait d'un fil d'argent,\nainsi fais-moi mon sentier.\nQue le bon grandisse avec toi,\nque le pénible diminue.\nQue ma gratitude soit\nsur ton ciel, en paix,\njusqu'à ta pleine rondeur.\nAinsi soit-il !","nota":""},"cap":{"t":"Incantation contre la tête chargée, pensées lourdes (De cap încărcat)","cand":"Au matin, à la lumière du jour.","mat":["un verre d'eau pure"],"pas":["Tiens-toi à la fenêtre ou dehors.","Pose la main sur le front, dis l'incantation doucement.","Bois l'eau en trois gorgées."],"txt":"Pensée lourde, pensée noire,\ntu ne feras pas ton nid dans ma tête.\nJe t'ai reçue, je t'ai écoutée,\nmaintenant je te laisse.\nVa dans l'eau qui coule,\nva dans le vent du matin.\nMa tête, vase pur,\nlimpide comme la source,\nlégère comme la plume.\nQue les bonnes pensées y tiennent,\nque les mauvaises s'en échappent.\nAinsi soit-il !","nota":"C'est une coutume d'apaisement, non un traitement. Si le mal de tête persiste ou s'accompagne d'autres signes, va voir un médecin."},"thx":{"t":"Incantation de gratitude à table (De mulțumire)","cand":"Avant le repas ou le soir.","mat":["du pain et de l'eau"],"pas":["Assieds-toi à table, prends le pain dans la main.","Dis les remerciements.","Romps le pain et partage-le."],"txt":"Merci au pain qui a germé,\naux mains qui ont pétri,\nà la terre qui a porté,\nau soleil qui a cuit,\nà l'eau qui a donné.\nQue ma table soit bénie,\nma maison pleine de paix.\nQue j'aie de quoi donner à l'affamé,\nde quoi prendre si je manque\net un cœur pour toujours remercier.","nota":""},"casa":{"t":"Incantation du soir pour la maison (De seară pentru casă)","cand":"Le soir, avant le coucher.","mat":["un peu de sel","un brin de basilic (ou une autre plante aromatique)"],"pas":["Répands une pincée de sel sur le seuil de la porte.","Pose le basilic dans un coin de la pièce.","Dis l'incantation au milieu de la maison."],"txt":"Sur le seuil avec du sel,\nà la fenêtre avec de la lumière,\nau coin avec du basilic,\nau milieu avec la paix.\nCe qui entre en bien\nqu'il se régale ;\nce qui entre en mal\nqu'il retourne depuis le seuil.\nMa maison, maison de lumière.\nBon sommeil à ceux du dedans,\nbonne route à ceux du dehors.","nota":""}},"ELEM":{"water":["Eau courante, eau vierge (apă neîncepută),","Eau limpide, eau de source,"],"fire":["Feu de lumière, feu d'espérance,","Petite flamme, flamme douce,"],"earth":["Terre sous les pieds, terre nourricière,","Terre chaude, bonne terre,"],"wind":["Vent du matin, vent léger,","Souffle d'air, souffle pur,"],"salt":["Sel de la saline, sel de la terre,","Sel pur, sel de protection,"],"thread":["Fil rouge, fil de vie,","Fil ténu, fil qui relie au bien,"]},"CORE":{"prot":["Garde la maison, le chemin et la pensée du mauvais regard,","Garde de la mauvaise parole et du faux pas,","Ne laisse que le bien franchir le seuil,","Mets de la lumière alentour, comme un mur de lumière,"],"calm":["Chasse la peur et le souci de la poitrine,","Rends le souffle long et le cœur léger,","Mets dans la pensée la clarté de la source,","Donne un bon sommeil et un jour paisible,"],"fam":["Rassemble la famille à une table de paix,","Dénoue la rancœur, apporte la parole douce,","Mets le pardon entre les proches,","Garde la maison chaude et la porte ouverte,"],"love":["Prépare le cœur à un amour droit,","Rends les yeux limpides et la parole honnête,","Donne la patience jusqu'à la bonne heure,","Qu'il ne lie personne de force, mais éclaire la voie,"],"spor":["Donne la prospérité à la maison et à la table,","Donne fruit au travail et juste récompense,","Que le peu grandisse, que le beaucoup se partage,","Mets l'abondance dans la main qui donne,"],"road":["Ouvre la voie et garde le pied de la pierre,","Mets le soleil au front et la paix derrière,","Mène au but en bien et ramène avec profit,","Donne de bons compagnons sur la route,"],"thx":["Merci pour le pain et pour l'eau,","Merci pour la maison et pour les êtres chers,","Merci pour le jour d'aujourd'hui et pour celui de demain,","Merci pour la lumière qui nous soutient,"]},"IMG":["Comme la rosée s'en va au soleil,\nainsi s'en aille tout le superflu.","Comme la source coule vers la vallée,\nainsi coule le bien vers la maison.","Comme la feuille se pose sur l'eau,\nainsi se pose la paix.","Comme le soleil se lève après la nuit,\nainsi se lève la clarté.","Comme le blé mûrit sous le soleil,\nainsi mûrisse le temps propice.","Comme l'oiseau trouve son nid,\nainsi l'être humain trouve son repos."],"SEAL":"Ma parole — cadenas,\nmon souffle — clé.\nAinsi soit-il, trois fois !","GEN_FOR":"Pour {n}, en bien.","ROWT":[["Tête chargée (cap încărcat) : grand souci, décisions remises ; attends que cela s'éclaircisse.","Les pensées s'embrouillent ; ne décide pas dans la hâte.","L'esprit est plutôt serein ; un petit doute demande de la patience.","Pensées limpides et désirs à la voie ouverte ; ce que tu as en tête peut s'accomplir."],["Cœur lourd : chagrin ou larmes ; protège ta paix et ton repos.","Émotions embrouillées ; il te faut une parole sincère à la maison.","Les sentiments sont plutôt bons ; un petit chagrin s'apaisera.","Le cœur est en paix : amour, maison et santé se portent bien."],["Chemin fermé pour l'instant : remets les départs et les grandes affaires.","Chemin avec obstacles ou dépenses ; prépare-toi avec calcul.","La route avance, avec quelque retard.","Chemins ouverts et argent chanceux ; hôtes bienvenus."]],"CELLN":["net","retard","pleine chance","poids"],"SP":{"cump":"Grande croisée (cumpăna mare) : le premier tas en haut (à gauche) et le dernier en bas (à droite) sont pairs — il y a un obstacle à franchir ; fais-le à petits pas.","drum":"Chemin ouvert (drumul deschis) : la rangée du bas n'a que des nombres impairs — tout chemin ou projet commencé maintenant réussit.","linie":"Ligne chanceuse (linia norocoasă) : une ligne entière de 3 haricots chacun — le souhait s'accomplit vite et sans obstacle."},"OLT":{"title":"Olténie","casa4":"Dans la maison (case 5) : exactement 4 haricots — maison pleine (casă plină), abondance et contentement ; le souhait s'accomplit très vite.","casa_1":"Dans la maison (case 5) : {n} haricot.","casa_n":"Dans la maison (case 5) : {n} haricots.","sum5":"La rangée du haut totalise 5 : réponse positive, qui arrivera en hâte.","sum9":"La rangée du haut totalise 9 : réponse positive, plus tard, mais sûre.","sumN":"La rangée du haut totalise {n} : pas de signe particulier.","bob_sus":"Haricot seul en haut : nouvelle en vain, sans importance.","colac_cap":"Couronne sur la tête (colac în cap) : grande joie.","sositor_strict":"Haricot messager (bob sositor) (1 haricot en bas à droite) : de l'argent arrive ou une nouvelle longtemps attendue, un être cher revenant d'un long voyage.","sositor_wide":"Haricot messager (bob sositor), variante large (1 haricot sur la rangée du bas, pas à droite) : un être cher revient d'un long voyage ou de l'argent arrive à la maison.","prag_strict":"Couronne au seuil (colac în prag) (3 haricots en bas au milieu) : noce, fête, chers invités.","prag_wide":"Couronne au seuil (colac în prag), variante large (3 haricots sur la rangée du bas, pas au milieu) : des invités ou une fête.","doua":"Deux haricots : doute, balance ou nouvelle qui serre le cœur.","linie":"Ligne de 2 ou 3 haricots alignés consécutivement : long voyage, au-delà des frontières ou hors du département.","desc_lbl":"Incantation de destination (descântec de menire) (variante locale ; les formules diffèrent d'un village à l'autre) :","short_lbl":"Variante courte :","desc":"Vous, 41 haricots,\nComme vous savez germer,\nVerdir toutes les prairies,\nNourrir tout le monde,\nAinsi sachez la nouvelle de [nom de la personne]...\nSi c'est en bien, tombez sur six (ou sur neuf),\nEt deux au cœur, pour que cela se voie bien !","desc2":"Comme vous nourrissez le monde,\nainsi montrez-moi la vérité\nsur [nom de la personne / la question]."},"YN":["La réponse des haricots : OUI — les haricots sont de ton côté.","Plutôt oui, avec un peu de patience.","Plutôt non pour l'instant ; attends une meilleure heure.","NON pour le moment ; laisse les choses se poser."],"GUIDE":"🫘 LA PRÉPARATION\n1. Prends dans ta main exactement 41 haricots blancs (ou grains de maïs).\n2. Souffle dessus 3 fois et dis : « Comme vous nourrissez le monde, ainsi montrez-moi la vérité sur [ta question] ».\n\n📐 LA RÉPARTITION (de 4 en 4)\nLes haricots se disposent en une matrice de 3 rangées × 3 tas.\n• Rangée 1 (HAUT — la Pensée) : du grand tas on retire 4 par 4 ; le reste (1, 2, 3 ou 4 haricots) forme le premier tas, à gauche. Répète avec les haricots comptés pour le tas du milieu, puis pour celui de droite.\n• Rangée 2 (MILIEU — le Cœur) : rassemble les haricots restants et répète pour les 3 tas du milieu.\n• Rangée 3 (BAS — le Chemin) : répète pour les 3 derniers tas.\nLes haricots qui restent à la fin sont mis de côté.\nDans l'application : au lieu de ce « tirage dans le tas », tu coupes la file de 41 haricots en 9 tas (huit coupes) et tu en retires 4 par 4 dans chacun ; le reste de 1 à 4 entre dans la matrice. Ainsi chaque lecture sort différente.\n\n🔮 LA LECTURE RAPIDE\n• 1 ou 3 haricots (impair) : bon signe, joie, réussite — OUI.\n• 2 ou 4 haricots (pair) : balance, retard, chagrin — NON.\n\n🌟 LES GRANDS SIGNES\n• 4 haricots au centre : « Maison pleine (casă plină) » (chance, argent, abondance).\n• 3 haricots en bas au milieu : « Couronne au seuil (colac în prag) » (noce, fête, chers invités).\n• 1 haricot en bas à droite : « Haricot messager (bob sositor) » (de l'argent arrive ou une nouvelle longtemps attendue).\n• Pair en haut à gauche et en bas à droite : « Grande croisée (cumpăna mare) ».\n• Rangée du bas uniquement impaire : « Chemin ouvert (drumul deschis) ».\n• Une ligne de 3 haricots chacun : « Ligne chanceuse (linia norocoasă) ».\nEn Olténie, ajoute : 3 haricots sur la rangée du haut = « couronne sur la tête (colac în cap) » ; la rangée du haut totalise 5 (en hâte) ou 9 (plus tard, mais sûr) ; ne consulte pas les haricots deux fois le même jour pour la même question."},"it":{"READ":{"g":[["Hai portato molto da te, senza nessuno accanto; un'antica premura ti tiene ancora il posto nel cuore.","Qualcuno ti è stato vicino e tu ne custodisci ancora il bene.","Un cerchio si è chiuso alle tue spalle; ciò che doveva compiersi si è compiuto."],["Sei a un bivio del pensiero; attendi un segno, non affrettare il passo.","Due cose si pesano ora: ascolta il cuore e ascolta anche il conto.","Siedi alla tavola dell'abbondanza: hai più di quanto credi, conta con gratitudine."],["Arriva una piccola notizia, che però cambia direzione.","Si avvicina un incontro o un buon accordo.","Un compimento sta maturando; la pazienza sarà ripagata."]],"d":[["Un amore non concluso ti cammina ancora tra i ricordi.","Fu un legame buono, con radici che si sentono ancora.","Una storia si è chiusa con grazia; lasciale fare il suo compi
