to."],["Il cuore è solo, ma non deserto; si prepara a qualcosa.","Due si avvicinano: o tu e qualcuno, o tu e te stesso.","Il cuore è pieno; bada a non chiedere più di quanto si possa dare."],["Un sentimento nuovo si mostra senza far rumore.","Un incontro d'anime o una riconciliazione è vicina.","Si prepara un legame che mette radici, con il pensiero e con i fatti."]],"b":[["Un inizio fragile ti ha insegnato a essere parsimonioso.","Un guadagno è arrivato con l'aiuto di qualcuno.","Un'abbondanza di un tempo ti ha insegnato il prezzo delle cose."],["La borsa è leggera, ma la calma è salda; tieni il conto.","Entrate e uscite si bilanciano; evita i prestiti.","Aumento in casa; dividilo con misura."],["Non avere fretta con nuovi affari; tieni bene gli occhi aperti.","Un guadagno arriva per due vie; fai attenzione a una collaborazione.","Il frutto del lavoro si raccoglie; ciò che semini ora darà raccolto."]],"c":[["Una partenza fatta in fretta; qualcosa alle spalle va ancora chiarito.","Un viaggio fatto con buona compagnia è stato ben speso.","Un lungo cammino si è concluso bene."],["Non è ancora l'ora di partire; prepara il bagaglio.","Si aprono due strade; scegli quella che ti dà pace.","La strada è aperta; porta con te un po' di sale e molta pazienza."],["Un viaggio breve o una notizia portata da lontano.","Un cammino in compagnia, che porta a un incontro importante.","Un grande cammino benedetto, con ritorno carico di frutti."]],"a":[["Un antico silenzio in casa non si è ancora sciolto.","Qualcuno della stirpe ti ha protetto; porta il suo ricordo con onore.","La grande tavola della famiglia è rimasta nel ricordo; conserva l'usanza."],["Le piccole cure della casa hanno bisogno di una buona parola.","Due di casa devono intendersi; ascolta più di quanto parli.","La casa è piena di senso; ringrazia per ciò che hai."],["Una notizia bussa al cancello, da parenti o da amici.","Una riconciliazione in famiglia o un ospite caro.","Festa o gioia a una grande tavola."]],"m":[["Hai lavorato da te e la tua fatica non si è vista.","Un collega o un maestro ti è stato sostegno.","Un'opera portata a termine ora ti dà peso."],["Ancora un piccolo passo e il risultato si mostra; non fermarti.","Si chiede collaborazione; dividi il compito.","Sei al frutto del lavoro; bada a non disperderti."],["Una proposta inattesa; pesala con pazienza.","Una collaborazione o un cambio di squadra ti aiuta.","Riconoscimento e stabilità: hai lavorato su basi solide."]]},"SIGNS":[["🛤️","Strada","un movimento, una partenza o un cambio di luogo"],["✉️","Lettera","una notizia, un messaggio, una carta da firmare"],["🚶","Straniero","un volto nuovo entra nella tua storia"],["🪙","Denaro","un guadagno o una spesa sensata"],["🏠","Casa","una decisione o un cambiamento legato all'abitazione"],["❤️","Cuore","un sentimento vero chiede ascolto"],["👁️","Occhio","qualcuno ti guarda; fai attenzione a ciò che dici e a chi lo dici"],["💧","Lacrima","un sollievo viene dopo un peso"],["🔒","Lucchetto","un ostacolo o una cosa che va lasciata attendere"],["🗝️","Chiave","una soluzione è più vicina di quanto credi"],["⭐","Stella","fortuna e guida"],["🕊️","Uccello","buona notizia e quiete"]],"PEB":["Sasso nel passato: un vecchio peso che ancora grava; perdona e lascialo cadere.","Sasso nel presente: un ostacolo del momento; aggiralo, non prenderlo a calci.","Sasso nel futuro: una prova che ti rafforzerà, se l'accogli con pazienza."],"VERD":{"1,1,3":"La corona arriva dopo due fagioli soli: dopo pazienza e solitudine, un compimento.","1,2,2":"Coppia su coppia: sostegno e intesa; non restare solo nelle decisioni.","2,3,3":"Abbondanza doppia: i doni sono grandi; portali con umiltà e dividili."},"ADV":["Ciò che è scritto, nei fagioli si mostra, ma ciò che c'è da fare, lo fai tu.","I piccoli passi, fatti in buona fede, vanno lontano.","La parola buona apre più porte della chiave.","Non cercare la pace fuori; si posa prima dentro.","Sii riconoscente per ciò che hai, e ne verrà ancora.","Misura tre volte, decidi una sola.","Chi semina con pazienza raccoglie con gioia.","Con acqua limpida si lava anche il pensiero.","Ciò che oggi non puoi cambiare, lascia che si posi fino a domani.","Non fare ad altri ciò che non vorresti per te.","Il mattino è più saggio della sera.","Il consiglio dei fagioli è uno specchio: guarda e decidi tu."],"DESC":{"deochi":{"t":"Scongiuro contro il malocchio (De deochi)","cand":"Al mattino, prima dell'alba; per tradizione di martedì o di giovedì.","mat":["acqua non ancora toccata in un bicchiere o in una ciotola","tre grani di sale","un filo rosso (facoltativo)"],"pas":["Mettiti con il viso a oriente e poni l'acqua davanti a te.","Tieni il palmo sopra l'acqua e pronuncia l'incantesimo tre volte, soffiando piano sull'acqua a ogni chiusura.","Tocca la fronte con un dito bagnato. L'acqua non si beve.","Versa l'acqua alla radice di un albero o nella terra, senza guardare indietro."],"txt":"Malocchio, malocchietto,\nesci dall'occhio, dalle ciglia, dalle sopracciglia,\ndalla fronte, dalle tempie, dall'anima.\nSe vieni da occhi neri, va' nella terra nera;\nse vieni da occhi azzurri, va' nell'acqua azzurra;\nse vieni da occhi verdi, va' nell'erba verde;\nse vieni da occhi castani, va' nel legno vecchio.\nIo ti lascio, tu mi lasci,\nio col bene, tu con la pace.\nCome la rugiada va verso il sole,\ncosì te ne vada da me,\ne resti fronte pulita,\nocchio limpido, cuore leggero.\nLa mia parola — lucchetto,\nl'acqua — chiave.\nCosì sia!","nota":"L'incantesimo è un'usanza popolare di quiete; se hai un disturbo reale (mal di testa, febbre), rivolgiti a un medico."},"frica":{"t":"Scongiuro contro la paura (De frică)","cand":"La sera, quando la casa si è quietata.","mat":["una piccola candela (sorveglia la fiamma)","un bicchiere d'acqua"],"pas":["Siediti dritto, con i piedi sul pavimento.","Respira a fondo tre volte.","Pronuncia l'incantesimo piano, guardando la fiamma.","Spegni la candela con cura e bevi qualche sorso d'acqua."],"txt":"Paura, paurella,\nse sei uscita dalla notte, torna nella notte;\nse sei uscita dall'ombra, torna nell'ombra;\nse sei uscita dal frastuono, torna nel silenzio.\nIl mio cuore non è tavola per te,\nperché la sua casa è di luce.\nCome la nebbia lascia il colle\nquando sorge il sole,\ncosì lasci la paura me,\ne resti la pace,\nrespiro lungo,\npiede sicuro.\nLa mia parola — luce,\nil mio respiro — catena.\nCosì sia!","nota":"Se la paura o l'inquietudine ti accompagnano da molti giorni, parlane con una persona vicina o con uno specialista."},"somn":{"t":"Scongiuro per il sonno, ninna nanna (De somn)","cand":"La sera, all'ora di coricarsi.","mat":["un cuscino morbido","una luce tenue"],"pas":["Sistema il bambino (o te stesso) comodamente.","Pronuncia piano, a ritmo di culla, tre volte.","Chiudi con una carezza sulla fronte."],"txt":"Vieni, sonno, dal bosco,\ncon passi molli d'erba grigia,\ncon piedi di nebbie gentili.\nVieni, sonno, sul ciglio,\ncome la farfalla sul fiore.\nTaglia la pena come il pane,\ndagli in dono un sogno di stelle,\nun sogno lungo quanto tutta la notte\ne un'alba con il sole.\nIo sto accanto a te,\nla luna sta alla finestra,\nl'angelo sta al capezzale.\nDormi, dormi, dormi,\nil buon sonno rifà il giorno.","nota":""},"dor":{"t":"Scongiuro per la nostalgia (De dor)","cand":"Al crepuscolo, alla finestra.","mat":["una finestra socchiusa","un bicchiere d'acqua"],"pas":["Pensa con dolcezza alla persona di cui senti nostalgia.","Pronuncia l'incantesimo verso la finestra.","Bevi l'acqua e lascia che la nostalgia si posi."],"txt":"Nostalgia, nostalgia,\nnon bruciare alla finestra,\nnon bussare al vetro la sera.\nVa', nostalgia, dove sta la nostalgia,\ndille che la penso,\nche ho per lei bene nell'anima,\nche lo porto con amore e pace.\nE quando hai detto la tua pena,\ntorna piano,\ncome la foglia sull'acqua,\ncome il fumo nel vento,\ne lasciami il cuore\nlimpido come il lago.\nCosì sia!","nota":"L'incantesimo manda bene, non lega e non chiama nessuno con la forza."},"spor":{"t":"Scongiuro per l'abbondanza in casa e a tavola (De spor la casă și la masă)","cand":"A luna crescente, al mattino.","mat":["una fetta di pane","un pugno di grano","un po' di sale","una moneta"],"pas":["Poni sulla tavola il pane, il grano, il sale e la moneta.","Pronuncia l'incantesimo tre volte su di essi.","Conserva la moneta nel portafoglio, dividi il pane con qualcuno e lascia il grano agli uccelli."],"txt":"Abbondanza, abbondanza,\nbussa alla mia porta:\nin tavola col pane,\nin casa con la pace,\nin borsa con un soldino,\nin mano con la salute.\nCiò che è poco cresca,\nciò che è molto si divida,\nciò che è vuoto si riempia,\nciò che è pieno si conservi.\nCome cresce l'impasto nella madia,\ncome cresce l'erba dopo la pioggia,\ncosì cresca l'abbondanza in casa mia,\nnon da lacrime altrui,\nma da lavoro e da bene.\nCosì sia!","nota":"L'abbondanza viene dal lavoro; l'incantesimo è una preghiera di speranza, non una garanzia finanziaria."},"drum":{"t":"Scongiuro per il buon cammino (De drum bun)","cand":"Prima della partenza.","mat":["un po' di sale in tasca","un bicchiere d'acqua"],"pas":["Sta' sulla soglia con il viso verso la strada.","Pronuncia l'incantesimo una volta, piano.","Bevi un sorso d'acqua, metti il sale in tasca e parti senza tornare indietro dalla soglia."],"txt":"Cammino, cammino,\nstrada aperta\na me e a chi è con me:\nsenza sasso nel piede,\nsenza ombra nel pensiero,\nsenza brutti incontri.\nIl sole in fronte,\nla luna alle spalle,\nbenvenuto all'arrivo,\nbenvenuto al ritorno.\nCome l'acqua scende a valle,\ncosì ci porti la strada,\nleggera e col bene.\nCosì sia!","nota":""},"ursita":{"t":"Scongiuro per il destino, amore giusto (De ursită)","cand":"A luna nuova, la sera.","mat":["un filo rosso o di lana","una piccola candela"],"pas":["Lega il filo allentato attorno al mignolo della mano sinistra, senza stringerlo.","Pronuncia l'incantesimo tre volte.","Conserva il filo in un luogo scelto, a ricordo della decisione di restare aperti."],"txt":"Destino, fata del destino,\nche alla nascita mi hai scritto\ncon filo d'oro, con filo di lana,\nnon ti chiedo di legare nessuno,\nné di spostare cuori dal loro posto.\nTi chiedo di prepararmi:\ncon cuore aperto,\ncon occhi limpidi,\ncon parola giusta.\nChi mi è dato in bene\nvenga per la via del bene,\ned io per la sua sia buono.\nE se non è ora,\nmi trovi la pazienza\ne mi tenga nella luce.\nCosì sia!","nota":"Questo incantesimo non mira a influenzare la volontà di un'altra persona."},"luna":{"t":"Scongiuro di fortuna a luna nuova (De noroc la lună nouă)","cand":"La prima sera in cui si vede la luna nuova.","mat":["una piccola moneta (facoltativa)"],"pas":["Guarda la luna da un luogo aperto.","Pronuncia l'incantesimo una sola volta, con la mano sul cuore.","Ringrazia in pensiero ed entra in casa."],"txt":"Luna nuova, luna giovane,\nio ti ho vista per prima,\nfortuna portami per prima.\nCome il cielo ti fa di filo d'argento,\ncosì mi fai il sentiero.\nCiò che è buono cresca con te,\nciò che è pesante si riduca.\nSia il mio ringraziamento\nsul tuo cielo, in pace,\nfinché non sarai piena.\nCosì sia!","nota":""},"cap":{"t":"Scongiuro per la testa appesantita, pensieri gravi (De cap încărcat)","cand":"Al mattino, alla luce del giorno.","mat":["un bicchiere d'acqua pulita"],"pas":["Sta' alla finestra o all'aperto.","Metti la mano sulla fronte, pronuncia l'incantesimo piano.","Bevi l'acqua in tre sorsi."],"txt":"Pensiero grave, pensiero nero,\nnon fai il nido nella mia testa.\nTi ho accolto, ti ho ascoltato,\nora ti lascio.\nVa' nell'acqua che scorre,\nva' nel vento del mattino.\nMia testa, vaso pulito,\nlimpida come la sorgente,\nleggera come la piuma.\nPensieri buoni vi trovino posto,\npensieri cattivi si dileguino.\nCosì sia!","nota":"È un'usanza di quiete, non una cura. Se il mal di testa persiste o è accompagnato da altri segni, rivolgiti a un medico."},"thx":{"t":"Scongiuro di ringraziamento, a tavola (De mulțumire)","cand":"Prima del pasto o la sera.","mat":["pane e acqua"],"pas":["Siediti a tavola, prendi il pane in mano.","Pronuncia il ringraziamento.","Spezza il pane e dividilo."],"txt":"Grazie al pane che è germogliato,\nalle mani che hanno impastato,\nalla terra che ha portato,\nal sole che ha cotto,\nall'acqua che ha dato.\nSia la mia tavola benedetta,\nla mia casa piena di pace.\nAbbia io da dare all'affamato,\nda prendere se mi manca,\ne un cuore per ringraziare sempre.","nota":""},"casa":{"t":"Scongiuro della sera per la casa (De seară pentru casă)","cand":"La sera, prima di coricarsi.","mat":["un po' di sale","un rametto di basilico (o un'altra erba aromatica)"],"pas":["Spargi un pizzico di sale sulla soglia della porta.","Metti il basilico in un angolo della stanza.","Pronuncia l'incantesimo in mezzo alla casa."],"txt":"Sulla soglia col sale,\nalla finestra con la luce,\nnell'angolo col basilico,\nal centro con la pace.\nCiò che entra col bene\nsia ospitato a festa;\nciò che entra col male\ntorni indietro dalla soglia.\nCasa mia, casa di luce.\nSonno buono a chi sta dentro,\nbuon cammino a chi sta fuori.","nota":""},"impacare":{"t":"Scongiuro per la riconciliazione (De împăcare)","cand":"La sera, dopo che il fuoco si è un po' placato.","mat":["due bicchieri d'acqua","un pezzo di pane"],"pas":["Metti i due bicchieri l'uno accanto all'altro.","Pronuncia l'incantesimo su di essi.","Se è possibile, bevi l'acqua dal bicchiere insieme all'altra persona; se no, bevi tu e lascia l'altro bicchiere sulla tavola fino al mattino."],"txt":"Parola mite, parola accesa,\nprendi il tuo fuoco e spegniti nell'acqua.\nParola aspra, parola secca,\naddolcisciti nel latte caldo.\nCiò che ho detto in fretta,\nsi sciolga nella pazienza;\nciò che ho udito nel dispiacere,\nsi posi nel perdono.\nNon perché vinca io,\nnon perché vinca tu,\nma perché vinca la casa.\nIn due stiamo a tavola\ne un pane spezziamo.\nCosì sia!","nota":"L'incantesimo non sostituisce una conversazione sincera; apre la strada verso di essa."}},"ELEM":{"water":["Acqua che scorre, acqua non toccata,","Acqua limpida, acqua di sorgente,"],"fire":["Fuoco di luce, fuoco di speranza,","Fiammella piccola, fiammella mite,"],"earth":["Terra sotto i piedi, terra che nutre,","Zolla calda, zolla buona,"],"wind":["Vento del mattino, vento leggero,","Soffio d'aria, soffio puro,"],"salt":["Sale dal salato, sale dalla terra,","Sale puro, sale di protezione,"],"thread":["Filo rosso, filo di vita,","Filo sottile, filo di legame col bene,"]},"CORE":{"prot":["Proteggi la casa, il cammino e il pensiero da sguardo cattivo,","Proteggi da parola cattiva e da passo sbagliato,","Lascia varcare la soglia solo al bene,","Metti luce attorno, come un muro di luce,"],"calm":["Scaccia la paura e l'affanno dal petto,","Fa' il respiro lungo e il cuore leggero,","Metti nel pensiero la limpidezza della sorgente,","Dona sonno buono e giorno quieto,"],"fam":["Raccogli la stirpe a una tavola di pace,","Sciogli il rancore, porta la parola dolce,","Metti perdono tra chi è vicino,","Tieni la casa calda e la porta aperta,"],"love":["Prepara il cuore a un amore giusto,","Rendi limpidi gli occhi e onesta la parola,","Dona pazienza fino all'ora buona,","Non leghi nessuno con la forza, ma illumini il cammino,"],"spor":["Dona abbondanza in casa e a tavola,","Dona frutto al lavoro e giusta ricompensa,","Ciò che è poco cresca, ciò che è molto si divida,","Metti abbondanza nella mano che dona,"],"road":["Apri la via e proteggi il piede dal sasso,","Metti il sole in fronte e la pace alle spalle,","Conduci alla meta col bene e riporta indietro con frutto,","Dona buoni compagni di strada,"],"thx":["Grazie per il pane e per l'acqua,","Grazie per la casa e per i cari,","Grazie per il giorno d'oggi e per quello di domani,","Grazie per la luce che ci sostiene,"]},"IMG":["Come la rugiada va verso il sole,\ncosì se ne vada tutto ciò che è di troppo.","Come la sorgente scorre a valle,\ncosì scorra il bene verso casa.","Come la foglia si posa sull'acqua,\ncosì si posi la pace.","Come il sole sorge dopo la notte,\ncosì sorga la limpidezza.","Come il grano matura sotto il sole,\ncosì maturi il tempo buono.","Come l'uccello trova il suo nido,\ncosì l'uomo trovi la quiete."],"SEAL":"La mia parola — lucchetto,\nil mio respiro — chiave.\nCosì sia, per tre volte!","GEN_FOR":"Per {n}, con bene.","ROWT":[["Testa appesantita: grande pensiero, decisioni rimandate; attendi che si schiarisca.","I pensieri si ingarbugliano; non decidere in fretta.","La mente è per lo più serena; un piccolo dubbio chiede pazienza.","Pensieri limpidi e desideri con la via aperta; ciò che hai in mente può compiersi."],["Cuore pesante: dispiacere o lacrime; proteggi la tua quiete e il tuo riposo.","Emozioni intricate; hai bisogno di una parola sincera in casa.","I sentimenti sono per lo più buoni; un piccolo dispiacere si placherà.","Il cuore è in pace: amore, casa e salute stanno bene."],["Strada chiusa per ora: rimanda partenze e grandi affari.","Strada con intralci o spese; preparati con calcolo.","La strada procede, con qualche indugio.","Strade aperte e denaro con fortuna; ospiti benvenuti."]],"CELLN":["pulito","indugio","piena fortuna","peso"],"SP":{"cump":"Il grande bivio (cumpăna mare): il primo mucchio in alto (a sinistra) e l'ultimo in basso (a destra) sono pari — hai un ostacolo da superare; fallo a piccoli passi.","drum":"La strada aperta (drumul deschis): la riga in basso ha solo numeri dispari — ogni cammino o piano iniziato ora ha successo.","linie":"La linea fortunata (linia norocoasă): un'intera linea di 3 fagioli ciascuno — il desiderio si avvera presto e senza ostacoli."},"OLT":{"title":"Oltenia","casa4":"In casa (Casella 5): esattamente 4 fagioli — casa piena (casă plină), abbondanza e appagamento; il desiderio si avvera molto presto.","casa_1":"In casa (Casella 5): {n} fagiolo.","casa_n":"In casa (Casella 5): {n} fagioli.","sum5":"La riga in alto somma 5: risposta positiva, che avverrà in fretta.","sum9":"La riga in alto somma 9: risposta positiva, più tardi ma certa.","sumN":"La riga in alto somma {n}: nessun segno particolare.","bob_sus":"Fagiolo solo in alto: notizia a vuoto, senza importanza.","colac_cap":"Corona sul capo (colac în cap): grande gioia.","sositor_strict":"Fagiolo in arrivo (bob sositor) (1 fagiolo in basso a destra): arriva denaro o una notizia molto attesa, una persona cara da lontano.","sositor_wide":"Fagiolo in arrivo (bob sositor), variante ampia (1 fagiolo sulla riga in basso, non a destra): una persona cara torna da lontano o arriva denaro in casa.","prag_strict":"Corona sulla soglia (colac în prag) (3 fagioli in basso al centro): nozze, festa, ospiti cari.","prag_wide":"Corona sulla soglia (colac în prag), variante ampia (3 fagioli sulla riga in basso, non al centro): ospiti o una festa.","doua":"Due fagioli: dubbio, bivio o una notizia che stringe il cuore.","linie":"Linea di 2 o 3 fagioli disposti di seguito: lungo viaggio, oltre i confini o fuori dal distretto.","desc_lbl":"Incantesimo di destinazione (variante locale; le formule cambiano da villaggio a villaggio):","short_lbl":"Variante breve:","desc":"Voi, 41 fagioli,\nCome sapete germogliare,\nTutti i prati rinverdire,\nTutto il mondo nutrire,\nCosì sappiate dire di [nome della persona]...\nSe è di bene, date sei (oppure nove),\nAl cuore due, che si veda bene!","desc2":"Come nutrite il mondo,\ncosì mostratemi la verità\nsu [nome della persona / la domanda]."},"YN":["Risposta dei fagioli: SÌ — i fagioli sono dalla tua parte.","Piuttosto sì, con un po' di pazienza.","Piuttosto no, per ora; attendi un'ora migliore.","NO per il momento; lascia che le cose si posino."],"GUIDE":"🫘 LA PREPARAZIONE\n1. Prendi in pugno esattamente 41 fagioli bianchi (o chicchi di mais).\n2. Soffia su di essi 3 volte e di': «Come nutrite il mondo, così mostratemi la verità su [la tua domanda]».\n\n📐 LA DIVISIONE (a gruppi di 4)\nI fagioli si dispongono in una matrice di 3 righe × 3 mucchi.\n• Riga 1 (ALTO — il Pensiero): dal mucchio grande si tolgono 4 alla volta; il resto (1, 2, 3 o 4 fagioli) è il primo mucchio, a sinistra. Ripeti con i fagioli contati per il mucchio di mezzo, poi per quello di destra.\n• Riga 2 (CENTRO — il Cuore): raccogli i fagioli rimasti e ripeti per i 3 mucchi del centro.\n• Riga 3 (BASSO — la Strada): ripeti per gli ultimi 3 mucchi.\nI fagioli che avanzano alla fine si mettono da parte.\nNell'app: al posto di questo «prendi dal mucchio», si taglia la fila di 41 fagioli in 9 mucchi (otto tagli) e da ciascuno si tolgono 4 alla volta; il resto di 1–4 entra nella matrice. Così ogni lettura esce diversa.\n\n🔮 LETTURA RAPIDA\n• 1 o 3 fagioli (dispari): segno buono, gioia, riuscita — SÌ.\n• 2 o 4 fagioli (pari): bivio, ritardo, dispiacere — NO.\n\n🌟 I GRANDI SEGNI\n• 4 fagioli al centro: «Casa piena (casă plină)» (fortuna, denaro, abbondanza).\n• 3 fagioli in basso al centro: «Corona sulla soglia (colac în prag)» (nozze, festa, ospiti cari).\n• 1 fagiolo in basso a destra: «Fagiolo in arrivo (bob sositor)» (arriva denaro o una notizia molto attesa).\n• Pari in alto a sinistra e in basso a destra: «Il grande bivio (cumpăna mare)».\n• Riga in basso solo dispari: «La strada aperta (drumul deschis)».\n• Una linea di 3 fagioli ciascuno: «La linea fortunata (linia norocoasă)».\nIn Oltenia, aggiungi: 3 fagioli sulla riga in alto = «corona sul capo (colac în cap)»; la riga in alto somma 5 (in fretta) o 9 (più tardi, ma certo); non leggere i fagioli due volte lo stesso giorno per la stessa domanda."},"es":{"READ":{"g":[["Has llevado mucho a solas; un cuidado antiguo aún ocupa un lugar en tu corazón.","Alguien estuvo a tu lado y todavía guardas su bien.","Un círculo se cerró a tus espaldas; lo que debía cumplirse se cumplió."],["Estás en una encrucijada del pensamiento; espera una señal y no apresures el paso.","Dos cosas se pesan ahora: escucha tanto al corazón como a la cuenta.","Estás sentado a la mesa de la abundancia: tienes más de lo que crees, cuenta con gratitud."],["Llega una noticia pequeña, pero que cambia el rumbo.","Se acerca un encuentro o un buen acuerdo.","Se está cociendo un cumplimiento; la paciencia será recompensada."]],"d":[["Un amor inconcluso aún camina por tus recuerdos.","Fue un vínculo bueno, con raíces que todavía se sienten.","Una historia terminó con belleza; deja que cumpla su cometido."],["El corazón está solo, pero no vacío; se prepara para algo.","Dos se acercan: tú y alguien, o tú y tú mismo.","El corazón está lleno; cuida de no pedir más de lo que se puede dar."],["Un sentimiento nuevo se muestra sin hacer ruido.","Un encuentro del alma o una reconciliación está cerca.","Se prepara un vínculo que echa raíces, con pensamiento y con obra."]],"b":[["Un comienzo frágil te enseñó a ser ahorrador.","Una ganancia llegó con la ayuda de alguien.","Una abundancia de antaño te enseñó el valor de las cosas."],["La bolsa pesa poco, pero la templanza pesa mucho; lleva bien las cuentas.","Entradas y salidas se equilibran; evita los préstamos.","Prosperidad para la casa; repártela con medida."],["No te apresures con negocios nuevos; abre bien los ojos.","Una ganancia llega por dos caminos; atención a una sociedad.","El fruto del trabajo se recoge; lo que siembras ahora da cosecha."]],"c":[["Una partida hecha con prisa; aún tienes algo que aclarar atrás.","Un camino hecho con buen compañero fue acertado.","Un largo camino terminó bien."],["Todavía no es la hora de partir; prepara el equipaje.","Se abren dos caminos; elige el que te dé sosiego.","El camino está abierto; lleva contigo un poco de sal y mucha paciencia."],["Un viaje corto o una noticia traída de lejos.","Un camino con compañía, que lleva a un encuentro importante.","Un gran camino bendecido, con regreso cargado de bienes."]],"a":[["Un viejo silencio de la casa aún no se ha deshecho.","Alguien de tu linaje te protegió; lleva su recuerdo con honra.","La gran mesa de la familia quedó en la memoria; conserva la costumbre."],["Las pequeñas preocupaciones de la casa necesitan una buena palabra.","Dos de la casa deben entenderse; escucha más de lo que hablas.","La casa está llena de sentido; da gracias por lo que tienes."],["Una noticia llama a la puerta, de parientes o de amigos.","Una reconciliación en la familia o un huésped querido.","Fiesta o alegría en la mesa grande."]],"m":[["Trabajaste a solas y tu esfuerzo no se vio.","Un colega o un mentor fue tu apoyo.","Una obra llevada a término te da ahora peso."],["Un pasito más y el resultado se muestra; no te detengas.","Se pide colaboración; reparte la tarea.","Estás ante el fruto del trabajo; cuida de no dispersarte."],["Una propuesta inesperada; sopésala con paciencia.","Una sociedad o un cambio de equipo te ayuda.","Reconocimiento y estabilidad: trabajaste sobre buenos cimientos."]]},"SIGNS":[["🛤️","Camino","un movimiento, una partida o un cambio de lugar"],["✉️","Carta","una noticia, un mensaje, un papel por firmar"],["🚶","Forastero","un rostro nuevo entra en tu historia"],["🪙","Moneda","una ganancia o un gasto con sentido"],["🏠","Casa","una decisión o un cambio relacionado con la vivienda"],["❤️","Corazón","un sentimiento verdadero pide ser escuchado"],["👁️","Ojo","alguien te mira; presta atención a lo que dices y a quién se lo dices"],["💧","Lágrima","llega un alivio tras una opresión"],["🔒","Candado","un obstáculo o algo que debe dejarse esperar"],["🗝️","Llave","una solución está más cerca de lo que crees"],["⭐","Estrella","suerte y guía"],["🕊️","Pájaro","buenas noticias y sosiego"]],"PEB":["Piedra en el pasado: un peso antiguo que todavía aprieta; perdona y deja que caiga.","Piedra en el presente: un tropiezo del momento; rodéala, no la golpees con el pie.","Piedra en el futuro: una prueba que te fortalecerá, si la recibes con paciencia."],"VERD":{"1,1,3":"La corona llega tras dos frijoles solitarios: después de la paciencia y la soledad, un cumplimiento.","1,2,2":"Pareja sobre pareja: apoyo y entendimiento; no te quedes solo en tus decisiones.","2,3,3":"Abundancia doble: los dones son grandes; llévalos con humildad y compártelos."},"ADV":["Lo escrito en los frijoles se muestra, pero lo que hay que hacer, lo haces tú.","Los pasos pequeños, dados de buena fe, llegan lejos.","La buena palabra abre más puertas que la llave.","No busques la calma afuera; primero se asienta por dentro.","Sé agradecido por lo que tienes, y vendrá más.","Mide tres veces, decide una.","Quien siembra con paciencia cosecha con alegría.","Con agua clara se lava también el pensamiento.","Lo que hoy no puedes cambiar, déjalo que se asiente hasta mañana.","No hagas a otro lo que no quisieras para ti.","La mañana es más sabia que la noche.","El consejo de los frijoles es un espejo: mira y decide tú."],"DESC":{"deochi":{"t":"Ensalmo contra el mal de ojo (De deochi)","cand":"Por la mañana, antes de la salida del sol; tradicionalmente en martes o jueves.","mat":["agua virgen (aún sin usar) en un vaso o un cuenco","tres granos de sal","un hilo rojo (opcional)"],"pas":["Ponte de cara al amanecer y coloca el agua delante de ti.","Sostén la palma sobre el agua y di el ensalmo tres veces, soplando suavemente sobre el agua al terminar cada una.","Toca tu frente con un dedo húmedo. El agua no se bebe.","Vierte el agua al pie de un árbol o sobre la tierra, sin mirar atrás."],"txt":"Mal de ojo, ojeadura,\nsal de los ojos, de las pestañas, de las cejas,\nde la frente, de las sienes, del alma.\nSi vienes de ojos negros, vete a la tierra negra;\nsi vienes de ojos azules, vete al agua azul;\nsi vienes de ojos verdes, vete a la hierba verde;\nsi vienes de ojos castaños, vete a la madera vieja.\nYo te suelto, tú me sueltas,\nyo con bien, tú con paz.\nComo se va el rocío con el sol,\nasí te vayas tú de mí,\ny que quede la frente limpia,\nel ojo claro, el corazón ligero.\nMi palabra, candado;\nel agua, llave.\n¡Así sea!","nota":"El ensalmo es una costumbre popular de sosiego; si tienes un malestar real (dolor de cabeza, fiebre), acude al médico."},"frica":{"t":"Ensalmo contra el miedo (De frică)","cand":"Por la noche, cuando la casa se ha aquietado.","mat":["una vela pequeña (vigila la llama)","un vaso de agua"],"pas":["Siéntate erguido, con los pies en el suelo.","Respira hondo tres veces.","Di el ensalmo despacio, mirando la llama.","Apaga la vela con cuidado y bebe unos sorbos de agua."],"txt":"Miedo, miedecillo,\nsi saliste de la noche, vuelve a la noche;\nsi saliste de la sombra, vuelve a la sombra;\nsi saliste del ruido, vuelve al silencio.\nMi corazón no es mesa para ti,\nque su casa es de luz.\nComo se va la niebla del cerro\ncuando sale el sol,\nasí se vaya el miedo de mí,\ny que queden la paz,\nel aliento largo,\nel paso firme.\nMi palabra, luz;\nmi aliento, cadena.\n¡Así sea!","nota":"Si el miedo o la inquietud te acompañan desde hace muchos días, habla con una persona cercana o con un especialista."},"somn":{"t":"Ensalmo para el sueño, canción de cuna (De somn)","cand":"Por la noche, a la hora de acostarse.","mat":["una almohada blanda","una luz tenue"],"pas":["Acomoda al niño (o acomódate tú) con comodidad.","Dilo bajito, al ritmo de una cuna, tres veces.","Termina con una caricia en la frente."],"txt":"Ven, sueño, desde el bosque,\ncon pasos suaves de hierba gris,\ncon plantas de nieblas mansas.\nVen, sueño, a la pestaña,\ncomo la mariposa a la flor.\nCórtale la pena como al pan,\nregálale un sueño con estrellas,\nun sueño largo como toda la noche\ny un amanecer con sol.\nYo estoy junto a ti,\nla luna está en la ventana,\nel ángel está a la cabecera.\nDuerme, duerme, duerme,\nel buen sueño rehace el día.","nota":""},"dor":{"t":"Ensalmo contra la añoranza (De dor)","cand":"Al atardecer, junto a la ventana.","mat":["una ventana entreabierta","un vaso de agua"],"pas":["Piensa con ternura en la persona que añoras.","Di el ensalmo hacia la ventana.","Bebe el agua y deja que la añoranza se asiente."],"txt":"Añoranza, añoranza,\nno ardas más en la ventana,\nno golpees el cristal al anochecer.\nVete, añoranza, adonde está el que añoras,\nllévale noticia de que lo pienso,\nque guardo para él bien en el alma,\nque lo llevo con cariño y con paz.\nY cuando hayas contado tu pena,\nvuelve con suavidad,\ncomo la hoja sobre el agua,\ncomo el humo en el viento,\ny déjame el corazón\nclaro como un lago.\n¡Así sea!","nota":"El ensalmo envía bien, no ata ni llama a nadie a la fuerza."},"spor":{"t":"Ensalmo de prosperidad para la casa y la mesa (De spor la casă și la masă)","cand":"Con luna creciente, por la mañana.","mat":["una rebanada de pan","un puñado de trigo","un poco de sal","una moneda"],"pas":["Coloca sobre la mesa el pan, el trigo, la sal y la moneda.","Di el ensalmo tres veces sobre ellos.","Guarda la moneda en la cartera, comparte el pan con alguien y deja el trigo para los pájaros."],"txt":"Prosperidad, prosperidad,\nllama a mi puerta:\nen la mesa con pan,\nen la casa con paz,\nen la bolsa con moneda,\nen la mano con salud.\nLo poco que crezca,\nlo mucho que se reparta,\nlo vacío que se llene,\nlo lleno que se guarde.\nComo crece la masa en la artesa,\ncomo crece la hierba tras la lluvia,\nasí crezca la prosperidad en mi casa,\nno de lágrimas ajenas,\nsino de trabajo y de bien.\n¡Así sea!","nota":"La prosperidad viene del trabajo; el ensalmo es una plegaria de esperanza, no una garantía económica."},"drum":{"t":"Ensalmo para un buen viaje (De drum bun)","cand":"Antes de partir.","mat":["un poco de sal en el bolsillo","un vaso de agua"],"pas":["Ponte en el umbral, de cara al camino.","Di el ensalmo una vez, despacio.","Bebe un sorbo de agua, guarda la sal en el bolsillo y parte sin volver atrás desde el umbral."],"txt":"Camino, camino,\nsenda abierta\npara mí y para los que van conmigo:\nsin piedra en el pie,\nsin sombra en el pensamiento,\nsin malos encuentros.\nEl sol en la frente,\nla luna a la espalda,\nbienvenida a la llegada,\nbienvenida al regreso.\nComo el agua se va valle abajo,\nasí nos lleve el camino,\nligero y con bien.\n¡Así sea!","nota":""},"impacare":{"t":"Ensalmo de reconciliación (De împăcare)","cand":"Por la noche, cuando la llamarada ya se ha calmado.","mat":["dos vasos de agua","un trozo de pan"],"pas":["Pon los dos vasos uno junto al otro.","Di el ensalmo sobre ellos.","Si se puede, bebe agua del vaso junto con la otra persona; si no, bebe tú y deja el otro vaso sobre la mesa hasta la mañana."],"txt":"Palabra suave, palabra encendida,\ntoma tu fuego y apágate en el agua.\nPalabra áspera, palabra seca,\nablándate en leche tibia.\nLo que dije con prisa,\nque se deshaga en paciencia;\nlo que oí con disgusto,\nque se asiente en perdón.\nNo para que gane yo,\nno para que ganes tú,\nsino para que gane la casa.\nDos nos sentamos a la mesa\ny un pan partimos.\n¡Así sea!","nota":"El ensalmo no sustituye a una conversación sincera y verdadera; abre el camino hacia ella."},"ursita":{"t":"Ensalmo del destino, amor justo (De ursită)","cand":"Con luna nueva, por la noche.","mat":["un hilo rojo o de lana","una vela pequeña"],"pas":["Ata el hilo suelto alrededor del dedo meñique de la mano izquierda, sin apretarlo.","Di el ensalmo tres veces.","Guarda el hilo en un lugar elegido, como recuerdo de tu decisión de permanecer abierto."],"txt":"Hadas del destino, hilanderas,\nque me escribisteis al nacer\ncon hilo de oro, con hilo de lana,\nno os pido que atéis a nadie,\nni que mováis corazones de su sitio.\nOs pido que me preparéis:\ncon el corazón abierto,\ncon los ojos claros,\ncon la palabra derecha.\nQuien me esté dado para bien\nque venga por el camino del bien,\ny que yo sea bueno para esa persona.\nY si no es ahora,\nque me encuentre la paciencia\ny me sostenga en la luz.\n¡Así sea!","nota":"Este ensalmo no pretende influir en la voluntad de otra persona."},"luna":{"t":"Ensalmo de buena suerte con luna nueva (De noroc la lună nouă)","cand":"La primera noche en que se ve la luna nueva.","mat":["una moneda pequeña (opcional)"],"pas":["Mira la luna desde un lugar abierto.","Di el ensalmo una sola vez, con la mano en el corazón.","Da las gracias en silencio y entra en casa."],"txt":"Luna nueva, luna joven,\nyo te vi primero,\nla suerte tráeme primero.\nComo el cielo te hace de hilo de plata,\nasí me hagas el sendero.\nLo bueno que crezca conmigo contigo,\nlo pesado que se achique.\nQue mi gratitud\nesté en tu cielo, con paz,\nhasta que te llenes.\n¡Así sea!","nota":""},"cap":{"t":"Ensalmo para la cabeza cargada, pensamientos pesados (De cap încărcat)","cand":"Por la mañana, a la luz del día.","mat":["un vaso de agua limpia"],"pas":["Ponte junto a la ventana o al aire libre.","Pon la mano en la frente y di el ensalmo en voz baja.","Bebe el agua en tres sorbos."],"txt":"Pensamiento pesado, pensamiento negro,\nno hagas nido en mi cabeza.\nYo te acogí, te escuché,\nahora te suelto.\nVete al agua que corre,\nvete al viento de la mañana.\nMi cabeza, vasija limpia,\nclara como el manantial,\nligera como la pluma.\nQue quepan los buenos pensamientos,\nque se cuelen los malos.\n¡Así sea!","nota":"Es una costumbre de sosiego, no un tratamiento. Si el dolor de cabeza persiste o viene con otros signos, acude al médico."},"thx":{"t":"Ensalmo de gratitud a la mesa (De mulțumire)","cand":"Antes de comer o por la noche.","mat":["pan y agua"],"pas":["Siéntate a la mesa, toma el pan en la mano.","Di el agradecimiento.","Parte el pan y compártelo."],"txt":"Gracias al pan que brotó,\na las manos que amasaron,\na la tierra que lo llevó,\nal sol que lo coció,\nal agua que lo dio.\nQue mi mesa sea bendecida,\nmi casa llena de paz.\nQue tenga qué dar al hambriento,\nqué tomar si me falta\ny corazón para dar gracias siempre.","nota":""},"casa":{"t":"Ensalmo de la noche para la casa (De seară pentru casă)","cand":"Por la noche, antes de acostarse.","mat":["un poco de sal","una ramita de albahaca (u otra planta aromática)"],"pas":["Esparce una pizca de sal en el umbral de la puerta.","Pon la albahaca en un rincón de la habitación.","Di el ensalmo en medio de la casa."],"txt":"En el umbral con sal,\nen la ventana con luz,\nen el rincón con albahaca,\nen el centro con paz.\nLo que entre con bien\nque se sacie;\nlo que entre con mal\nque se vuelva desde el umbral.\nMi casa, casa de luz.\nBuen sueño a los de dentro,\nbuen camino a los de fuera.","nota":""}},"ELEM":{"water":["Agua que corre, agua virgen,","Agua clara, agua de manantial,"],"fire":["Fuego de luz, fuego de esperanza,","Llama pequeña, llama suave,"],"earth":["Tierra bajo los pies, tierra que alimenta,","Tierra tibia, tierra buena,"],"wind":["Viento de la mañana, viento ligero,","Soplo de aire, soplo limpio,"],"salt":["Sal del salar, sal de la tierra,","Sal limpia, sal de protección,"],"thread":["Hilo rojo, hilo de vida,","Hilo fino, hilo que une con el bien,"]},"CORE":{"prot":["Guarda la casa, el camino y el pensamiento de la mala mirada,","Guarda de la palabra mala y del paso en falso,","Deja que solo el bien cruce el umbral,","Pon luz alrededor, como un muro de luz,"],"calm":["Aleja el miedo y la preocupación del pecho,","Haz largo el aliento y ligero el corazón,","Pon en la mente claridad como en el manantial,","Da buen sueño y un día tranquilo,"],"fam":["Reúne al linaje en una mesa de paz,","Desata el enojo, trae la palabra suave,","Pon perdón entre los cercanos,","Mantén la casa cálida y la puerta abierta,"],"love":["Prepara el corazón para un amor justo,","Haz claros los ojos y honesta la palabra,","Da paciencia hasta la hora buena,","Que no ate a nadie por la fuerza, sino que alumbre el camino,"],"spor":["Da prosperidad a la casa y a la mesa,","Da fruto al trabajo y justa recompensa,","Lo poco que crezca, lo mucho que se reparta,","Pon abundancia en la mano que da,"],"road":["Abre el camino y guarda el pie de la piedra,","Pon sol en la frente y paz a la espalda,","Lleva a la meta con bien y de vuelta con ganancia,","Da buenos compañeros en el camino,"],"thx":["Gracias por el pan y por el agua,","Gracias por la casa y por los seres queridos,","Gracias por el día de hoy y por el de mañana,","Gracias por la luz que nos sostiene,"]},"IMG":["Como se va el rocío con el sol,\nasí se vaya todo lo que sobra.","Como corre el manantial valle abajo,\nasí corra el bien hacia la casa.","Como se posa la hoja sobre el agua,\nasí se asiente la paz.","Como sale el sol tras la noche,\nasí salga la claridad.","Como madura el trigo bajo el sol,\nasí madure el buen tiempo.","Como el pájaro encuentra su nido,\nasí encuentre la persona su sosiego."],"SEAL":"Mi palabra, candado;\nmi aliento, llave.\n¡Así sea, tres veces!","GEN_FOR":"Para {n}, con bien.","ROWT":[["Cabeza cargada: gran preocupación, decisiones aplazadas; espera a que se aclare.","Los pensamientos se enredan; no decidas con prisa.","La mente está más bien serena; una pequeña duda pide paciencia.","Pensamientos claros y deseos con el camino abierto; lo que tienes en mente puede cumplirse."],["Corazón pesado: disgusto o lágrimas; protege tu sosiego y tu descanso.","Emociones enredadas; necesitas una palabra sincera en casa.","Los sentimientos son más bien buenos; un pequeño disgusto se calmará.","El corazón está en paz: amor, casa y salud van bien."],["Camino cerrado por ahora: aplaza las partidas y los grandes negocios.","Camino con obstáculos o gastos; prepárate con cuentas claras.","El camino avanza, con alguna demora.","Caminos abiertos y dinero con suerte; huéspedes bienvenidos."]],"CELLN":["limpio","demora","suerte plena","peso"],"SP":{"cump":"La gran encrucijada (cumpăna mare): el primer montón de arriba (izquierda) y el último de abajo (derecha) son pares: tienes un obstáculo que superar; hazlo con pasos pequeños.","drum":"El camino abierto (drumul deschis): la fila de abajo tiene solo números impares: cualquier camino o plan que empieces ahora tiene éxito.","linie":"La línea afortunada (linia norocoasă): una línea entera de 3 frijoles cada uno: el deseo se cumple pronto y sin obstáculos."},"OLT":{"title":"Oltenia","casa4":"En la casa (casilla 5): exactamente 4 frijoles: casa llena (casă plină), abundancia y contento; el deseo se cumple muy pronto.","casa_1":"En la casa (casilla 5): {n} frijol.","casa_n":"En la casa (casilla 5): {n} frijoles.","sum5":"La fila de arriba suma 5: respuesta positiva, que ocurrirá con prisa.","sum9":"La fila de arriba suma 9: respuesta positiva, más tarde pero segura.","sumN":"La fila de arriba suma {n}: sin señal especial.","bob_sus":"Frijol solitario arriba: noticia en vano, sin importancia.","colac_cap":"Corona en la cabeza (colac în cap): gran alegría.","sositor_strict":"Frijol que llega (bob sositor), 1 frijol abajo a la derecha: llega dinero o una noticia muy esperada, alguien querido de un largo viaje.","sositor_wide":"Frijol que llega (bob sositor), variante amplia (1 frijol en la fila de abajo, no a la derecha): alguien querido vuelve de un largo viaje o llega dinero a la casa.","prag_strict":"Corona en el umbral (colac în prag), 3 frijoles abajo en el centro: boda, fiesta, huéspedes queridos.","prag_wide":"Corona en el umbral (colac în prag), variante amplia (3 frijoles en la fila de abajo, no en el centro): huéspedes o una fiesta.","doua":"Dos frijoles: duda, encrucijada o una noticia que encoge el corazón.","linie":"Línea de 2 o 3 frijoles colocados consecutivamente: largo camino, más allá de las fronteras o fuera del condado.","desc_lbl":"Ensalmo de destino (variante local; las fórmulas cambian de una aldea a otra):","short_lbl":"Variante corta:","desc":"Vosotros, 41 frijoles,\nComo sabéis brotar,\nTodas las praderas reverdecer,\nTodo el mundo alimentar,\nAsí sabed la suerte de [nombre de la persona]...\nSi es de bien, dad en seis (o en nueve),\n¡Al corazón dos, que se vea bien!","desc2":"Como alimentáis al mundo,\nasí mostradme la verdad\nsobre [nombre de la persona / la pregunta]."},"YN":["Respuesta de los frijoles: SÍ, los frijoles están de tu parte.","Más bien sí, con un poco de paciencia.","Más bien no ahora; espera una hora mejor.","NO por ahora; deja que las cosas se asienten."],"GUIDE":"🫘 PREPARACIÓN\n1. Toma en el puño exactamente 41 granos de frijol blanco (o de maíz).\n2. Sopla sobre ellos 3 veces y di: «Como alimentáis al mundo, así mostradme la verdad sobre [tu pregunta]».\n\n📐 REPARTO (de 4 en 4)\nLos granos se disponen en una matriz de 3 filas × 3 montones.\n• Fila 1 (ARRIBA — el Pensamiento): del montón grande se sacan de 4 en 4; lo que sobra (1, 2, 3 o 4 granos) es el primer montón, a la izquierda. Repite con los granos contados para el montón del medio, y luego para el de la derecha.\n• Fila 2 (MEDIO — el Corazón): reúne los granos que quedan y repite para los 3 montones del medio.\n• Fila 3 (ABAJO — el Camino): repite para los últimos 3 montones.\nLos granos que sobran al final se apartan.\nEn la aplicación: en lugar de este «sacar del montón», se corta la hilera de 41 granos en 9 montones (ocho cortes) y de cada uno se sacan de 4 en 4; el resto de 1 a 4 entra en la matriz. Así cada lectura sale distinta.\n\n🔮 LECTURA RÁPIDA\n• 1 o 3 granos (impar): buena señal, alegría, éxito — SÍ.\n• 2 o 4 granos (par): encrucijada, demora, disgusto — NO.\n\n🌟 LAS GRANDES SEÑALES\n• 4 granos en el centro: «Casa llena (casă plină)» (suerte, dinero, abundancia).\n• 3 granos abajo en el centro: «Corona en el umbral (colac în prag)» (boda, fiesta, huéspedes queridos).\n• 1 grano abajo a la derecha: «Frijol que llega (bob sositor)» (llega dinero o una noticia muy esperada).\n• Par arriba a la izquierda y abajo a la derecha: «La gran encrucijada (cumpăna mare)».\n• Fila de abajo solo impar: «El camino abierto (drumul deschis)».\n• Una línea de 3 granos cada uno: «La línea afortunada (linia norocoasă)».\nEn Oltenia, añade: 3 granos en la fila de arriba = «corona en la cabeza (colac în cap)»; la fila de arriba suma 5 (con prisa) o 9 (más tarde, pero seguro); no consultes los frijoles dos veces el mismo día por la misma pregunta."},"pt":{"READ":{"g":[["Carregaste muito a sós; um cuidado antigo ainda tem lugar no teu coração.","Alguém esteve ao teu lado e tu ainda lhe guardas o bem.","Um ciclo fechou-se atrás de ti; o que havia de se cumprir cumpriu-se."],["Estás numa encruzilhada do pensamento; espera um sinal, não apresses o passo.","Duas coisas pesam agora: escuta tanto o coração como a razão.","Estás à mesa da fartura: tens mais do que pensas, conta com gratidão."],["Chega uma notícia pequena, mas que muda a direção.","Aproxima-se um encontro ou um bom entendimento.","Algo amadurece e vai cumprir-se; a paciência será recompensada."]],"d":[["Um amor inacabado ainda te anda pelas memórias.","Foi uma boa ligação, com raízes que ainda se sentem.","Uma história terminou bem; deixa-a cumprir o seu destino."],["O coração está só, mas não vazio; prepara-se para algo.","Dois aproximam-se: ou tu e alguém, ou tu e ti próprio.","O coração está cheio; cuida de não pedir mais do que se pode dar."],["Um sentimento novo mostra-se sem se fazer notar.","Um encontro de almas ou uma reconciliação está próximo.","Prepara-se uma ligação que cria raízes, com pensamento e com obra."]],"b":[["Um começo frágil ensinou-te a poupar.","Um ganho chegou com a ajuda de alguém.","Uma fartura de outrora ensinou-te o preço das coisas."],["A bolsa está leve, mas o juízo pesa; faz bem as contas.","As entradas e as saídas equilibram-se; evita empréstimos.","Aumento em casa; reparte-o com medida."],["Não te apresses em negócios novos; abre bem os olhos.","Um ganho chega por dois caminhos; atenção a uma parceria.","Colhe-se o fruto do trabalho; o que semeias agora dará colheita."]],"c":[["Uma partida feita à pressa; ainda tens algo por esclarecer para trás.","Uma viagem feita com bom companheiro correu a preceito.","Uma longa viagem terminou bem."],["Ainda não é hora de partir; prepara a bagagem.","Abrem-se dois caminhos; escolhe o que te der sossego.","O caminho está aberto; leva contigo um pouco de sal e muita paciência."],["Uma viagem curta ou uma notícia trazida de longe.","Uma viagem acompanhada, que leva a um encontro importante.","Uma grande viagem, abençoada, com regresso carregado de ganhos."]],"a":[["Um silêncio antigo da casa ainda não se desfez.","Alguém da família protegeu-te; guarda a sua memória com honra.","A grande mesa da família ficou na lembrança; conserva o costume."],["As pequenas preocupações da casa precisam de uma palavra boa.","Duas pessoas da casa têm de se entender; escuta mais do que falas.","A casa está cheia de sentido; agradece o que tens."],["Uma notícia bate ao portão, vinda de parentes ou de amigos.","Uma reconciliação na família ou uma visita querida.","Festa ou alegria à mesa grande."]],"m":[["Trabalhaste sozinho e a tua fadiga não se viu.","Um colega ou um mentor foi-te amparo.","Uma obra levada até ao fim dá-te agora peso."],["Mais um passo pequeno e o resultado aparece; não pares.","Pede-se colaboração; reparte a tarefa.","Estás no fruto do trabalho; cuida de não te dispersares."],["Uma proposta inesperada; pesa-a com paciência.","Uma parceria ou uma mudança de equipa ajuda-te.","Reconhecimento e estabilidade: trabalhaste sobre alicerces."]]},"SIGNS":[["🛤️","Caminho","um movimento, uma partida ou uma mudança de lugar"],["✉️","Carta","uma notícia, uma mensagem, um papel para assinar"],["🚶","Desconhecido","um rosto novo entra na tua história"],["🪙","Dinheiro","um ganho ou uma despesa com sentido"],["🏠","Casa","uma decisão ou uma mudança ligada à habitação"],["❤️","Coração","um sentimento verdadeiro pede escuta"],["👁️","Olho","alguém te observa; atenção ao que dizes e a quem o dizes"],["💧","Lágrima","o alívio chega depois de um peso"],["🔒","Cadeado","um obstáculo ou algo que deve ficar a esperar"],["🗝️","Chave","uma solução está mais perto do que pensas"],["⭐","Estrela","sorte e guia"],["🕊️","Pássaro","boa notícia e sossego"]],"PEB":["Pedra no passado: um peso antigo que ainda pesa; perdoa e deixa-o cair.","Pedra no presente: um obstáculo do momento; contorna-o, não lhe dês pontapés.","Pedra no futuro: uma prova que te fortalecerá, se a receberes com paciência."],"VERD":{"1,1,3":"A coroa vem depois de dois feijões sós: depois da paciência e da solidão, um cumprimento.","1,2,2":"Par sobre par: apoio e entendimento; não fiques só nas decisões.","2,3,3":"Fartura em dobro: as dádivas são grandes; carrega-as com humildade e reparte-as."},"ADV":["O que está escrito mostra-se nos feijões, mas o que há a fazer, fazes tu.","Passos pequenos, dados de boa-fé, chegam longe.","A palavra boa abre mais portas do que a chave.","Não procures o sossego lá fora; ele assenta primeiro cá dentro.","Sê grato pelo que tens, e virá mais.","Mede três vezes, decide uma só.","Quem semeia com paciência colhe com alegria.","Com água límpida também se lava o pensamento.","O que não podes mudar hoje, deixa-o assentar até amanhã.","Não faças a outro o que não quererias para ti.","A manhã é mais sábia do que a noite.","O conselho dos feijões é um espelho: olha e decide tu."],"DESC":{"deochi":{"t":"Benzedura contra o mau-olhado (De deochi)","cand":"De manhã, antes do nascer do sol; tradicionalmente à terça ou à quinta-feira.","mat":["água ainda por tocar, num copo ou numa tigela","três grãos de sal","um fio vermelho (opcional)"],"pas":["Fica de frente para o nascente e põe a água diante de ti.","Mantém a palma da mão sobre a água e diz o encantamento três vezes, soprando de leve sobre a água no fim de cada uma.","Toca na testa com um dedo molhado. A água não se bebe.","Deita a água ao pé de uma árvore ou na terra, sem olhares para trás."],"txt":"Mau-olhado, olhado mau,\nsai dos olhos, das pestanas, das sobrancelhas,\nda testa, das têmporas, da alma.\nSe vens de olhos negros, vai para a terra negra;\nse vens de olhos azuis, vai para a água azul;\nse vens de olhos verdes, vai para a erva verde;\nse vens de olhos castanhos, vai para a lenha velha.\nEu deixo-te, tu deixas-me,\neu com bem, tu com paz.\nComo o orvalho se vai com o sol,\nassim te vás tu de mim,\ne fiquem testa limpa,\nolhar claro, coração leve.\nA minha palavra — cadeado,\na água — chave.\nAssim seja!","nota":"A benzedura é um costume popular de acalmação; se tens um sofrimento real (dor de cabeça, febre), consulta um médico."},"frica":{"t":"Benzedura contra o medo (De frică)","cand":"À noite, quando a casa sossegou.","mat":["uma vela pequena (vigia a chama)","um copo de água"],"pas":["Senta-te direito, com os pés no chão.","Respira fundo três vezes.","Diz o encantamento devagar, olhando para a chama.","Apaga a vela com cuidado e bebe alguns goles de água."],"txt":"Medo, medozinho,\nse saíste da noite, volta à noite;\nse saíste da sombra, volta à sombra;\nse saíste do barulho, volta ao silêncio.\nO meu coração não é mesa para ti,\nque a sua casa é de luz.\nComo a névoa sai do monte\nquando nasce o sol,\nassim saia de mim o medo,\ne fiquem paz,\nrespiração longa,\npé seguro.\nA minha palavra — luz,\no meu fôlego — corrente.\nAssim seja!","nota":"Se o medo ou a inquietação te acompanham há muitos dias, fala com alguém próximo ou com um profissional."},"somn":{"t":"Benzedura do sono (cantiga de embalar) (De somn)","cand":"À noite, à hora de deitar.","mat":["uma almofada macia","uma luz fraca"],"pas":["Acomoda a criança (ou a ti próprio) confortavelmente.","Diz devagar, ao ritmo de embalo, três vezes.","Termina com uma festa na testa."],"txt":"Vem, sono, da floresta,\ncom passos moles de erva cinzenta,\ncom pés de neblinas mansas.\nVem, sono, à pestana,\ncomo a borboleta à flor.\nCorta-lhe a mágoa como pão,\ndá-lhe de presente um sonho de estrelas,\num sonho longo como toda a noite\ne uma alvorada com sol.\nEu fico ao teu lado,\na lua fica à janela,\no anjo fica à cabeceira.\nDorme, dorme, dorme,\no bom sono renova o dia.","nota":""},"dor":{"t":"Benzedura da saudade (De dor)","cand":"Ao anoitecer, à janela.","mat":["uma janela entreaberta","um copo de água"],"pas":["Pensa com ternura na pessoa de quem tens saudade.","Diz o encantamento em direção à janela.","Bebe a água e deixa a saudade assentar."],"txt":"Saudade, saudade,\nnão ardas mais à janela,\nnão batas ao vidro ao serão.\nVai, saudade, aonde está a saudade,\ndiz-lhe que penso nele,\nque lhe guardo bem na alma,\nque o levo com carinho e paz.\nE quando tiveres dito o teu pesar,\nvolta de mansinho,\ncomo a folha na água,\ncomo o fumo no vento,\ne deixa-me o coração\nlimpo como o lago.\nAssim seja!","nota":"A benzedura envia bem, não prende nem chama ninguém à força."},"spor":{"t":"Benzedura de fartura para a casa e a mesa (De spor la casă și la masă)","cand":"Em lua crescente, de manhã.","mat":["uma fatia de pão","um punhado de trigo","um pouco de sal","uma moeda"],"pas":["Põe sobre a mesa o pão, o trigo, o sal e a moeda.","Diz o encantamento três vezes sobre eles.","Guarda a moeda na carteira, reparte o pão com alguém e deixa o trigo às aves."],"txt":"Fartura, fartura,\nbate à minha porta:\nna mesa com pão,\nna casa com paz,\nna bolsa com tostão,\nna mão com saúde.\nO que é pouco que cresça,\no que é muito que se reparta,\no que está vazio que se encha,\no que está cheio que se guarde.\nComo cresce a massa na masseira,\ncomo cresce a erva depois da chuva,\nassim cresça a fartura em minha casa,\nnão de lágrimas alheias,\nmas de trabalho e de bem.\nAssim seja!","nota":"A fartura vem do trabalho; a benzedura é uma prece de esperança, não uma garantia financeira."},"drum":{"t":"Benzedura de boa viagem (De drum bun)","cand":"Antes de partir.","mat":["um pouco de sal no bolso","um copo de água"],"pas":["Fica no limiar, de frente para o caminho.","Diz o encantamento uma vez, devagar.","Bebe um gole de água, guarda o sal no bolso e parte sem te voltares do limiar."],"txt":"Caminho, caminho,\nestrada aberta\npara mim e para quem vai comigo:\nsem pedra no pé,\nsem sombra no pensamento,\nsem maus encontros.\nO sol na fronte,\na lua nas costas,\nbem-vindo à chegada,\nbem-vindo ao regresso.\nComo a água corre para o vale,\nassim nos leve o caminho,\nleve e com bem.\nAssim seja!","nota":""},"impacare":{"t":"Benzedura de reconciliação (De împăcare)","cand":"À noite, depois de a labareda se ter acalmado.","mat":["dois copos de água","um pedaço de pão"],"pas":["Põe os dois copos lado a lado.","Diz o encantamento sobre eles.","Se for possível, bebe água do copo juntamente com a outra pessoa; se não, bebe tu e deixa o outro copo na mesa até de manhã."],"txt":"Palavra mansa, palavra acesa,\ntoma o teu lume e apaga-te na água.\nPalavra áspera, palavra seca,\namolece no leite quente.\nO que disse à pressa,\nse desfaça em paciência;\no que ouvi na zanga,\nse assente em perdão.\nNão para ganhar eu,\nnão para ganhares tu,\nmas para ganhar a casa.\nDois sentamo-nos à mesa\ne um pão partimos.\nAssim seja!","nota":"A benzedura não substitui a conversa sincera e verdadeira; abre o caminho até ela."},"ursita":{"t":"Benzedura do destino (amor justo) (De ursită)","cand":"Em lua nova, à noite.","mat":["um fio vermelho ou de lã","uma vela pequena"],"pas":["Prende o fio solto à volta do dedo mindinho da mão esquerda, sem apertar.","Diz o encantamento três vezes.","Guarda o fio num lugar escolhido, como lembrança da decisão de permanecer aberto."],"txt":"Destino, fada do destino,\nque me escreveste ao nascer\ncom fio de ouro, com fio de lã,\nnão te peço que prendas ninguém,\nnem que movas corações do lugar.\nPeço-te que me prepares:\ncom o coração aberto,\ncom olhos claros,\ncom palavra direita.\nQuem me é dado com bem\nque venha pelo caminho com bem,\ne eu, no dele, seja bom.\nE se não é agora,\nque me encontre a paciência\ne me mantenha na luz.\nAssim seja!","nota":"Esta benzedura não pretende influenciar a vontade de outra pessoa."},"luna":{"t":"Benzedura de sorte na lua nova (De noroc la lună nouă)","cand":"Na primeira noite em que se vê a lua nova.","mat":["uma moeda pequena (opcional)"],"pas":["Olha a lua de um lugar aberto.","Diz o encantamento uma só vez, com a mão no coração.","Agradece em pensamento e entra em casa."],"txt":"Lua nova, lua nova,\neu vi-te primeiro,\nsorte me tragas primeiro.\nComo o céu te faz de fio de prata,\nassim me faças o caminho.\nO que é bom cresça comigo contigo,\no que é pesado em mim diminua.\nSeja o meu agradecimento\nno teu céu, com paz,\naté te encheres.\nAssim seja!","nota":""},"cap":{"t":"Benzedura da cabeça carregada (pensamentos pesados) (De cap încărcat)","cand":"De manhã, à luz do dia.","mat":["um copo de água limpa"],"pas":["Fica à janela ou ao ar livre.","Põe a mão na testa e diz o encantamento devagar.","Bebe a água em três goles."],"txt":"Pensamento pesado, pensamento negro,\nnão fazes ninho na minha cabeça.\nEu recebi-te, escutei-te,\nagora deixo-te.\nVai para a água corrente,\nvai para o vento da manhã.\nA minha cabeça, vaso limpo,\nclara como a nascente,\nleve como a pluma.\nPensamentos bons que caibam,\npensamentos maus que se escoem.\nAssim seja!","nota":"É um costume de acalmação, não um tratamento. Se a dor de cabeça persistir ou vier acompanhada de outros sinais, consulta um médico."},"thx":{"t":"Benzedura de agradecimento (à mesa) (De mulțumire)","cand":"Antes da refeição ou à noite.","mat":["pão e água"],"pas":["Senta-te à mesa e toma o pão na mão.","Diz o agradecimento.","Parte o pão e reparte-o."],"txt":"Agradeço ao pão que germinou,\naos braços que amassaram,\nà terra que o sustentou,\nao sol que o coseu,\nà água que o deu.\nSeja a minha mesa abençoada,\na minha casa cheia de paz.\nTenha eu que dar ao faminto,\nque tomar se me faltar\ne coração para agradecer sempre.","nota":""},"casa":{"t":"Benzedura da noite para a casa (De seară pentru casă)","cand":"À noite, antes de dormir.","mat":["um pouco de sal","um ramo de manjericão (ou outra erva aromática)"],"pas":["Polvilha uma pitada de sal no limiar da porta.","Põe o manjericão num canto do quarto.","Diz o encantamento no meio da casa."],"txt":"No limiar com sal,\nna janela com luz,\nno canto com manjericão,\nno meio com paz.\nO que entra com bem\nque se regale;\no que entra com mal\nque volte do limiar.\nA minha casa, casa de luz.\nBom sono aos de dentro,\nboa estrada aos de fora.","nota":""}},"ELEM":{"water":["Água corrente, água ainda por tocar,","Água límpida, água de nascente,"],"fire":["Fogo de luz, fogo de esperança,","Chama pequena, chama mansa,"],"earth":["Terra debaixo dos pés, terra que alimenta,","Torrão morno, torrão bom,"],"wind":["Vento da manhã, vento leve,","Sopro de ar, sopro puro,"],"salt":["Sal do salgado, sal da terra,","Sal puro, sal de proteção,"],"thread":["Fio vermelho, fio de vida,","Fio fino, fio que liga ao bem,"]},"CORE":{"prot":["Guarda a casa, o caminho e o pensamento de olhar mau,","Guarda de palavra má e de passo errado,","Deixa só o bem passar o limiar,","Põe luz em redor, como um muro de luz,"],"calm":["Afasta o medo e a mágoa do peito,","Faz o fôlego longo e o coração leve,","Põe no pensamento clareza como na nascente,","Dá bom sono e dia sossegado,"],"fam":["Reúne a família numa mesa de paz,","Desfaz a zanga, traz a palavra mansa,","Põe perdão entre os que andam perto,","Mantém a casa quente e a porta aberta,"],"love":["Prepara o coração para um amor justo,","Faz os olhos claros e a palavra honesta,","Dá paciência até à hora boa,","Que não prenda ninguém à força, mas ilumine o caminho,"],"spor":["Dá fartura na casa e na mesa,","Dá fruto ao trabalho e paga honesta,","O que é pouco que cresça, o que é muito que se reparta,","Põe abundância na mão que oferece,"],"road":["Abre o caminho e guarda o pé da pedra,","Põe sol na fronte e paz atrás de nós,","Leva ao destino com bem e traz de volta com ganho,","Dá bons companheiros no caminho,"],"thx":["Agradecimento pelo pão e pela água,","Agradecimento pela casa e pelos queridos,","Agradecimento pelo dia de hoje e pelo de amanhã,","Agradecimento pela luz que nos sustém,"]},"IMG":["Como o orvalho se vai com o sol,\nassim se vá tudo o que sobra.","Como a nascente corre para o vale,\nassim corra o bem para casa.","Como a folha pousa na água,\nassim pouse a paz.","Como o sol nasce depois da noite,\nassim nasça a clareza.","Como o trigo amadurece ao sol,\nassim amadureça o tempo bom.","Como a ave encontra o seu ninho,\nassim encontre o homem o seu sossego."],"SEAL":"A minha palavra — cadeado,\no meu fôlego — chave.\nAssim seja, três vezes!","GEN_FOR":"Para {n}, com bem.","ROWT":[["Cabeça carregada: grande cuidado, decisões adiadas; espera que clareie.","Os pensamentos emaranham-se; não decidas à pressa.","A mente está mais serena; uma pequena dúvida pede paciência.","Pensamentos claros e desejos de caminho aberto; o que tens em mente pode cumprir-se."],["Coração pesado: mágoa ou lágrimas; protege o teu sossego e o teu descanso.","Emoções enredadas; precisas de uma palavra sincera em casa.","Os sentimentos são mais bons do que maus; uma pequena mágoa vai acalmar.","O coração está em paz: amor, casa e saúde vão bem."],["Caminho fechado por agora: adia partidas e grandes negócios.","Caminho com obstáculos ou despesas; prepara-te com contas feitas.","O caminho segue, com uma demora aqui e ali.","Caminhos abertos e dinheiro com sorte; visitas bem-vindas."]],"CELLN":["limpo","demora","sorte plena","peso"],"SP":{"cump":"A grande encruzilhada (cumpăna mare): o primeiro monte de cima (esquerda) e o último de baixo (direita) são pares — tens um obstáculo a transpor; fá-lo com passos pequenos.","drum":"O caminho aberto (drumul deschis): a fila de baixo tem só números ímpares — qualquer caminho ou plano iniciado agora tem êxito.","linie":"A linha da sorte (linia norocoasă): uma linha inteira de 3 feijões cada — o desejo cumpre-se depressa e sem obstáculos."},"OLT":{"title":"Olténia","casa4":"Em casa (Casinha 5): exatamente 4 feijões — casa cheia (casă plină), fartura e contentamento; o desejo cumpre-se muito depressa.","casa_1":"Em casa (Casinha 5): {n} feijão.","casa_n":"Em casa (Casinha 5): {n} feijões.","sum5":"A fila de cima soma 5: resposta positiva, que acontecerá depressa.","sum9":"A fila de cima soma 9: resposta positiva, mais tarde, mas certa.","sumN":"A fila de cima soma {n}: sem sinal especial.","bob_sus":"Feijão sozinho em cima: notícia em vão, sem importância.","colac_cap":"Coroa na cabeça (colac în cap): grande alegria.","sositor_strict":"Feijão que chega (bob sositor) (1 feijão em baixo à direita): vem dinheiro ou uma notícia muito esperada, alguém querido de longe.","sositor_wide":"Feijão que chega (bob sositor), variante larga (1 feijão na fila de baixo, não à direita): alguém querido vem de longe ou chega dinheiro a casa.","prag_strict":"Coroa à porta (colac în prag) (3 feijões em baixo ao centro): casamento, festa, visitas queridas.","prag_wide":"Coroa à porta (colac în prag), variante larga (3 feijões na fila de baixo, não ao centro): visitas ou uma festa.","doua":"Dois feijões: dúvida, encruzilhada ou uma notícia que aperta o coração.","linie":"Linha de 2 ou 3 feijões consecutivos: viagem longa, para lá das fronteiras ou fora do distrito.","desc_lbl":"Encantamento de destino (descântec de menire) (variante local; as fórmulas diferem de aldeia para aldeia):","short_lbl":"Variante curta:","desc":"Vós, 41 feijões,\nComo sabeis germinar,\nTodos os prados reverdecer,\nTodo o mundo alimentar,\nAssim saibais a sorte de [nome da pessoa]...\nSe for de bem, dai em seis (ou em nove),\nNo coração dois, que se veja bem!","desc2":"Como alimentais o mundo,\nassim me mostrai a verdade\nsobre [nome da pessoa / a pergunta]."},"YN":["Resposta dos feijões: SIM — os feijões estão do teu lado.","Antes sim, com um pouco de paciência.","Antes não agora; espera uma hora melhor.","NÃO por enquanto; deixa as coisas assentar."],"GUIDE":"🫘 PREPARAÇÃO\n1. Toma exatamente 41 grãos de feijão-branco (ou de milho) na mão.\n2. Sopra sobre eles 3 vezes e diz: “Como alimentais o mundo, assim me mostrai a verdade sobre [a tua pergunta]”.\n\n📐 A DIVISÃO (de 4 em 4)\nOs grãos dispõem-se numa matriz de 3 filas × 3 montes.\n• Fila 1 (CIMA — o Pensamento): do monte grande tiram-se 4 de cada vez; o que sobra (1, 2, 3 ou 4 grãos) é o primeiro monte, à esquerda. Repete com os grãos contados para o monte do meio e depois para o da direita.\n• Fila 2 (MEIO — o Coração): reúne os grãos que restam e repete para os 3 montes do meio.\n• Fila 3 (BAIXO — o Caminho): repete para os últimos 3 montes.\nOs grãos que sobrarem no fim põem-se de parte.\nNa aplicação: em vez deste “tirar do monte”, corta-se a fiada de 41 grãos em 9 montes (oito cortes) e de cada um tiram-se 4; o resto de 1 a 4 entra na matriz. Assim cada leitura sai diferente.\n\n🔮 LEITURA RÁPIDA\n• 1 ou 3 grãos (ímpar): bom sinal, alegria, êxito — SIM.\n• 2 ou 4 grãos (par): encruzilhada, demora, mágoa — NÃO.\n\n🌟 OS GRANDES SINAIS\n• 4 grãos ao centro: “Casa cheia (casă plină)” (sorte, dinheiro, fartura).\n• 3 grãos em baixo ao centro: “Coroa à porta (colac în prag)” (casamento, festa, visitas queridas).\n• 1 grão em baixo à direita: “Feijão que chega (bob sositor)” (vem dinheiro ou uma notícia muito esperada).\n• Par em cima à esquerda e em baixo à direita: “A grande encruzilhada (cumpăna mare)”.\n• Fila de baixo só ímpar: “O caminho aberto (drumul deschis)”.\n• Uma linha de 3 grãos cada: “A linha da sorte (linia norocoasă)”.\nNa Olténia, acrescenta: 3 grãos na fila de cima = “coroa na cabeça (colac în cap)”; a fila de cima soma 5 (à pressa) ou 9 (mais tarde, mas certo); não leias os feijões duas vezes no mesmo dia para a mesma pergunta."},"de":{"READ":{"g":[["Du hast lange allein getragen; eine alte Sorge hält noch einen Platz in deinem Herzen.","Jemand stand dir zur Seite, und du trägst ihm das Gute noch nach.","Ein Kreis hat sich hinter dir geschlossen; was sich erfüllen sollte, hat sich erfüllt."],["Du stehst am Scheideweg der Gedanken; warte auf ein Zeichen und überstürze keinen Schritt.","Zwei Dinge werden jetzt gewogen: Höre auf das Herz und auf die Rechnung.","Du sitzt am Tisch des Überflusses: Du hast mehr, als du denkst, zähle es mit Dankbarkeit."],["Eine kleine Nachricht kommt, die doch die Richtung ändert.","Eine Begegnung oder eine gute Übereinkunft rückt näher.","Eine Erfüllung reift heran; deine Geduld wird belohnt werden."]],"d":[["Eine unvollendete Liebe geht dir noch durch die Erinnerungen.","Es war eine gute Verbindung, deren Wurzeln du noch spürst.","Eine Geschichte ist schön zu Ende gegangen; lass sie ihren Sinn erfüllen."],["Das Herz ist allein, aber nicht leer; es bereitet sich auf etwas vor.","Zwei nähern sich: du und jemand anderes, oder du und du selbst.","Das Herz ist voll; achte darauf, nicht mehr zu verlangen, als gegeben werden kann."],["Ein neues Gefühl zeigt sich unmerklich.","Eine Begegnung der Seelen oder eine Versöhnung ist nah.","Eine Verbindung bereitet sich vor, die Wurzeln schlägt, mit Gedanken und mit Taten."]],"b":[["Ein wackliger Anfang hat dich Sparsamkeit gelehrt.","Ein Gewinn kam mit der Hilfe eines anderen.","Ein Überfluss von einst hat dich den Wert der Dinge gelehrt."],["Der Beutel ist leicht, aber die Besonnenheit wiegt schwer; führe Buch.","Einnahmen und Ausgaben halten sich die Waage; meide Schulden.","Segen im Haus; teile ihn mit Maß."],["Eile nicht in neue Geschäfte; halte die Augen gut offen.","Ein Gewinn kommt auf zwei Wegen; sei achtsam bei einer Partnerschaft.","Die Frucht der Arbeit wird eingebracht; was du jetzt säst, gibt Ernte."]],"c":[["Ein überstürzter Aufbruch; hinter dir ist noch etwas zu klären.","Ein Weg mit gutem Weggefährten war gut gewählt.","Ein langer Weg ist glücklich zu Ende gegangen."],["Es ist noch nicht die Stunde des Aufbruchs; richte dein Gepäck.","Zwei Wege öffnen sich; wähle den, der dir Frieden gibt.","Der Weg ist offen; nimm ein wenig Salz mit und viel Geduld."],["Eine kurze Reise oder eine Nachricht aus der Ferne.","Ein Weg mit Begleitung, der zu einer wichtigen Begegnung führt.","Ein großer, gesegneter Weg, mit Heimkehr voller Gewinn."]],"a":[["Ein altes Schweigen im Haus ist noch nicht getaut.","Jemand aus der Sippe hat dich beschützt; trag sein Andenken in Ehren.","Die große Familientafel ist dir in Erinnerung geblieben; bewahre den Brauch."],["Die kleinen Sorgen des Hauses brauchen ein gutes Wort.","Zwei im Haus müssen sich verständigen; höre mehr zu, als du sprichst.","Das Haus ist voller Sinn; danke für das, was du hast."],["Eine Nachricht klopft am Tor, von Verwandten oder von Freunden.","Eine Versöhnung in der Familie oder ein lieber Gast.","Fest oder Freude an der großen Tafel."]],"m":[["Du hast allein gearbeitet, und deine Mühe blieb unsichtbar.","Eine Kollegin oder ein Mentor war dir Stütze.","Ein zu Ende gebrachtes Werk gibt dir jetzt Gewicht."],["Noch ein kleiner Schritt, und das Ergebnis zeigt sich; halte nicht an.","Zusammenarbeit ist gefragt; teile die Aufgabe.","Du stehst bei der Frucht deiner Arbeit; achte darauf, dich nicht zu zersplittern."],["Ein unerwarteter Vorschlag; wäge ihn mit Geduld ab.","Eine Partnerschaft oder ein Teamwechsel hilft dir.","Anerkennung und Beständigkeit: Du hast auf festem Grund gearbeitet."]]},"SIGNS":[["🛤️","Weg","eine Bewegung, ein Aufbruch oder ein Ortswechsel"],["✉️","Brief","eine Nachricht, eine Botschaft, ein Papier zum Unterschreiben"],["🚶","Fremder","ein neues Gesicht tritt in deine Geschichte"],["🪙","Münze","ein Gewinn oder eine sinnvolle Ausgabe"],["🏠","Haus","ein Entschluss oder eine Veränderung rund um die Wohnung"],["❤️","Herz","ein wahres Gefühl will gehört werden"],["👁️","Auge","jemand schaut auf dich; achte darauf, was du sagst und zu wem"],["💧","Träne","Erleichterung kommt nach einer Last"],["🔒","Schloss","ein Hindernis oder etwas, das warten muss"],["🗝️","Schlüssel","eine Lösung ist näher, als du denkst"],["⭐","Stern","Glück und Führung"],["🕊️","Vogel","gute Nachricht und Ruhe"]],"PEB":["Stein in der Vergangenheit: eine alte Last, die noch drückt; vergib und lass sie fallen.","Stein in der Gegenwart: ein Hindernis des Augenblicks; geh darum herum, tritt nicht dagegen.","Stein in der Zukunft: eine Prüfung, die dich stärken wird, wenn du sie mit Geduld annimmst."],"VERD":{"1,1,3":"Der Kranz kommt nach zwei einsamen Bohnen: nach Geduld und Einsamkeit eine Erfüllung.","1,2,2":"Paar über Paar: Beistand und Verständnis; bleib bei deinen Entscheidungen nicht allein.","2,3,3":"Doppelter Überfluss: Die Gaben sind groß; trag sie mit Demut und teile sie."},"ADV":["Was geschrieben steht, zeigt sich in den Bohnen, aber was zu tun ist, tust du selbst.","Kleine Schritte, in gutem Glauben getan, tragen weit.","Ein gutes Wort öffnet mehr Türen als der Schlüssel.","Suche den Frieden nicht draußen; er stellt sich zuerst im Inneren ein.","Sei dankbar für das, was du hast, und es kommt mehr.","Miss dreimal, entscheide einmal.","Wer mit Geduld sät, erntet mit Freude.","Mit klarem Wasser wäscht man auch den Gedanken rein.","Was du heute nicht ändern kannst, lass bis morgen sich setzen.","Tu keinem anderen an, was du dir nicht wünschst.","Der Morgen ist klüger als der Abend.","Der Rat der Bohnen ist ein Spiegel: Schau hinein und entscheide selbst."],"DESC":{"deochi":{"t":"Spruch gegen den bösen Blick (De deochi)","cand":"Am Morgen vor Sonnenaufgang; traditionell dienstags oder donnerstags.","mat":["unberührtes Wasser in einem Glas oder einer Schale","drei Salzkörner","ein roter Faden (nach Belieben)"],"pas":["Stell dich mit dem Gesicht zum Sonnenaufgang und stell das Wasser vor dich hin.","Halte die Hand über das Wasser und sprich den Spruch dreimal, und am Ende jedes Mals hauche sanft über das Wasser.","Berühre deine Stirn mit einem feuchten Finger. Das Wasser wird nicht getrunken.","Gieß das Wasser an die Wurzel eines Baumes oder in die Erde, ohne dich umzusehen."],"txt":"Böser Blick, Blickesbann,\nfahr aus dem Auge, aus den Wimpern, aus den Brauen,\naus der Stirn, aus den Schläfen, aus der Seele.\nBist du von schwarzen Augen, geh in die schwarze Erde;\nbist du von blauen Augen, geh ins blaue Wasser;\nbist du von grünen Augen, geh ins grüne Gras;\nbist du von braunen Augen, geh ins alte Holz.\nIch lasse dich, du lässt mich,\nich in Gutem, du in Frieden.\nWie der Tau zur Sonne geht,\nso geh auch du aus mir,\nund bleiben soll die Stirn rein,\ndas Auge klar, das Herz leicht.\nMein Wort sei Schloss,\ndas Wasser Schlüssel.\nSo sei es!","nota":"Der Spruch ist ein überlieferter Beruhigungsbrauch; wenn du ein echtes Leiden hast (Kopfschmerzen, Fieber), geh zum Arzt."},"frica":{"t":"Spruch gegen die Angst (De frică)","cand":"Am Abend, wenn das Haus zur Ruhe gekommen ist.","mat":["eine kleine Kerze (behalte die Flamme im Auge)","ein Glas Wasser"],"pas":["Setz dich aufrecht hin, die Füße auf dem Boden.","Atme dreimal tief durch.","Sprich den Spruch leise und schau dabei in die Flamme.","Lösche die Kerze vorsichtig und trink ein paar Schlucke Wasser."],"txt":"Angst, Ängstchen,\nbist du aus der Nacht gekommen, geh in die Nacht;\nbist du aus dem Schatten gekommen, geh in den Schatten;\nbist du aus dem Lärm gekommen, geh in die Stille.\nMein Herz ist kein Tisch für dich,\ndenn sein Haus ist aus Licht.\nWie der Nebel vom Hügel weicht,\nwenn die Sonne aufgeht,\nso weiche die Angst aus mir,\nund bleiben soll Frieden,\nein langer Atem,\nein sicherer Fuß.\nMein Wort sei Licht,\nmein Atem Kette.\nSo sei es!","nota":"Wenn Angst oder Unruhe dich viele Tage begleiten, sprich mit einem vertrauten Menschen oder mit einer Fachperson."},"somn":{"t":"Spruch für den Schlaf (Wiegenlied) (De somn)","cand":"Am Abend, beim Schlafengehen.","mat":["ein weiches Kissen","ein schwaches Licht"],"pas":["Bette das Kind (oder dich selbst) bequem.","Sprich leise, im Rhythmus einer Wiege, dreimal.","Schließe mit einem Streicheln über die Stirn."],"txt":"Komm, Schlaf, aus dem Walde,\nmit weichen Schritten auf grauem Gras,\nauf Sohlen aus sanften Nebeln.\nKomm, Schlaf, auf die Wimper,\nwie der Falter auf die Blume.\nSchneid ihm die Sorge wie das Brot,\ngib ihm zum Geschenk einen Traum voller Sterne,\neinen Traum, lang wie die ganze Nacht,\nund einen Morgen mit Sonne.\nIch bleibe bei dir,\nder Mond steht am Fenster,\nder Engel steht am Kopfende.\nSchlaf, schlaf, schlaf,\nguter Schlaf erneuert den Tag.","nota":""},"dor":{"t":"Spruch gegen Sehnsucht (De dor)","cand":"In der Dämmerung, am Fenster.","mat":["ein leicht geöffnetes Fenster","ein Glas Wasser"],"pas":["Denke sanft an den Menschen, nach dem du dich sehnst.","Sprich den Spruch zum Fenster hin.","Trink das Wasser und lass die Sehnsucht sich setzen."],"txt":"Sehnsucht, du Sehnen,\nbrenn nicht mehr am Fenster,\nklopf nicht mehr an die Scheibe am Abend.\nGeh, Sehnsucht, dorthin, wo das Sehnen wohnt,\nsag ihm, dass ich an es denke,\ndass ich Gutes für es im Herzen habe,\ndass ich es in Liebe und Frieden trage.\nUnd wenn du dein Leid geklagt hast,\nkehr leise zurück,\nwie das Blatt auf dem Wasser,\nwie der Rauch im Wind,\nund lass mir das Herz\nklar wie einen See.\nSo sei es!","nota":"Der Spruch sendet Gutes; er bindet niemanden und ruft niemanden mit Gewalt herbei."},"spor":{"t":"Spruch für Mehrung an Haus und Tisch (De spor la casă și la masă)","cand":"Bei zunehmendem Mond, am Morgen.","mat":["eine Scheibe Brot","eine Handvoll Weizen","ein wenig Salz","eine Münze"],"pas":["Leg Brot, Weizen, Salz und Münze auf den Tisch.","Sprich den Spruch dreimal über ihnen.","Bewahre die Münze in deinem Geldbeutel auf, teile das Brot mit jemandem, und den Weizen lass den Vögeln."],"txt":"Segen, Mehrung,\nklopf an meine Tür:\nauf den Tisch mit Brot,\nins Haus mit Frieden,\nin den Beutel mit einem Pfennig,\nin die Hand mit Gesundheit.\nWas wenig ist, soll wachsen,\nwas viel ist, soll geteilt werden,\nwas leer ist, soll sich füllen,\nwas voll ist, soll bewahrt bleiben.\nWie der Teig im Trog aufgeht,\nwie das Gras nach dem Regen wächst,\nso soll die Mehrung in meinem Haus wachsen,\nnicht aus den Tränen anderer,\nsondern aus Arbeit und aus Gutem.\nSo sei es!","nota":"Mehrung kommt aus der Arbeit; der Spruch ist ein Gebet der Zuversicht, keine finanzielle Garantie."},"drum":{"t":"Spruch für eine gute Reise (De drum bun)","cand":"Vor dem Aufbruch.","mat":["ein wenig Salz in der Tasche","ein Glas Wasser"],"pas":["Stell dich auf die Schwelle, das Gesicht zum Weg.","Sprich den Spruch einmal, leise.","Trink einen Schluck Wasser, steck das Salz in die Tasche und geh, ohne dich von der Schwelle aus umzudrehen."],"txt":"Weg, du Wegesstrecke,\noffene Bahn\nfür mich und die mit mir sind:\nohne Stein im Fuß,\nohne Schatten im Gedanken,\nohne böse Begegnungen.\nDie Sonne auf der Stirn,\nder Mond im Rücken,\nWillkommen bei der Ankunft,\nWillkommen bei der Heimkehr.\nWie das Wasser zu Tal geht,\nso trage uns der Weg,\nleicht und gut.\nSo sei es!","nota":""},"impacare":{"t":"Spruch zur Versöhnung (De împăcare)","cand":"Am Abend, wenn die Glut sich etwas gelegt hat.","mat":["zwei Gläser Wasser","ein Stück Brot"],"pas":["Stell die beiden Gläser nebeneinander.","Sprich den Spruch über ihnen.","Wenn möglich, trink gemeinsam mit der anderen Person Wasser aus dem Glas; wenn nicht, trink selbst und lass das andere Glas bis zum Morgen auf dem Tisch stehen."],"txt":"Sanftes Wort, entflammtes Wort,\nnimm dein Feuer und lösch dich im Wasser.\nHartes Wort, trockenes Wort,\nweich dich in warmer Milch.\nWas ich in Eile gesagt,\nsoll sich in Geduld lösen;\nwas ich im Groll gehört,\nsoll sich in Vergebung setzen.\nNicht damit ich gewinne,\nnicht damit du gewinnst,\nsondern damit das Haus gewinnt.\nZu zweit sitzen wir am Tisch\nund brechen ein Brot.\nSo sei es!","nota":"Der Spruch ersetzt nicht das ehrliche Gespräch; er öffnet den Weg dorthin."},"ursita":{"t":"Spruch um die Bestimmung (aufrichtige Liebe) (De ursită)","cand":"Bei Neumond, am Abend.","mat":["ein roter oder wollener Faden","eine kleine Kerze"],"pas":["Binde den Faden locker um den kleinen Finger der linken Hand, ohne ihn zu straffen.","Sprich den Spruch dreimal.","Bewahre den Faden an einem gewählten Ort auf, zur Erinnerung an den Entschluss, offen zu bleiben."],"txt":"Schicksalsfrau, Schicksalsfeen,\nihr, die ihr mir bei der Geburt geschrieben\nmit goldenem Faden, mit wollenem Faden,\nich bitte euch nicht, jemanden zu binden,\nnoch Herzen von ihrem Platz zu rücken.\nIch bitte euch, mich zu bereiten:\nmit offenem Herzen,\nmit klaren Augen,\nmit aufrichtigem Wort.\nWer mir im Guten bestimmt ist,\nder komme auf gutem Wege,\nund ich sei auf seinem Weg ein guter Mensch.\nUnd wenn es jetzt nicht ist,\nso finde mich die Geduld\nund halte mich im Licht.\nSo sei es!","nota":"Dieser Spruch will den Willen eines anderen Menschen nicht beeinflussen."},"luna":{"t":"Spruch für Glück bei Neumond (De noroc la lună nouă)","cand":"Am ersten Abend, an dem der Neumond zu sehen ist.","mat":["eine kleine Münze (nach Belieben)"],"pas":["Schau den Mond von einem offenen Platz aus an.","Sprich den Spruch ein einziges Mal, die Hand auf dem Herzen.","Danke in Gedanken und geh ins Haus."],"txt":"Neuer Mond, junger Mond,\nich habe dich zuerst gesehen,\nGlück bring mir zuerst.\nWie der Himmel dich aus Silberfaden macht,\nso mach mir den Pfad.\nWas gut ist, wachse mir mit dir,\nwas schwer ist, schwinde mir.\nMein Dank sei dir\nauf deinem Himmel, mit Frieden,\nbis du dich füllst.\nSo sei es!","nota":""},"cap":{"t":"Spruch für einen beladenen Kopf (schwere Gedanken) (De cap încărcat)","cand":"Am Morgen, im Tageslicht.","mat":["ein Glas klares Wasser"],"pas":["Stell dich ans Fenster oder nach draußen.","Leg die Hand auf die Stirn und sprich den Spruch leise.","Trink das Wasser in drei Schlucken."],"txt":"Schwerer Gedanke, schwarzer Gedanke,\nkein Nest baust du in meinem Kopf.\nIch habe dich empfangen, dich angehört,\nnun lasse ich dich.\nGeh ins fließende Wasser,\ngeh in den Morgenwind.\nMein Kopf, ein reines Gefäß,\nklar wie die Quelle,\nleicht wie die Feder.\nGute Gedanken sollen Platz finden,\nböse Gedanken sich hinausstehlen.\nSo sei es!","nota":"Dies ist ein Beruhigungsbrauch, keine Behandlung. Wenn der Kopfschmerz anhält oder von anderen Anzeichen begleitet wird, geh zum Arzt."},"thx":{"t":"Spruch des Dankes (bei Tisch) (De mulțumire)","cand":"Vor dem Essen oder am Abend.","mat":["Brot und Wasser"],"pas":["Setz dich an den Tisch und nimm das Brot in die Hand.","Sprich den Dank.","Brich das Brot und teile es."],"txt":"Ich danke dem Brot, das gekeimt hat,\nden Händen, die geknetet haben,\nder Erde, die getragen hat,\nder Sonne, die gebacken hat,\ndem Wasser, das gegeben hat.\nGesegnet sei mein Tisch,\nmein Haus voller Frieden.\nIch
