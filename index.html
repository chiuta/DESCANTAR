möge dem Hungrigen geben können,\nnehmen können, wenn es mir fehlt,\nund ein Herz haben, immer zu danken.","nota":""},"casa":{"t":"Abendspruch für das Haus (De seară pentru casă)","cand":"Am Abend, vor dem Schlafengehen.","mat":["ein wenig Salz","ein Zweig Basilikum (oder ein anderes Duftkraut)"],"pas":["Streue eine Prise Salz auf die Türschwelle.","Leg den Basilikum in eine Ecke des Raumes.","Sprich den Spruch mitten im Haus."],"txt":"Auf der Schwelle mit Salz,\nam Fenster mit Licht,\nin der Ecke mit Basilikum,\nin der Mitte mit Frieden.\nWas im Guten eintritt,\nsoll sich laben;\nwas im Bösen eintritt,\nsoll von der Schwelle umkehren.\nMein Haus, ein Haus aus Licht.\nGute Nacht den Drinnen,\ngute Reise den Draußen.","nota":""}},"ELEM":{"water":["Fließendes Wasser, unberührtes Wasser,","Klares Wasser, Quellwasser,"],"fire":["Feuer des Lichts, Feuer der Hoffnung,","Kleine Flamme, sanfte Flamme,"],"earth":["Erde unter den Füßen, nährende Erde,","Warme Scholle, gute Scholle,"],"wind":["Morgenwind, leiser Wind,","Hauch der Luft, reiner Hauch,"],"salt":["Salz aus dem Salzigen, Salz aus der Erde,","Reines Salz, Salz des Schutzes,"],"thread":["Roter Faden, Faden des Lebens,","Dünner Faden, Faden der Verbindung zum Guten,"]},"CORE":{"prot":["Behüte Haus, Weg und Gedanken vor bösem Blick,","Behüte vor böser Rede und falschem Schritt,","Lass nur das Gute über die Schwelle treten,","Stell Licht ringsum, wie eine Mauer aus Licht,"],"calm":["Vertreibe Angst und Sorge aus der Brust,","Mach den Atem lang und das Herz leicht,","Gib dem Gedanken Klarheit wie in der Quelle,","Schenke guten Schlaf und einen stillen Tag,"],"fam":["Versammle die Sippe an einem Tisch des Friedens,","Löse den Groll, bring das sanfte Wort,","Stifte Vergebung unter den Nahestehenden,","Halte das Haus warm und die Tür offen,"],"love":["Bereite das Herz für eine aufrichtige Liebe,","Mach die Augen klar und das Wort ehrlich,","Gib Geduld bis zur guten Stunde,","Binde niemanden mit Gewalt, sondern erhelle den Weg,"],"spor":["Gib Mehrung im Haus und am Tisch,","Gib der Arbeit Frucht und ehrlichen Lohn,","Was wenig ist, wachse; was viel ist, werde geteilt,","Leg Fülle in die Hand, die gibt,"],"road":["Öffne den Weg und bewahre den Fuß vor dem Stein,","Stell Sonne auf die Stirn und Frieden in den Rücken,","Führ ans Ziel in Gutem und zurück mit Gewinn,","Schenke gute Gefährten auf dem Weg,"],"thx":["Dank für Brot und für Wasser,","Dank für Haus und für die Lieben,","Dank für den Tag heute und für den von morgen,","Dank für das Licht, das uns hält,"]},"IMG":["Wie der Tau zur Sonne geht,\nso gehe alles Überflüssige fort.","Wie die Quelle zu Tal fließt,\nso fließe das Gute dem Haus zu.","Wie das Blatt sich aufs Wasser legt,\nso lege sich der Friede.","Wie die Sonne nach der Nacht aufgeht,\nso gehe die Klarheit auf.","Wie der Weizen unter der Sonne reift,\nso reife die gute Zeit.","Wie der Vogel sein Nest findet,\nso finde der Mensch seine Ruhe."],"SEAL":"Mein Wort sei Schloss,\nmein Atem Schlüssel.\nSo sei es, dreimal!","GEN_FOR":"Für {n}, in Gutem.","ROWT":[["Beladener Kopf: große Sorge, aufgeschobene Entscheidungen; warte, bis es sich klärt.","Die Gedanken verwirren sich; entscheide nicht in Eile.","Der Geist ist überwiegend heiter; ein kleiner Zweifel verlangt Geduld.","Klare Gedanken und Wünsche mit offenem Weg; was du im Sinn hast, kann sich erfüllen."],["Schweres Herz: Kummer oder Tränen; schütze deine Ruhe und deine Erholung.","Verworrene Gefühle; du brauchst ein aufrichtiges Wort im Haus.","Die Gefühle sind überwiegend gut; ein kleiner Kummer wird sich legen.","Das Herz ist im Frieden: Liebe, Haus und Gesundheit stehen gut."],["Weg vorerst geschlossen: Verschiebe Aufbrüche und große Geschäfte.","Weg mit Hindernissen oder Ausgaben; rüste dich mit Bedacht.","Der Weg geht voran, mit gelegentlichem Aufenthalt.","Offene Wege und Geld mit Glück; willkommene Gäste."]],"CELLN":["rein","Aufenthalt","volles Glück","Last"],"SP":{"cump":"Die große Wegscheide (cumpăna mare): Der erste Haufen oben (links) und der letzte unten (rechts) sind gerade — du hast ein Hindernis zu überwinden; tu es mit kleinen Schritten.","drum":"Der offene Weg (drumul deschis): Die untere Reihe hat nur ungerade Zahlen — jeder Weg und jeder Plan, der jetzt beginnt, hat Erfolg.","linie":"Die Glückslinie (linia norocoasă): eine ganze Linie mit je 3 Bohnen — der Wunsch erfüllt sich schnell und ohne Hindernisse."},"OLT":{"title":"Oltenien","casa4":"Im Haus (Feld 5): genau 4 Bohnen — Volles Haus (casă plină), Überfluss und Zufriedenheit; der Wunsch erfüllt sich sehr schnell.","casa_1":"Im Haus (Feld 5): {n} Bohne.","casa_n":"Im Haus (Feld 5): {n} Bohnen.","sum5":"Die obere Reihe ergibt 5: positive Antwort, die sich in Eile ereignen wird.","sum9":"Die obere Reihe ergibt 9: positive Antwort, später, aber sicher.","sumN":"Die obere Reihe ergibt {n}: kein besonderes Zeichen.","bob_sus":"Einzelne Bohne oben: Nachricht ins Leere, ohne Bedeutung.","colac_cap":"Kranz auf dem Haupt (colac în cap): große Freude.","sositor_strict":"Ankommende Bohne (bob sositor) (1 Bohne unten rechts): Geld kommt oder eine lang erwartete Nachricht, ein lieber Mensch von weiter Reise.","sositor_wide":"Ankommende Bohne (bob sositor), weite Variante (1 Bohne in der unteren Reihe, nicht rechts): Ein lieber Mensch kommt von weiter Reise, oder Geld kommt ins Haus.","prag_strict":"Kranz an der Schwelle (colac în prag) (3 Bohnen unten in der Mitte): Hochzeit, Fest, liebe Gäste.","prag_wide":"Kranz an der Schwelle (colac în prag), weite Variante (3 Bohnen in der unteren Reihe, nicht in der Mitte): Gäste oder ein Fest.","doua":"Zwei Bohnen: Zweifel, Waagschale oder eine Nachricht, die das Herz beklemmt.","linie":"Linie mit je 2 oder 3 aufeinanderfolgend gelegten Bohnen: weiter Weg, über die Grenzen oder außerhalb des Kreises.","desc_lbl":"Weihespruch (descântec de menire) (lokale Variante; die Formeln unterscheiden sich von Dorf zu Dorf):","short_lbl":"Kurze Variante:","desc":"Ihr, 41 Bohnen,\nWie ihr wisst zu keimen,\nAlle Auen zu begrünen,\nDie ganze Welt zu nähren,\nSo sollt ihr wissen um die Kunde von [Name der Person]...\nIst es zum Guten, so fallt auf sechs (oder auf neun),\nAufs Herz zwei, dass man es gut sieht!","desc2":"Wie ihr die Welt nährt,\nso zeigt mir die Wahrheit\nüber [Name der Person / die Frage]."},"YN":["Antwort der Bohnen: JA — die Bohnen stehen auf deiner Seite.","Eher ja, mit ein wenig Geduld.","Eher nicht jetzt; warte auf eine bessere Stunde.","NEIN vorerst; lass die Dinge sich setzen."],"GUIDE":"🫘 VORBEREITUNG\n1. Nimm genau 41 weiße Bohnen (oder Maiskörner) in die Faust.\n2. Hauche dreimal darüber und sprich: „Wie ihr die Welt nährt, so zeigt mir die Wahrheit über [deine Frage]“.\n\n📐 DAS TEILEN (immer in Vierergruppen)\nDie Bohnen werden in einer Matrix aus 3 Reihen × 3 Häufchen ausgelegt.\n• Reihe 1 (OBEN — der Gedanke): Aus dem großen Haufen nimmst du jeweils 4 weg; der Rest (1, 2, 3 oder 4 Bohnen) ist das erste Häufchen, links. Wiederhole das mit den abgezählten Bohnen für das mittlere Häufchen, dann für das rechte.\n• Reihe 2 (MITTE — das Herz): Sammle die übrigen Bohnen und wiederhole es für die 3 Häufchen in der Mitte.\n• Reihe 3 (UNTEN — der Weg): Wiederhole es für die letzten 3 Häufchen.\nBohnen, die am Ende übrig bleiben, legst du beiseite.\nIn der App: Anstelle dieses „Zieh vom Haufen“ teilst du die Reihe der 41 Bohnen in 9 Häufchen (acht Schnitte) und nimmst von jedem je 4 weg; der Rest von 1–4 kommt in die Matrix. So fällt jede Deutung anders aus.\n\n🔮 DIE SCHNELLE DEUTUNG\n• 1 oder 3 Bohnen (ungerade): gutes Zeichen, Freude, Gelingen — JA.\n• 2 oder 4 Bohnen (gerade): Waagschale, Verzögerung, Kummer — NEIN.\n\n🌟 DIE GROSSEN ZEICHEN\n• 4 Bohnen in der Mitte: „Volles Haus (casă plină)“ (Glück, Geld, Überfluss).\n• 3 Bohnen unten in der Mitte: „Kranz an der Schwelle (colac în prag)“ (Hochzeit, Fest, liebe Gäste).\n• 1 Bohne unten rechts: „Ankommende Bohne (bob sositor)“ (Geld kommt oder eine lang erwartete Nachricht).\n• Gerade links oben und rechts unten: „Die große Wegscheide (cumpăna mare)“.\n• Untere Reihe nur ungerade: „Der offene Weg (drumul deschis)“.\n• Eine Linie mit je 3 Bohnen: „Die Glückslinie (linia norocoasă)“.\nIn Oltenien füge hinzu: 3 Bohnen in der oberen Reihe = „Kranz auf dem Haupt (colac în cap)“; die obere Reihe ergibt 5 (in Eile) oder 9 (später, aber sicher); befrage die Bohnen nicht zweimal am selben Tag zur selben Frage."},"hu":{"READ":{"g":[["Sokáig vitted egyedül a terhet; egy régi gondoskodás még mindig helyet tart a szívedben.","Valaki melletted állt, és te még most is hálával őrzöd a jóságát.","Egy kör bezárult mögötted; ami beteljesedésre várt, az beteljesedett."],["Gondolataid válaszútján állsz; várj jelre, ne siettesd a lépted.","Most két dolgot mérlegelsz: hallgass a szívedre is, a számításra is.","A bőség asztalánál ülsz: többed van, mint hiszed, számold hálával."],["Kis hír érkezik, de megváltoztatja az irányt.","Jó találkozás vagy jó megegyezés közeleg.","Beteljesedés érik; a türelmed jutalmat kap."]],"d":[["Egy be nem fejezett szerelem még most is az emlékeid közt jár.","Jó kötelék volt, olyan gyökerekkel, amelyek még ma is érezhetők.","Egy történet szépen véget ért; hagyd, hogy elvégezze a dolgát."],["A szív magányos, de nem puszta; készül valamire.","Ketten közelednek egymáshoz: vagy te és valaki, vagy te és önmagad.","A szív tele van; vigyázz, hogy ne kérj többet, mint amennyi adható."],["Új érzés tűnik fel észrevétlenül.","Lelki találkozás vagy kibékülés van a közelben.","Gyökeret verő kötelék készül, gondolattal és tettel."]],"b":[["Ingatag kezdet megtanított takarékoskodni.","Nyereség érkezett valaki támogatásával.","Egykori bőség megtanította, mennyit ér minden."],["A zsák könnyű, de a lélek higgadt; vezesd a számadást.","A bevétel és a kiadás egyensúlyban van; kerüld a kölcsönöket.","Gyarapodik a ház; oszd meg mértékkel."],["Ne siess új üzletekkel; nyisd ki jól a szemed.","Nyereség két úton érkezik; légy résen egy társulásnál.","A munka gyümölcse beérik; amit most vetsz, termést hoz."]],"c":[["Sietve történt távozás; valamit még tisztázni kell hátrahagyottan.","A jó útitárssal tett út jól végződött.","Hosszú út ért jó véget."],["Még nincs itt az indulás órája; készítsd a csomagot.","Két út nyílik; azt válaszd, amelyik nyugalmat ad.","Az út nyitva áll; végy magaddal egy kis sót és sok türelmet."],["Rövid utazás vagy messziről hozott hír.","Társsal tett út, amely fontos találkozóhoz vezet.","Nagy, áldott út, gyarapodó hazatéréssel."]],"a":[["Egy régi hallgatás a házban még nem olvadt el.","Valaki a rokonságból oltalmazott; viseld emlékét tisztelettel.","A család nagy asztala emlékezetes maradt; tartsd meg a szokást."],["A ház apró gondjai egy jó szóra várnak.","Két házbélinek meg kell értenie egymást; többet hallgass, mint beszélsz.","A ház teli van értelemmel; adj hálát azért, amid van."],["Hír kopogtat a kapun, rokonoktól vagy barátoktól.","Kibékülés a családban vagy kedves vendég érkezése.","Ünnep vagy öröm a nagy asztalnál."]],"m":[["Egyedül dolgoztál, és a fáradozásod nem látszott.","Egy kolléga vagy mentor támaszod volt.","A befejezett munka most súlyt ad neked."],["Még egy kis lépés, és az eredmény megmutatkozik; ne állj meg.","Együttműködés kell; oszd meg a feladatot.","A munka gyümölcsénél tartasz; vigyázz, hogy el ne szórd magad."],["Váratlan ajánlat; mérlegeld türelemmel.","Társulás vagy csapatváltás segít neked.","Elismerés és biztos alap: szilárd talajon dolgoztál."]]},"SIGNS":[["🛤️","Út","mozgás, indulás vagy helyváltoztatás"],["✉️","Levél","hír, üzenet, aláírandó papír"],["🚶","Idegen ember","új arc lép be a történetedbe"],["🪙","Pénz","nyereség vagy értelmes kiadás"],["🏠","Ház","a lakhellyel kapcsolatos döntés vagy változás"],["❤️","Szív","egy igaz érzés meghallgatást kér"],["👁️","Szem","valaki néz téged; vigyázz, mit mondasz és kinek"],["💧","Könnycsepp","a nyomás után megkönnyebbülés jön"],["🔒","Lakat","akadály, vagy valami, aminek várnia kell"],["🗝️","Kulcs","a megoldás közelebb van, mint hinnéd"],["⭐","Csillag","szerencse és útmutatás"],["🕊️","Madár","jó hír és békesség"]],"PEB":["Kő a múltban: régi teher, amely még nyom; bocsáss meg, és hagyd, hogy leessen.","Kő a jelenben: pillanatnyi akadály; kerüld meg, ne rúgj bele.","Kő a jövőben: próba, amely megerősít, ha türelemmel fogadod."],"VERD":{"1,1,3":"A koszorú két magányos bab után jön: a türelem és a magány után beteljesedés.","1,2,2":"Pár a pár hátán: támasz és megértés; ne maradj egyedül a döntéseidben.","2,3,3":"Kettős bőség: nagyok az ajándékok; hordozd őket alázattal, és oszd meg őket."},"ADV":["Ami meg van írva, a babban megmutatkozik, de amit tenni kell, azt te teszed.","A jó szándékkal tett kis lépések messzire visznek.","A jó szó több ajtót nyit, mint a kulcs.","Ne kívül keresd a békét; előbb bent telepszik meg.","Légy hálás azért, amid van, és még több jön.","Háromszor mérj, egyszer vágj.","Aki türelemmel vet, örömmel arat.","Tiszta vízzel a gondolat is megmosdik.","Amit ma nem tudsz megváltoztatni, hagyd holnapig leülepedni.","Ne tedd másnak, amit magadnak nem kívánnál.","A reggel bölcsebb az esténél.","A babok tanácsa tükör: nézz bele, és te döntesz."],"DESC":{"deochi":{"t":"Ráolvasás a szemverés ellen (De deochi)","cand":"Reggel, napkelte előtt; hagyomány szerint kedden vagy csütörtökön.","mat":["érintetlen víz egy pohárban vagy tálban","három szem só","egy piros fonal (elhagyható)"],"pas":["Állj kelet felé fordulva, és tedd magad elé a vizet.","Tartsd a tenyered a víz fölé, és mondd el a ráolvasást háromszor, minden záráskor finoman ráfújva a vízre.","Érintsd meg a homlokod egy nedves ujjal. A vizet nem szabad meginni.","Öntsd a vizet egy fa tövébe vagy a földre, anélkül hogy hátranéznél."],"txt":"Szemverés, szemverés,\nmenj ki a szemből, a pillából, a szemöldökből,\na homlokból, a halántékból, a lélekből.\nHa fekete szemtől jössz, menj a fekete földbe;\nha kék szemtől jössz, menj a kék vízbe;\nha zöld szemtől jössz, menj a zöld fűbe;\nha barna szemtől jössz, menj az öreg fába.\nÉn elengedlek, te elengedsz,\nén jóval, te békével.\nAhogy a harmat elmegy a napra,\núgy menj el te is belőlem,\nés maradjon tiszta homlok,\nvilágos szem, könnyű szív.\nSzavam — lakat,\na víz — kulcs.\nÚgy legyen!","nota":"A ráolvasás a megnyugvás népi szokása; ha valódi panaszod van (fejfájás, láz), fordulj orvoshoz."},"frica":{"t":"Ráolvasás a félelem ellen (De frică)","cand":"Este, amikor a ház elcsendesedett.","mat":["egy kis gyertya (figyeld a lángot)","egy pohár víz"],"pas":["Ülj egyenesen, lábad a padlón.","Lélegezz mélyen háromszor.","Mondd el halkan a ráolvasást, a lángot nézve.","Óvatosan oltsd el a gyertyát, és idd meg a vizet néhány kortyban."],"txt":"Félelem, félelmecske,\nha az éjből jöttél, menj vissza az éjbe;\nha az árnyékból jöttél, menj vissza az árnyékba;\nha a zajból jöttél, menj vissza a csendbe.\nA szívem nem asztal neked,\nmert háza a fény háza.\nAhogy a köd eltűnik a dombról,\nha felkel a nap,\núgy tűnjék el belőlem a félelem,\nés maradjon béke,\nhosszú lélegzet,\nbiztos láb.\nSzavam — fény,\nlélegzetem — lánc.\nÚgy legyen!","nota":"Ha a félelem vagy a nyugtalanság sok napja elkísér, beszélj egy közeli emberrel vagy egy szakemberrel."},"somn":{"t":"Ráolvasás az álomhoz, altatódal (De somn)","cand":"Este, lefekvéskor.","mat":["egy puha párna","halvány fény"],"pas":["Fektesd kényelembe a gyermeket (vagy magadat).","Mondd el halkan, bölcsődal ritmusában, háromszor.","Zárd egy simogatással a homlokán."],"txt":"Jöjj, álom, az erdőből,\nszürke fű puha léptével,\nszelíd ködök talpával.\nJöjj, álom, a pillára,\nmint pillangó a virágra.\nVágd el gondját, mint a kenyeret,\nadj ajándékba csillagos álmot,\nolyan hosszú álmot, mint az éjszaka,\nés napfényes pirkadatot.\nÉn itt vagyok melletted,\na hold az ablakban áll,\naz angyal a fejedhez áll.\nAludj, aludj, aludj,\na jó álom megújítja a napot.","nota":""},"dor":{"t":"Ráolvasás a vágyakozás ellen (De dor)","cand":"Alkonyatkor, az ablaknál.","mat":["egy kissé nyitva hagyott ablak","egy pohár víz"],"pas":["Gondolj szelíden arra, akit visszavágysz.","Mondd el a ráolvasást az ablak felé.","Idd meg a vizet, és hagyd, hogy a vágyakozás leüljön."],"txt":"Vágy, vágyakozás,\nne égess az ablaknál,\nne kopogj az üvegen estére.\nMenj, vágy, ahol a vágyott van,\nvigyél hírt, hogy rá gondolok,\nhogy jó van értem a lelkemben,\nhogy szeretettel és békével viszem.\nÉs ha elmondtad panaszod,\nfordulj vissza könnyedén,\nmint a falevél a vízen,\nmint a füst a szélben,\nés hagyd a szívemet\ntisztának, mint a tavat.\nÚgy legyen!","nota":"A ráolvasás jót küld, nem köt meg, és senkit sem hív erőszakkal."},"spor":{"t":"Ráolvasás a ház és az asztal gyarapodására (De spor la casă și la masă)","cand":"Növő holdnál, reggel.","mat":["egy szelet kenyér","egy marék búza","egy kis só","egy pénzérme"],"pas":["Tedd az asztalra a kenyeret, a búzát, a sót és az érmét.","Mondd el fölöttük a ráolvasást háromszor.","Az érmét tartsd meg a pénztárcádban, a kenyeret oszd meg valakivel, a búzát hagyd a madaraknak."],"txt":"Gyarapodás, gyarapodás,\nkopogj az ajtómon:\nasztalra kenyérrel,\nházba békével,\nzsebbe pénzecskével,\nkézbe egészséggel.\nAmi kevés, növekedjék,\nami sok, osztassék,\nami üres, megteljék,\nami teli, megmaradjon.\nAhogy a tészta nő a teknőben,\nahogy a fű nő az eső után,\núgy nőjön a gyarapodás a házamban,\nne mások könnyeiből,\nhanem munkából és jóból.\nÚgy legyen!","nota":"A gyarapodás munkából jön; a ráolvasás a reménység imája, nem anyagi garancia."},"drum":{"t":"Ráolvasás a jó útra (De drum bun)","cand":"Indulás előtt.","mat":["egy kis só a zsebben","egy pohár víz"],"pas":["Állj a küszöbre, az út felé fordulva.","Mondd el a ráolvasást egyszer, halkan.","Idd meg egy korty vizet, tedd a zsebedbe a sót, és indulj úgy, hogy a küszöbről nem fordulsz vissza."],"txt":"Út, utacska,\nnyitott ösvény\nnekem és a velem lévőknek:\nkő nélkül a lábban,\nárnyék nélkül a gondolatban,\nrossz találkozás nélkül.\nNap a homlokon,\nhold a hátunk mögött,\njó fogadás érkezéskor,\njó fogadás hazatéréskor.\nAhogy a víz lefolyik a völgybe,\núgy vigyen minket az út,\nkönnyen és jóval.\nÚgy legyen!","nota":""},"impacare":{"t":"Ráolvasás a kibékülésre (De împăcare)","cand":"Este, miután a láng már lecsillapodott.","mat":["két pohár víz","egy darab kenyér"],"pas":["Állítsd a két poharat egymás mellé.","Mondd el fölöttük a ráolvasást.","Ha lehet, igyatok vizet egy pohárból a másik féllel; ha nem, idd meg te, a másik poharat pedig hagyd az asztalon reggelig."],"txt":"Szelíd szó, felgyúlt szó,\nvedd a tüzed, és oltsd ki magad a vízben.\nKemény szó, száraz szó,\nlágyulj meg a meleg tejben.\nAmit hevenyében mondtam,\nbomoljék fel a türelemben;\namit sértődötten hallottam,\nüljön le a megbocsátásban.\nNem hogy én nyerjek,\nnem hogy te nyerj,\nhanem hogy a ház nyerjen.\nKetten ülünk az asztalnál,\nés egy kenyeret török.\nÚgy legyen!","nota":"A ráolvasás nem helyettesíti az őszinte beszélgetést; megnyitja az utat felé."},"ursita":{"t":"Ráolvasás a rendelésre, igaz szerelemért (De ursită)","cand":"Újholdnál, este.","mat":["egy piros vagy gyapjú fonal","egy kis gyertya"],"pas":["Kösd lazán a fonalat a bal kéz kisujja köré, szorítás nélkül.","Mondd el a ráolvasást háromszor.","Őrizd a fonalat egy választott helyen, emlékeztetőül arra a döntésre, hogy nyitott maradsz."],"txt":"Rendelés, sorsvető,\nki születésemkor megírtál\naranyfonallal, gyapjúfonallal,\nnem kérlek, hogy megköss valakit,\nsem hogy szíveket mozdíts el.\nAzt kérlek, hogy előkészíts:\nnyitott szívvel,\ntiszta szemmel,\negyenes szóval.\nAki nekem jóval rendeltetett,\njöjjön jó úton,\nés én az ő útján legyek jó.\nÉs ha most nem jön el,\ntaláljon rám a türelem,\nés tartson a fényben.\nÚgy legyen!","nota":"Ez a ráolvasás nem akarja befolyásolni más ember akaratát."},"luna":{"t":"Ráolvasás a szerencséért újholdkor (De noroc la lună nouă)","cand":"Az első este, amikor az újhold látszik.","mat":["egy kis pénzérme (elhagyható)"],"pas":["Nézd a holdat egy nyílt helyről.","Mondd el a ráolvasást egyetlenegyszer, kezeddel a szíveden.","Mondj köszönetet gondolatban, és menj be a házba."],"txt":"Újhold, fiatal hold,\nén láttalak meg először,\nszerencsét hozz nekem először.\nAhogy az ég ezüstfonalból formál,\núgy formáld az ösvényem.\nAmi jó, velem nőjön veled,\nami nehéz, velem fogyjon.\nA hálám legyen\naz égeden, békével,\namíg csak teljes nem leszel.\nÚgy legyen!","nota":""},"cap":{"t":"Ráolvasás a terhes fejre, nehéz gondolatokra (De cap încărcat)","cand":"Reggel, nappali fényben.","mat":["egy pohár tiszta víz"],"pas":["Állj az ablakhoz vagy menj ki a szabadba.","Tedd a kezed a homlokodra, mondd el halkan a ráolvasást.","Idd meg a vizet három kortyban."],"txt":"Nehéz gondolat, fekete gondolat,\nne rakj fészket a fejemben.\nÉn befogadtalak, meghallgattalak,\nmost elengedlek.\nMenj a folyóvízbe,\nmenj a reggeli szélbe.\nFejem, tiszta edény,\ntiszta, mint a forrás,\nkönnyű, mint a toll.\nJó gondolatok férjenek el benne,\nrosszak szivárogjanak ki.\nÚgy legyen!","nota":"Ez megnyugtató szokás, nem kezelés. Ha a fejfájás tartós vagy más jelek kísérik, fordulj orvoshoz."},"thx":{"t":"Hálaadó ráolvasás asztalnál (De mulțumire)","cand":"Étkezés előtt vagy este.","mat":["kenyér és víz"],"pas":["Ülj az asztalhoz, fogd kezedbe a kenyeret.","Mondd el a hálaadást.","Törd meg a kenyeret, és oszd szét."],"txt":"Köszönöm a kenyérnek, amely kicsírázott,\na kezeknek, amelyek meggyúrták,\na földnek, amely hordozta,\na napnak, amely megsütötte,\na víznek, amely adott.\nLegyen áldott az asztalom,\nbékével teli a házam.\nLegyen mit adnom az éhezőnek,\nmit venni, ha hiányzik,\nés szív, hogy mindig hálás legyek.","nota":""},"casa":{"t":"Esti ráolvasás a házra (De seară pentru casă)","cand":"Este, lefekvés előtt.","mat":["egy kis só","egy szál bazsalikom (vagy más illatos növény)"],"pas":["Szórj egy csipet sót az ajtó küszöbére.","Tedd a bazsalikomot a szoba egyik sarkába.","Mondd el a ráolvasást a ház közepén."],"txt":"A küszöbön sóval,\naz ablakon fénnyel,\na sarokban bazsalikommal,\na közepén békével.\nAmi jóval belép,\nlakmározzon;\nami rosszal belép,\nforduljon vissza a küszöbről.\nHázam, fény háza.\nJó álmot a bentieknek,\njó utat a kintieknek.","nota":""}},"ELEM":{"water":["Folyó víz, érintetlen víz,","Tiszta víz, forrásvíz,"],"fire":["Fény tüze, remény tüze,","Kis láng, szelíd láng,"],"earth":["Lábunk alatti föld, tápláló föld,","Meleg göröngy, jó göröngy,"],"wind":["Reggeli szél, könnyű szél,","Levegő lehelete, tiszta lehelet,"],"salt":["Sós sója, föld sója,","Tiszta só, oltalmazó só,"],"thread":["Piros fonal, életfonal,","Vékony fonal, a jóval összekötő fonal,"]},"CORE":{"prot":["Óvd a házat, az utat és a gondolatot a rossz tekintettől,","Óvd a rossz szótól és a téves lépéstől,","Csak a jó lépje át a küszöböt,","Tégy fényt köréjük, fényfalat,"],"calm":["Űzd el a félelmet és a gondot a mellkasból,","Tedd hosszúvá a lélegzetet, könnyűvé a szívet,","Tégy a gondolatba tisztaságot, mint a forrásban,","Adj jó álmot és csendes napot,"],"fam":["Gyűjtsd a nemzetséget a béke asztalához,","Oldd a haragot, hozz szelíd szót,","Tégy megbocsátást a közel állók közé,","Tartsd melegen a házat, nyitva az ajtót,"],"love":["Készítsd a szívet igaz szerelemre,","Tedd tisztává a szemet, őszintévé a szót,","Adj türelmet a jó óráig,","Ne kössön meg senkit erőszakkal, hanem világítsa meg az utat,"],"spor":["Adj gyarapodást a házba és az asztalra,","Adj termést a munkának és tisztességes jutalmat,","Ami kevés, növekedjék, ami sok, osztassék,","Tégy bőséget az adakozó kezébe,"],"road":["Nyisd meg az utat, és óvd a lábat a kőtől,","Tégy napot a homlokra és békét hátra,","Vigy célba jóval és vissza gyarapodva,","Adj jó útitársakat az útra,"],"thx":["Hála a kenyérért és a vízért,","Hála a házért és a kedveseinkért,","Hála a mai napért és a holnapiért,","Hála a fényért, amely tart minket,"]},"IMG":["Ahogy a harmat elmegy a napra,\núgy menjen el minden, ami fölösleges.","Ahogy a forrás lefolyik a völgybe,\núgy folyjon a jó a házhoz.","Ahogy a falevél a vízre ereszkedik,\núgy telepedjen meg a béke.","Ahogy a nap felkel az éjszaka után,\núgy keljen fel a tisztaság.","Ahogy a búza érik a nap alatt,\núgy érjen a jó idő.","Ahogy a madár megtalálja a fészkét,\núgy találja meg az ember a nyugalmát."],"SEAL":"Szavam — lakat,\nlélegzetem — kulcs.\nÚgy legyen, háromszor!","GEN_FOR":"{n} számára, jó szívvel.","ROWT":[["Terhes fej: nagy gond, halogatott döntések; várd meg, míg kitisztul.","A gondolatok összegabalyodnak; ne dönts sietve.","Az elme inkább derűs; egy kis kétely türelmet kér.","Tiszta gondolatok és szabad úton járó vágyak; amit fejedben hordasz, beteljesedhet."],["Nehéz szív: harag vagy könnyek; óvd a nyugalmad és a pihenésed.","Összekuszálódott érzelmek; őszinte szóra van szükség a házban.","Az érzések többnyire jók; egy kis harag lecsillapodik.","A szív békében van: a szerelem, a ház és az egészség jól áll."],["Az út egyelőre zárva: halaszd el az indulásokat és a nagy üzleteket.","Akadályos vagy költséges út; készülj számítással.","Az út halad, olykor egy kis késéssel.","Nyitott utak és szerencsés pénz; szívesen látott vendégek."]],"CELLN":["tiszta","késedelem","teljes szerencse","teher"],"SP":{"cump":"A nagy válaszút (cumpăna mare): a bal felső első halom és a jobb alsó utolsó páros; leküzdendő akadály vár rád, kis lépésekkel menj át rajta.","drum":"A nyitott út (drumul deschis): az alsó sorban csak páratlan számok állnak; minden most kezdett út vagy terv sikeres.","linie":"A szerencsés vonal (linia norocoasă): egy teljes sor, soronként 3 babbal; a kívánság gyorsan és akadály nélkül teljesül."},"OLT":{"title":"Olténia","casa4":"A házban (5. kis ház): pontosan 4 bab; teli ház (casă plină), bőség és megelégedés; a kívánság nagyon gyorsan teljesül.","casa_1":"A házban (5. kis ház): {n} bab.","casa_n":"A házban (5. kis ház): {n} bab.","sum5":"A felső sor összege 5: pozitív válasz, amely sietve fog megtörténni.","sum9":"A felső sor összege 9: pozitív válasz, később, de biztosan.","sumN":"A felső sor összege {n}: különösebb jel nélkül.","bob_sus":"Egyedül álló bab fent: hiábavaló hír, jelentéktelen.","colac_cap":"Koszorú a fejen (colac în cap): nagy öröm.","sositor_strict":"Érkező bab (bob sositor; 1 bab jobb alul): pénz érkezik vagy régóta várt hír, valaki kedves hosszú útról.","sositor_wide":"Érkező bab (bob sositor), tágabb változat (1 bab az alsó sorban, nem jobbra): valaki kedves érkezik hosszú útról, vagy pénz jön a házhoz.","prag_strict":"Koszorú a küszöbön (colac în prag; 3 bab alul középen): lakodalom, mulatság, kedves vendégek.","prag_wide":"Koszorú a küszöbön (colac în prag), tágabb változat (3 bab az alsó sorban, nem középen): vendégek vagy mulatság.","doua":"Két bab: kétely, válaszút vagy szívszorító hír.","linie":"Egymás után sorakozó 2 vagy 3 babos vonal: hosszú út, határon túl vagy a megyén kívül.","desc_lbl":"Rendelő ráolvasás (helyi változat; a szöveg falvanként más és más):","short_lbl":"Rövid változat:","desc":"Ti, 41 bab,\nAhogy tudtok csírázni,\nMinden rétet zöldbe vonni,\nEgész világot táplálni,\nÚgy tudjátok meg [a személy neve] sorsát...\nHa jó, hat (vagy kilenc) legyen,\nSzívhez kettő, hogy jól lássuk!","desc2":"Ahogy a világot táplálod,\núgy mutasd meg nekem az igazat\n[a személy neve / a kérdés] felől."},"YN":["A babok válasza: IGEN, a babok melletted állnak.","Inkább igen, egy kis türelemmel.","Inkább nem most; várj jobb órára.","NEM egyelőre; hagyd, hogy a dolgok leülepedjenek."],"GUIDE":"🫘 ELŐKÉSZÜLET\n1. Végy a markodba pontosan 41 szem fehér babot (vagy kukoricát).\n2. Fújj rájuk háromszor, és mondd: „Ahogy a világot táplálod, úgy mutasd meg nekem az igazat [a kérdésed] felől”.\n\n📐 FELOSZTÁS (négyesével)\nA szemek 3 sorból × 3 halomból álló mátrixba kerülnek.\n• 1. sor (FENT — a Gondolat): a nagy halomból négyesével veszel el; ami marad (1, 2, 3 vagy 4 szem), az az első halom, balra. Ismételd a megszámolt szemekkel a középső halomnál, aztán a jobb oldalinál.\n• 2. sor (KÖZÉP — a Szív): fogd össze a megmaradt szemeket, és ismételd a középső 3 halomra.\n• 3. sor (LENT — az Út): ismételd az utolsó 3 halomra.\nA végül megmaradt szemeket tedd félre.\nAz alkalmazásban a „húzd a halomból” helyett a 41 szemből álló sort 9 halomra vágod (nyolc vágás), és mindegyikből négyet elveszel; a megmaradó 1–4 szem kerül a mátrixba. Így minden olvasás más lesz.\n\n🔮 GYORS OLVASÁS\n• 1 vagy 3 szem (páratlan): jó jel, öröm, siker — IGEN.\n• 2 vagy 4 szem (páros): válaszút, késedelem, harag — NEM.\n\n🌟 A NAGY JELEK\n• 4 szem középen: „Teli ház (casă plină)” (szerencse, pénz, bőség).\n• 3 szem alul középen: „Koszorú a küszöbön (colac în prag)” (lakodalom, mulatság, kedves vendégek).\n• 1 szem jobb alul: „Érkező bab (bob sositor)” (pénz érkezik vagy régóta várt hír).\n• Páros bal felül és jobb alul: „A nagy válaszút (cumpăna mare)”.\n• Az alsó sorban csak páratlan: „A nyitott út (drumul deschis)”.\n• Egy vonal 3 szemmel soronként: „A szerencsés vonal (linia norocoasă)”.\nOlténiában add hozzá: 3 szem a felső sorban = „koszorú a fejen (colac în cap)”; a felső sor összege 5 (sietve) vagy 9 (később, de biztosan); ugyanazon a napon ugyanarra a kérdésre ne vess babot kétszer."}};

function scatter(){const P=[];for(let i=0;i<44;i++){let best=null,bd=-1;for(let k=0;k<30;k++){const x=7+Math.random()*86,y=9+Math.random()*82;let md=1e9;for(const p of P){const dx=x-p.x,dy=(y-p.y)*0.64;const d=dx*dx+dy*dy;if(d<md)md=d}if(md>bd){bd=md;best={x,y}}}P.push({x:best.x,y:best.y,r:Math.round(Math.random()*180-90)})}return P}
function setPos(e,p){e.style.left=p.x+'%';e.style.top=p.y+'%';e.style.setProperty('--rot',p.r+'deg')}
function buildTable(){const tb=$('#table');tb.innerHTML='';tableEls=[];pts=scatter();pts.forEach((p,i)=>{const e=document.createElement('div');e.className='bean'+(i>=41?' pebble':'');tb.appendChild(e);tableEls.push(e)});requestAnimationFrame(()=>requestAnimationFrame(()=>pts.forEach((p,i)=>setPos(tableEls[i],p))))}
function shuffleTable(){pts=scatter();pts.forEach((p,i)=>setPos(tableEls[i],p))}
function grp(j){const c=S.cuts;if(!c.length)return'';let g=0;while(g<c.length&&j>c[g])g++;if(g>=c.length&&c.length<need())return'';return 'g'+(g%3)}
function renderStage(){const el=$('#stage');
  if(S.stage===0){el.innerHTML=`<p class="hint">${t('h_table')}</p><div class="table" id="table"></div><div class="btns"><button class="btn sec" id="bsh">${t('b_shuffle')}</button><button class="btn" id="brow">${t('b_row')}</button></div>`;buildTable();$('#bsh').onclick=shuffleTable;$('#brow').onclick=()=>{S.stage=1;S.cuts=[];renderStage()}}
  else if(S.stage===1){let h=`<p class="hint">${t(S.mode==='trei'?'h_cut':'h_cut9')} <b>${t('cuts_l')}: ${S.cuts.length}/${need()}</b></p><div class="row">`;
    for(let j=0;j<41;j++)h+=`<button class="rb ${grp(j)}${S.cuts.includes(j)?' cut':''}" data-j="${j}"${j===40?' disabled':''} aria-label="${j+1}"><i></i></button>`;
    h+=`</div><div class="btns"><button class="btn sec" id="brand">${t('b_rand')}</button><button class="btn" id="bcount"${S.cuts.length<need()?' disabled':''}>${t('b_count')}</button><button class="btn sec" id="bagain">${t('b_again')}</button></div>`;
    el.innerHTML=h;$$('.rb').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(S.cuts.length>=need())S.cuts=[];if(S.cuts.includes(j))return;S.cuts=[...S.cuts,j].sort((a,b)=>a-b);renderStage()});
    $('#brand').onclick=()=>{S.cuts=sample([...Array(40).keys()],need()).sort((a,b)=>a-b);renderStage()};$('#bcount').onclick=doCount;$('#bagain').onclick=resetAll}
  else{renderPiles(el)}}
function doCount(){const c=S.cuts;let prev=-1;const n=[...c,40].map(b=>{const x=b-prev;prev=b;return x});
  const e={ts:Date.now(),mode:S.mode,topic:S.topic,q:$('#q').value.trim(),n};
  if(S.mode==='trei'){e.signs=sample([...SIGNS.keys()],3);const peb=[0,0,0];for(let i=0;i<3;i++)peb[rnd(3)]++;e.peb=peb}
  if(S.mode==='oltenia'){const key=e.q.toLowerCase()+'|'+e.topic,day=new Date().toDateString(),L=store.get('last',{});e.twice=L.key===key&&L.day===day;store.set('last',{key,day})}
  S.cur=e;S.stage=2;const h=store.get('hist',[]);h.unshift(e);store.set('hist',h.slice(0,40));renderStage();renderResult();$('#result').scrollIntoView({behavior:'smooth',block:'start'})}
function renderMatrix(el,e){const R=[t('r_head'),t('r_heart'),t('r_feet')];let h='<div class="mx">';
  for(let r=0;r<3;r++){h+=`<div class="mxr"><b>${R[r]}</b>`;for(let c=0;c<3;c++){const n=e.n[r*3+c],v=n%4||4;h+=`<div class="mc ${v%2?'od':'ev'}"><span class="mv">${v}</span><span class="small">${n} ${t('u_beans')}</span></div>`}h+='</div>'}
  h+=`</div><div class="btns"><button class="btn sec" id="bagain">${t('b_again')}</button></div>`;el.innerHTML=h;$('#bagain').onclick=resetAll}
function renderPiles(el){const e=S.cur;if(isM(e))return renderMatrix(el,e);const P=[t('p_past'),t('p_pres'),t('p_fut')];let h='<div class="piles">';
  e.n.forEach((n,k)=>{const r=n%3||3;const full=r===3?n/3-1:Math.floor(n/3);const left=r;let b='';
    const tri=(m,c)=>`<span class="tri${c?' left':''}">${'<i class="mb"></i>'.repeat(m)}</span>`;
    for(let i=0;i<full;i++)b+=tri(3,false);b+=tri(left,true);
    h+=`<div class="pile p${k}"><div class="ph"><b>${P[k]}</b><span>${n} ${t('u_beans')} → ${t('s'+r)}</span></div>${b}</div>`});
  h+=`</div><div class="btns"><button class="btn sec" id="bagain">${t('b_again')}</button></div>`;el.innerHTML=h;$('#bagain').onclick=resetAll}
function resetAll(){S.stage=0;S.cuts=[];S.cur=null;$('#result').innerHTML='';renderStage()}
function resultData(e){const P=[t('p_past'),t('p_pres'),t('p_fut')];const r=e.n.map(x=>x%3||3);const rows=r.map((s,k)=>{const sg=SIGNS[e.signs[k]];return{pos:P[k],head:`${e.n[k]} ${t('u_beans')} → ${t('s'+s)}`,text:READ[e.topic][k][s-1],sign:`${sg[0]} ${t('sign_l')}: ${sg[1]} — ${sg[2]}.`,peb:e.peb[k]?(PEB[k]+(e.peb[k]>1?' (×'+e.peb[k]+')':'')):''}});
  const key=[...r].sort().join(',');const verd=VERD[key]||'';const adv=ADV[e.ts%ADV.length];return{rows,verd,adv,sid:SUGG[e.topic]}}
const LINES=[[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],[[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],[[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]];
function resultMatrix(e){const v=stOf(e);const M=[0,1,2].map(r=>v.slice(r*3,r*3+3));const R=[t('r_head'),t('r_heart'),t('r_feet')];const ol=e.mode==='oltenia';const parts=[];const O=CT.OLT,F=(x,n)=>x.replace('{n}',n);
  let h='<div class="card">';h+=`<p class="q">${e.q?'“'+esc(e.q)+'” — ':''}${t('tp_'+e.topic)} · ${t(ol?'mode_o':'mode_9')}</p>`;
  if(e.twice)h+=`<p class="pb">⚠️ ${t('warn_twice')}</p>`;
  if(e.q)parts.push('“'+e.q+'”');
  M.forEach((r,i)=>{const k=r.filter(x=>x%2).length;const head=r.map(x=>x+' '+CELLN[x-1]).join(' · ');h+=`<div class="rc"><div class="rh"><b>${R[i]}</b><span>${head}</span></div><p>${ROWT[i][k]}</p></div>`;parts.push(R[i]+': '+head+'\n'+ROWT[i][k])});
  const sp=[];
  if(M[0][0]%2===0&&M[2][2]%2===0)sp.push(CT.SP.cump);
  if(M[2].every(x=>x%2))sp.push(CT.SP.drum);
  if(LINES.some(l=>l.every(([r,c])=>M[r][c]===3)))sp.push(CT.SP.linie);
  if(ol){const o=[];
    o.push(M[1][1]===4?O.casa4:F(M[1][1]===1?O.casa_1:O.casa_n,M[1][1]));
    const sum=M[0].reduce((a,b)=>a+b,0);o.push(sum===5?O.sum5:sum===9?O.sum9:F(O.sumN,sum));
    const g=[];
    M[0].forEach(x=>{if(x===1)g.push(O.bob_sus);if(x===3)g.push(O.colac_cap)});
    if(M[2][2]===1)g.push(O.sositor_strict);else if(M[2].includes(1))g.push(O.sositor_wide);
    if(M[2][1]===3)g.push(O.prag_strict);else if(M[2].includes(3))g.push(O.prag_wide);
    v.forEach(x=>{if(x===2)g.push(O.doua)});
    if(LINES.some(l=>l.every(([r,c])=>M[r][c]===M[l[0][0]][l[0][1]]&&(M[r][c]===2||M[r][c]===3))))g.push(O.linie);
    const uniq=[...new Set(g)];
    h+=`<div class="rc"><div class="rh"><b>${O.title}</b></div>${o.map(x=>`<p>${x}</p>`).join('')}${uniq.map(x=>`<p class="sg">${x}</p>`).join('')}<p class="small">${O.desc_lbl}</p><div class="verse">${esc(O.desc)}</div><p class="small">${O.short_lbl}</p><div class="verse">${esc(O.desc2)}</div></div>`;
    parts.push(O.title+'\n'+o.join('\n')+'\n'+uniq.join('\n')+'\n'+O.desc+'\n\n'+O.desc2)}
  if(sp.length){h+=`<div class="rc"><div class="rh"><b>★</b></div>${sp.map(x=>`<p class="sg">${x}</p>`).join('')}</div>`;parts.push(sp.join('\n'))}
  const tot=v.filter(x=>x%2).length;const yn=tot>=7?CT.YN[0]:tot>=5?CT.YN[1]:tot>=3?CT.YN[2]:CT.YN[3];
  const adv=ADV[e.ts%ADV.length],ds=DESC.find(x=>x.id===SUGG[e.topic]);parts.push(yn+'\n'+adv);
  h+=`<div class="verd"><b>${t('verdict_l')}</b> <span class="small">(${tot}/9)</span><p>${yn}</p><p><i>${adv}</i></p><p class="small">${t('sugg_l')}: <b>${ds.t}</b></p><div class="btns"><button class="btn sec" id="bopen">${t('open_l')}</button><button class="btn sec" id="bcopyr">${t('b_copy')}</button></div></div></div>`;
  $('#result').innerHTML=h;$('#bopen').onclick=()=>openDesc(ds.id);$('#bcopyr').onclick=ev=>copyText(parts.join('\n\n'),ev.target)}
function renderResult(){const e=S.cur;if(!e){$('#result').innerHTML='';return}if(isM(e)){resultMatrix(e);return}const d=resultData(e);let h='<div class="card">';
  if(e.q)h+=`<p class="q">“${esc(e.q)}” — ${t('tp_'+e.topic)}</p>`;else h+=`<p class="q">${t('tp_'+e.topic)}</p>`;
  d.rows.forEach(r=>{h+=`<div class="rc"><div class="rh"><b>${r.pos}</b><span>${r.head}</span></div><p>${r.text}</p><p class="sg">${r.sign}</p>${r.peb?`<p class="pb">🪨 ${r.peb}</p>`:''}</div>`});
  const ds=DESC.find(x=>x.id===d.sid);
  h+=`<div class="verd"><b>${t('verdict_l')}</b><p>${d.verd}</p><p><i>${d.adv}</i></p><p class="small">${t('sugg_l')}: <b>${ds.t}</b></p><div class="btns"><button class="btn sec" id="bopen">${t('open_l')}</button><button class="btn sec" id="bcopyr">${t('b_copy')}</button></div></div></div>`;
  $('#result').innerHTML=h;$('#bopen').onclick=()=>openDesc(d.sid);
  $('#bcopyr').onclick=ev=>{let s=(e.q?'“'+e.q+'”\n':'')+t('tp_'+e.topic)+'\n\n';d.rows.forEach(r=>{s+=`${r.pos} (${r.head})\n${r.text}\n${r.sign}\n${r.peb?r.peb+'\n':''}\n`});s+=d.verd+'\n'+d.adv;copyText(s,ev.target)}}

/* ====== descântece ====== */
function moonAge(d){const syn=29.530588853;const ref=Date.UTC(2000,0,6,18,14);return(((d.getTime()-ref)/86400000)%syn+syn)%syn}
function renderMoon(){const syn=29.530588853,age=moonAge(new Date());const i=Math.floor(age/syn*8+0.5)%8;const em=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i];const tip=i===4?'mt_full':i<4?'mt_wax':'mt_wane';
  $('#moon').innerHTML=`<div class="moon"><div class="mi">${em}</div><div><b>${t('m'+i)}</b><div class="small">${t('age_l')}: ${age.toFixed(1)} ${t('days_l')}</div><div>${t(tip)}</div></div></div>`}
function renderCounter(){$('#ktargets').innerHTML=[3,7,9,12].map(n=>`<button class="chip${S.kt===n?' on':''}" data-n="${n}">${n}</button>`).join('');
  $$('#ktargets .chip').forEach(b=>b.onclick=()=>{S.kt=+b.dataset.n;store.set('kt',S.kt);S.kn=0;renderCounter()});
  $('#kcount').textContent=S.kn+' / '+S.kt;$('#kdone').textContent=S.kn>=S.kt?t('k_done'):''}
$('#kbtn').onclick=()=>{if(S.kn<S.kt){S.kn++;if(navigator.vibrate)try{navigator.vibrate(S.kn>=S.kt?[60,40,60]:25)}catch(e){}}renderCounter()};
$('#kreset').onclick=()=>{S.kn=0;renderCounter()};
function renderDescList(){const cs=['all',...CATS];$('#chips').innerHTML=cs.map(c=>`<button class="chip${S.fcat===c?' on':''}" data-c="${c}">${c==='all'?t('f_all'):catName(c)}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.onclick=()=>{S.fcat=b.dataset.c;renderDescList()});
  $('#dlist').innerHTML=DESC.filter(d=>S.fcat==='all'||d.cat===S.fcat).map(d=>`<details id="d-${d.id}"><summary><span>${d.t}</span><span class="tag">${catName(d.cat)}</span></summary><div class="dbody"><h3>${t('d_when')}</h3><div>${d.cand}</div><h3>${t('d_mat')}</h3><ul>${d.mat.map(x=>`<li>${x}</li>`).join('')}</ul><h3>${t('d_steps')}</h3><ol>${d.pas.map(x=>`<li>${x}</li>`).join('')}</ol><h3>${t('d_text')}</h3><div class="verse">${d.txt}</div>${d.nota?`<h3>${t('d_note')}</h3><div class="small">${d.nota}</div>`:''}<div class="btns"><button class="btn sec cpd" data-id="${d.id}">${t('b_copy')}</button></div></div></details>`).join('');
  $$('.cpd').forEach(b=>b.onclick=()=>{const d=DESC.find(x=>x.id===b.dataset.id);copyText(d.t+'\n\n'+d.txt,b)})}
function openDesc(id){switchTab('desc');S.fcat='all';renderDescList();const el=$('#d-'+id);if(el){el.open=true;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50)}}
function renderGen(){const gp=$('#gp'),ge=$('#ge');const pv=gp.value,ev=ge.value;gp.innerHTML=CATS.map(c=>`<option value="${c}">${catName(c)}</option>`).join('');ge.innerHTML=Object.keys(ELEM).map(k=>`<option value="${k}">${t('e_'+k)}</option>`).join('');if(pv)gp.value=pv;if(ev)ge.value=ev}
$('#gmake').onclick=()=>{const c=$('#gp').value,e=$('#ge').value,n=$('#gn').value.trim();const L=[];if(n)L.push(CT.GEN_FOR.replace('{n}',n));L.push(pick(ELEM[e]));L.push(...sample(CORE[c],3));L.push(pick(IMG));L.push(SEAL);S.gtxt=L.join('\n');const o=$('#gout');o.textContent=S.gtxt;o.style.display='block'};
$('#gcopy').onclick=ev=>{if(S.gtxt)copyText(S.gtxt,ev.target)};

/* ====== istoric ====== */
function renderHist(){const h=store.get('hist',[]);const L=$('#hlist');
  if(!h.length){L.innerHTML=`<div class="card">${t('h_empty')}</div>`;$('#hclear').style.display='none';return}
  $('#hclear').style.display='';
  L.innerHTML=h.map((e,i)=>`<div class="hrow"><div><div class="ht">${new Date(e.ts).toLocaleString(LANGS[li][0])} · ${t('tp_'+e.topic)}</div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.q?esc(e.q):'—'} · ${stOf(e).join('-')}</div></div><button class="btn sec" data-h="${i}">${t('h_view')}</button></div>`).join('');
  $$('#hlist button').forEach(b=>b.onclick=()=>{S.cur=h[+b.dataset.h];S.topic=S.cur.topic;S.mode=S.cur.mode||'trei';S.stage=2;switchTab('bobi');renderTopics();renderModes();renderStage();renderResult()})}
$('#hclear').onclick=()=>{store.set('hist',[]);renderHist()};

/* ====== limbă ====== */
function applyI18n(){setCT();renderGuide();document.documentElement.lang=LANGS[li][0];$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  renderTopics();renderModes();renderMoon();renderCounter();renderDescList();renderGen();renderHist();
  renderStage();if(S.stage===2&&S.cur)renderResult()}
const ls=$('#lang');ls.innerHTML=LANGS.map((l,i)=>`<option value="${i}">${l[1]}</option>`).join('');
li=store.get('lang',0);if(!(li>=0&&li<LANGS.length))li=0;ls.value=li;
ls.onchange=()=>{li=+ls.value;store.set('lang',li);applyI18n()};

/* ====== pornire ====== */
applyI18n();
</script>
